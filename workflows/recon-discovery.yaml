name: recon-discovery
vars:
  wordlists: /home/k1nzx
  tools_root: /home/k1nzx
steps:
  - id: gobuster
    name: gobuster dir brute
    run: 'gobuster dir -u https://{target} -w {vars.wordlists}/common.txt -b 404,403,400 -t 50 -o {workspace}/gobuster.txt'
    skip_if_exists: true
    outputs:
      gobuster_file: '{workspace}/gobuster.txt'
    requires:
      - path: '{workspace}/gobuster.txt'
        min_bytes: 0
  - id: dirsearch
    name: dirsearch
    run: 'dirsearch -u https://{target} -x 400,404,403 -o {workspace}/dirsearch.txt'
    skip_if_exists: true
    outputs:
      dirsearch_file: '{workspace}/dirsearch.txt'
    requires:
      - path: '{workspace}/dirsearch.txt'
        min_bytes: 0
  - id: ffuf_directory
    name: ffuf directory list
    run: 'ffuf -u https://{target}/FUZZ -w {vars.wordlists}/common.txt -mc 200,301,302,500,401 -fc 404,403,400 -o {workspace}/ffuf.json'
    skip_if_exists: true
    outputs:
      ffuf_directory_file: '{workspace}/ffuf.json'
    requires:
      - path: '{workspace}/ffuf.json'
        min_bytes: 0
  - id: fuzzuli
    name: fuzzuli
    run: 'export PATH=$PATH:$(go env GOPATH)/bin; echo https://{target} | fuzzuli -mt all > {workspace}/fuzzuli.txt'
    skip_if_exists: true
    outputs:
      fuzzuli_file: '{workspace}/fuzzuli.txt'
    requires:
      - path: '{workspace}/fuzzuli.txt'
        min_bytes: 0
  - id: swaggerspy
    name: SwaggerSpy
    run: 'python {vars.tools_root}/SwaggerSpy/swaggerspy.py {target} > {workspace}/swaggerspy.txt'
    skip_if_exists: true
    outputs:
      swaggerspy_file: '{workspace}/swaggerspy.txt'
    requires:
      - path: '{workspace}/swaggerspy.txt'
        min_bytes: 0

