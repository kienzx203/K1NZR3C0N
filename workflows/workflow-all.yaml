name: workflow-all
description: 'All-in-one: everything from 01-full-recon-pipeline + 02-js-secrets-recon + 03-param-discovery + 04-subdomain-deep-recon merged into a single optimized DAG. Crawling/URL-collection is shared (not repeated per phase); pivot discoveries (crt.sh/amass/favicon-hash/uncover/vhost-IP-fuzz/IP-CIDR reverse) feed the SAME resolved-host list used by portscan/httpx/JS/dirbrute/param-discovery/vuln-scan, so every downstream step benefits from every discovery technique in one pass.'
vars:
  run_passive: 'true'
  run_amass_passive: 'true'
  run_amass_intel: 'true'
  run_amass_active: 'false'
  run_crtsh: 'true'
  run_uncover_cert: 'true'
  run_uncover_org: 'true'
  run_hackertarget_reverseip: 'true'   # hackertarget.com free tier — ~50 req/day per source IP, shared across both hackertarget steps
  run_waymore: 'true'
  run_asn: 'true'
  run_active_dns: 'true'
  run_permutation: 'true'
  run_alterx_resolve: 'false'   # temporarily off — the slow half of permutation_dns (alterx -limit 50000 + dnsx), was reading as a hang
  run_tlsx: 'true'
  run_favicon_pivot: 'true'
  run_vhost_ip_fuzz: 'true'
  run_ip_pivot: 'true'
  run_portscan: 'true'
  run_asn_portscan: 'true'
  run_deep_portscan: 'false'
  run_screenshot: 'true'
  run_cdncheck: 'true'
  run_crawl: 'true'
  run_js_analysis: 'true'
  run_linkfinder: 'true'
  run_jsubfinder: 'true'
  run_secretfinder: 'true'
  run_static_secrets: 'true'
  run_nuclei_js: 'true'
  run_gf: 'true'
  run_dirbrute: 'true'
  run_takeover: 'true'
  run_s3scan: 'true'
  run_params: 'true'
  run_fallparams: 'true'
  run_arjun: 'true'
  run_x8: 'true'
  run_ffuf_params: 'true'
  run_nuclei: 'true'
  run_nuclei_params: 'true'
  run_afrog: 'true'
  session_cookie: ''
  auth_header: ''
  custom_header: ''
  method: GET
  org_name: ''
  subdomains_list: ''
  chaos_key: ''
  sub_wordlist: /app/wordlists/subdomains-top1million-5000.txt
  sub_wordlist_full: /app/wordlists/subdomains-top1million-5000.txt
  amass_brute_wordlist: /app/wordlists/subdomains-top1million-20000.txt
  vhost_wordlist: /app/wordlists/subdomains-top1million-5000.txt
  dir_wordlist: /app/wordlists/common.txt
  dir_wordlist_quick_lines: '1500'
  param_wordlist: /app/wordlists/params-medium.txt
  dns_resolvers: 1.1.1.1,8.8.8.8,1.0.0.1,8.8.4.4,9.9.9.9,208.67.222.222
  dnsx_threads: '150'
  dnsx_retry: '3'
  shuffledns_threads: '5000'
  naabu_rate: '1500'
  naabu_top_ports: '1000'
  rustscan_batch: '5000'
  rustscan_timeout_ms: '2000'
  nmap_flags: -sV -sC -Pn --open -T4 --max-retries 2 --stats-every 30s
  httpx_threads: '100'
  httpx_timeout: '10'
  katana_depth: '3'
  katana_concurrency: '20'
  katana_crawl_timeout: 10m
  screenshot_threads: '10'
  nuclei_rl: '150'
  nuclei_concurrency: '25'
  nuclei_timeout: '10'
  ffuf_path_threads: '40'
  dirsearch_threads: '30'
  ferox_threads: '50'
  arjun_rate: '10'
  arjun_threads: '5'
  ffuf_threads: '40'
  ffuf_filter_size: ''
  vhost_ip_fuzz_max_ips: '20'
  vhost_ip_fuzz_threads: '40'
  ip_pivot_prefix: '24'
  ip_pivot_max_ranges: '5'
  scripts_dir: /app
  oneforall_cmd: python /opt/OneForAll/oneforall.py
steps:
- id: setup_subfinder_keys
  name: '[setup] verify subfinder + uncover provider keys (supplement tasks.py config)'
  shell: true
  run: |
    # tasks.py writes full provider-config.yaml from /keys UI DB before this runs.
    # This step only SUPPLEMENTS with env-var-only keys not yet in DB.
    mkdir -p ~/.config/subfinder ~/.config/uncover
    EXISTING_SF=/root/.config/subfinder/provider-config.yaml
    {
      cat "$EXISTING_SF" 2>/dev/null || true
      ST_T="${SECURITYTRAILS_KEY:-}"
      [ -n "$ST_T" ] && ! grep -q '^securitytrails:' "$EXISTING_SF" 2>/dev/null && \
        printf 'securitytrails:\n  - %s\n' "$ST_T"
      VT_T="${VIRUSTOTAL_KEY:-}"
      [ -n "$VT_T" ] && ! grep -q '^virustotal:' "$EXISTING_SF" 2>/dev/null && \
        printf 'virustotal:\n  - %s\n' "$VT_T"
      ZY_T="${ZOOMEYE_API_KEY:-}"
      [ -n "$ZY_T" ] && ! grep -q '^zoomeyeapi:' "$EXISTING_SF" 2>/dev/null && \
        printf 'zoomeyeapi:\n  - %s\n' "$ZY_T"
      HT_T="${HACKERTARGET_API_KEY:-}"
      [ -n "$HT_T" ] && ! grep -q '^hackertarget:' "$EXISTING_SF" 2>/dev/null && \
        printf 'hackertarget:\n  - %s\n' "$HT_T"
    } > /tmp/.sf_merged.yaml 2>/dev/null || true
    [ -s /tmp/.sf_merged.yaml ] && cp /tmp/.sf_merged.yaml "$EXISTING_SF"
    EXISTING_UC=/root/.config/uncover/provider-config.yaml
    {
      cat "$EXISTING_UC" 2>/dev/null || true
      HUNTER_T="${HUNTER_API_KEY:-}"
      [ -n "$HUNTER_T" ] && ! grep -q '^hunter:' "$EXISTING_UC" 2>/dev/null && \
        printf 'hunter:\n  - %s\n' "$HUNTER_T"
      GN_T="${GREYNOISE_API_KEY:-}"
      [ -n "$GN_T" ] && ! grep -q '^greynoise:' "$EXISTING_UC" 2>/dev/null && \
        printf 'greynoise:\n  - %s\n' "$GN_T"
    } > /tmp/.uc_merged.yaml 2>/dev/null || true
    [ -s /tmp/.uc_merged.yaml ] && cp /tmp/.uc_merged.yaml "$EXISTING_UC"
    ACTIVE=$(grep -c '^\w' ~/.config/subfinder/provider-config.yaml 2>/dev/null || echo 0)
    ACTIVE_UC=$(grep -c '^\w' ~/.config/uncover/provider-config.yaml 2>/dev/null || echo 0)
    printf '[setup] subfinder: %s providers | uncover: %s providers\n' "$ACTIVE" "$ACTIVE_UC"
    printf '[setup] sources: %s\n' \
      "$(grep '^\w' ~/.config/subfinder/provider-config.yaml 2>/dev/null | tr -d ':' | tr '\n' ',' | sed 's/,$//')"
    touch {workspace}/.setup_done
  outputs:
    file: '{workspace}/.setup_done'
- id: p_subfinder
  name: '[passive] subfinder — cert transparency + 80+ passive APIs'
  when: '{vars.run_passive}'
  depends_on:
  - setup_subfinder_keys
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 10m
  run: |
    subfinder -d {target} -silent -all -recursive -timeout 60 \
      2>/dev/null > {workspace}/p_subfinder.txt || true
    touch {workspace}/p_subfinder.txt
    printf 'subfinder: %s subdomains\n' "$(wc -l < {workspace}/p_subfinder.txt)"
  outputs:
    file: '{workspace}/p_subfinder.txt'
- id: p_assetfinder
  name: '[passive] assetfinder — Facebook CT + various APIs'
  when: '{vars.run_passive}'
  shell: true
  optional: true
  skip_if_exists: true
  run: assetfinder --subs-only {target} > {workspace}/p_assetfinder.txt 2>/dev/null; touch {workspace}/p_assetfinder.txt
  outputs:
    file: '{workspace}/p_assetfinder.txt'
- id: p_findomain
  name: '[passive] findomain — certificate transparency + APIs'
  when: '{vars.run_passive}'
  optional: true
  skip_if_exists: true
  run: findomain -t {target} -q -u {workspace}/p_findomain.txt
  outputs:
    file: '{workspace}/p_findomain.txt'
- id: p_sublist3r
  name: '[passive] sublist3r — search engines (Google/Bing/Baidu/Netcraft)'
  when: '{vars.run_passive}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 10m
  run: sublist3r -d {target} -o {workspace}/p_sublist3r.txt 2>/dev/null; touch {workspace}/p_sublist3r.txt
  outputs:
    file: '{workspace}/p_sublist3r.txt'
- id: p_amass_passive
  name: '[passive] amass — OWASP passive multi-source'
  when: '{vars.run_passive} && {vars.run_amass_passive}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 30m
  run: amass enum -passive -d {target} -silent -o {workspace}/p_amass_passive.txt 2>/dev/null; touch {workspace}/p_amass_passive.txt
  outputs:
    file: '{workspace}/p_amass_passive.txt'
- id: p_chaos
  name: '[passive] chaos — ProjectDiscovery bug-bounty dataset'
  when: '{vars.run_passive}'
  shell: true
  optional: true
  skip_if_exists: true
  run: |
    CHAOS_KEY="${CHAOS_API_KEY:-{vars.chaos_key}}"
    if [ -z "$CHAOS_KEY" ]; then
      echo "[chaos] no CHAOS_API_KEY — skipping (add via /keys UI to enable)"
      touch {workspace}/p_chaos.txt; exit 0
    fi
    chaos -d {target} -silent -key "$CHAOS_KEY" -o {workspace}/p_chaos.txt 2>/dev/null
    touch {workspace}/p_chaos.txt
    printf '[chaos] %s subdomains\n' "$(wc -l < {workspace}/p_chaos.txt)"
  outputs:
    file: '{workspace}/p_chaos.txt'
- id: p_oneforall
  name: '[passive] OneForAll — comprehensive 60-source aggregator'
  when: '{vars.run_passive}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 45m
  run: mkdir -p {workspace}/oneforall && {vars.oneforall_cmd} --target {target} --path {workspace}/oneforall --fmt csv run 2>/dev/null; true
  outputs:
    dir: '{workspace}/oneforall'
- id: p_oneforall_extract
  name: '[passive] OneForAll — extract subdomains from CSV'
  depends_on:
  - p_oneforall
  shell: true
  optional: true
  run: python {vars.scripts_dir}/scripts/oneforall_extract.py --input {workspace}/oneforall --output {workspace}/p_oneforall.txt 2>/dev/null; touch {workspace}/p_oneforall.txt
  outputs:
    file: '{workspace}/p_oneforall.txt'
- id: p_cero
  name: '[passive] cero — TLS certificate SAN extraction via SNI'
  when: '{vars.run_passive}'
  shell: true
  optional: true
  skip_if_exists: true
  run: cero {target} 2>/dev/null | grep -F ".{target}" | sed 's/^\*\.//' | sort -u > {workspace}/p_cero.txt; touch {workspace}/p_cero.txt
  outputs:
    file: '{workspace}/p_cero.txt'
- id: p_crtsh
  name: '[cert] crt.sh — Certificate Transparency log query'
  when: '{vars.run_passive} && {vars.run_crtsh}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 3m
  run: curl -s --max-time 60 "https://crt.sh/?q=%25.{target}&output=json" | jq -r '.[].name_value' 2>/dev/null | tr ',' '\n' | sed 's/^\*\.//' | sort -u > {workspace}/p_crtsh.txt || true; touch {workspace}/p_crtsh.txt
  outputs:
    file: '{workspace}/p_crtsh.txt'
- id: uncover_cert
  name: '[scan-engine] uncover — Shodan/Fofa/Censys/Hunter/Netlas by cert CN'
  when: '{vars.run_passive} && {vars.run_uncover_cert}'
  shell: true
  optional: true
  skip_if_exists: true
  run: uncover -q "ssl.cert.subject.cn:{target}" -silent 2>/dev/null | grep -F ".{target}" | sort -u > {workspace}/uncover_cert.txt; touch {workspace}/uncover_cert.txt
  outputs:
    file: '{workspace}/uncover_cert.txt'
- id: uncover_org
  name: '[scan-engine] uncover — search by organization name across engines'
  when: '{vars.run_uncover_org} && {vars.org_name}'
  shell: true
  optional: true
  skip_if_exists: true
  run: uncover -q "org:\"{vars.org_name}\"" -e shodan,fofa,zoomeye -silent 2>/dev/null | sort -u > {workspace}/uncover_org_raw.txt; touch {workspace}/uncover_org_raw.txt
  outputs:
    file: '{workspace}/uncover_org_raw.txt'
- id: uncover_org_filter
  name: '[scan-engine] split org-search results — in-scope vs off-domain'
  depends_on:
  - uncover_org
  when: '{vars.run_uncover_org} && {vars.org_name}'
  run_on_failed_deps: true
  shell: true
  optional: true
  run: "touch {workspace}/uncover_org_in_scope.txt {workspace}/uncover_org_offdomain.txt\ntest -s {workspace}/uncover_org_raw.txt || exit 0\nsed 's|https\\?://||; s|/.*||; s|:.*||' {workspace}/uncover_org_raw.txt \\\n  | tr '[:upper:]' '[:lower:]' | sort -u > {workspace}/uncover_org_hosts.txt\ngrep -E '^[a-z0-9][a-z0-9._-]*\\.[a-z]{2,}$' {workspace}/uncover_org_hosts.txt \\\n  | awk -v t=\"{target}\" 'length($0)>=length(t) && substr($0,length($0)-length(t)+1)==t' \\\n  | sort -u > {workspace}/uncover_org_in_scope.txt || true\ncomm -23 <(sort {workspace}/uncover_org_hosts.txt) <(sort {workspace}/uncover_org_in_scope.txt) \\\n  > {workspace}/uncover_org_offdomain.txt 2>/dev/null || true\ntouch {workspace}/uncover_org_in_scope.txt {workspace}/uncover_org_offdomain.txt\n"
  outputs:
    in_scope: '{workspace}/uncover_org_in_scope.txt'
    offdomain: '{workspace}/uncover_org_offdomain.txt'
- id: p_waybackurls
  name: '[passive] waybackurls — extract subdomains from Wayback Machine URLs'
  when: '{vars.run_passive}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 10m
  run: echo {target} | timeout 300 waybackurls 2>/dev/null | tee {workspace}/p_waybackurls_urls.txt | grep -oP '(?:https?://)\K[a-zA-Z0-9._-]+\.{target}(?=[/?#]|$)' | sort -u > {workspace}/p_waybackurls_subs.txt; touch {workspace}/p_waybackurls_subs.txt {workspace}/p_waybackurls_urls.txt
  outputs:
    file: '{workspace}/p_waybackurls_subs.txt'
    urls: '{workspace}/p_waybackurls_urls.txt'
- id: p_gau
  name: '[passive] gau — extract subdomains from GAU URL archive'
  when: '{vars.run_passive}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 10m
  run: gau --subs {target} --threads 5 --timeout 30 2>/dev/null | tee {workspace}/p_gau_urls.txt | grep -oP '(?:https?://)\K[a-zA-Z0-9._-]+\.{target}(?=[/?#]|$)' | sort -u > {workspace}/p_gau_subs.txt; touch {workspace}/p_gau_subs.txt {workspace}/p_gau_urls.txt
  outputs:
    file: '{workspace}/p_gau_subs.txt'
    urls: '{workspace}/p_gau_urls.txt'
- id: p_waymore
  name: '[passive] waymore — Wayback+CommonCrawl+OTX+URLScan URL archive → subdomains'
  when: '{vars.run_passive} && {vars.run_waymore}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 15m
  run: waymore -i {target} -mode U -oU {workspace}/p_waymore_urls.txt -t 120 2>/dev/null || true; test -f {workspace}/p_waymore_urls.txt && grep -oP '(?:https?://)\K[a-zA-Z0-9._-]+\.{target}(?=[/?#]|$)' {workspace}/p_waymore_urls.txt | sort -u > {workspace}/p_waymore_subs.txt || true; touch {workspace}/p_waymore_subs.txt {workspace}/p_waymore_urls.txt
  outputs:
    subs: '{workspace}/p_waymore_subs.txt'
    urls: '{workspace}/p_waymore_urls.txt'
- id: p_urlfinder
  name: '[passive] urlfinder — Wayback+AlienVault+CommonCrawl+URLScan URL archive → subdomains'
  when: '{vars.run_passive} && {vars.run_waymore}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 10m
  run: urlfinder -d {target} -silent -o {workspace}/p_urlfinder_urls.txt 2>/dev/null || true; test -f {workspace}/p_urlfinder_urls.txt && grep -oP '(?:https?://)\K[a-zA-Z0-9._-]+\.{target}(?=[/?#]|$)' {workspace}/p_urlfinder_urls.txt | sort -u > {workspace}/p_urlfinder_subs.txt || true; touch {workspace}/p_urlfinder_subs.txt {workspace}/p_urlfinder_urls.txt
  outputs:
    subs: '{workspace}/p_urlfinder_subs.txt'
    urls: '{workspace}/p_urlfinder_urls.txt'
- id: hackertarget_hostsearch
  name: '[passive] hackertarget — Find DNS Host Records (hostsearch API, free tier ~50 req/day)'
  when: '{vars.run_passive}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 30s
  run: |
    curl -s --max-time 20 "https://api.hackertarget.com/hostsearch/?q={target}" 2>/dev/null > {workspace}/hackertarget_hostsearch_raw.txt
    touch {workspace}/hackertarget_hostsearch_raw.txt
    cut -d',' -f1 {workspace}/hackertarget_hostsearch_raw.txt | tr '[:upper:]' '[:lower:]' | grep -E '^[a-z0-9][a-z0-9._-]*\.[a-z]{2,}$' | sort -u > {workspace}/p_hackertarget.txt || true
    touch {workspace}/p_hackertarget.txt
  outputs:
    file: '{workspace}/p_hackertarget.txt'
    raw_with_a_records: '{workspace}/hackertarget_hostsearch_raw.txt'
- id: amass_intel
  name: '[amass] amass intel — org/whois-based ASN pivot discovery'
  when: '{vars.run_amass_intel} && {vars.org_name}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 15m
  run: amass intel -org "{vars.org_name}" -o {workspace}/amass_intel.txt 2>/dev/null; touch {workspace}/amass_intel.txt
  outputs:
    file: '{workspace}/amass_intel.txt'
- id: amass_intel_extract
  name: '[amass] extract CIDR ranges from amass intel org lookup'
  depends_on:
  - amass_intel
  shell: true
  optional: true
  run: grep -oE '[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}/[0-9]+' {workspace}/amass_intel.txt 2>/dev/null | sort -u > {workspace}/amass_intel_cidrs.txt || true; touch {workspace}/amass_intel_cidrs.txt
  outputs:
    file: '{workspace}/amass_intel_cidrs.txt'
- id: amass_active
  name: '[amass] amass enum -active -brute — aggressive active enum (touches target directly)'
  when: '{vars.run_amass_active}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 45m
  run: amass enum -active -brute -w {vars.amass_brute_wordlist} -d {target} -silent -o {workspace}/amass_active.txt 2>/dev/null; touch {workspace}/amass_active.txt
  outputs:
    file: '{workspace}/amass_active.txt'
- id: asn_discover
  name: '[ASN] metabigor — discover IP/CIDR ranges for org (local ASN DB, no API key)'
  when: '{vars.run_asn}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 5m
  run: "(\n  echo '{target}' | metabigor net --domain 2>/dev/null || true;\n  test -n '{vars.org_name}' && echo '{vars.org_name}' | metabigor net --org 2>/dev/null || true\n) | grep -oE '[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}/[0-9]+' | sort -u > {workspace}/asn_ipv4_cidrs.txt || true; touch {workspace}/asn_ipv4_cidrs.txt; printf 'ASN IPv4 CIDRs discovered: %s\\n' \"$(wc -l < {workspace}/asn_ipv4_cidrs.txt)\" > {workspace}/asn_stats.txt"
  outputs:
    ipv4_cidrs: '{workspace}/asn_ipv4_cidrs.txt'
- id: merge_passive
  name: merge all passive + CT-log + amass + uncover sources → deduplicate + scope-filter
  depends_on:
  - p_subfinder
  - p_assetfinder
  - p_findomain
  - p_sublist3r
  - p_amass_passive
  - p_chaos
  - p_oneforall_extract
  - p_cero
  - p_crtsh
  - uncover_cert
  - uncover_org_filter
  - p_waybackurls
  - p_gau
  - p_waymore
  - p_urlfinder
  - amass_active
  - hackertarget_hostsearch
  run_on_failed_deps: true
  shell: true
  run: "(\n  printf '%s\\n%s\\n' \"{target}\" \"www.{target}\"\n  cat \\\n    {workspace}/p_subfinder.txt \\\n    {workspace}/p_assetfinder.txt \\\n    {workspace}/p_findomain.txt \\\n    {workspace}/p_sublist3r.txt \\\n    {workspace}/p_amass_passive.txt \\\n    {workspace}/p_chaos.txt \\\n    {workspace}/p_oneforall.txt \\\n    {workspace}/p_cero.txt \\\n    {workspace}/p_crtsh.txt \\\n    {workspace}/uncover_cert.txt \\\n    {workspace}/uncover_org_in_scope.txt \\\n    {workspace}/p_waybackurls_subs.txt \\\n    {workspace}/p_gau_subs.txt \\\n    {workspace}/p_waymore_subs.txt \\\n    {workspace}/p_urlfinder_subs.txt \\\n    {workspace}/amass_active.txt \\\n    {workspace}/p_hackertarget.txt \\\n    2>/dev/null || true\n  test -n '{vars.subdomains_list}' && test -f '{vars.subdomains_list}' && cat '{vars.subdomains_list}' || true\n) | sed 's|https\\?://||; s|/.*||; s|^\\*\\.||; s|\\.$||; s|[[:space:]].*||' \\\n  | tr '[:upper:]' '[:lower:]' \\\n  | grep -E '^[a-z0-9][a-z0-9._-]*\\.[a-z]{2,}$' \\\n  | awk -v t=\"{target}\" 'length($0)>=length(t) && substr($0,length($0)-length(t)+1)==t' \\\n  | sort -u > {workspace}/passive_merged.txt\n"
  outputs:
    file: '{workspace}/passive_merged.txt'
  requires:
  - path: '{workspace}/passive_merged.txt'
    min_bytes: 1
- id: active_dns_brute
  name: active DNS bruteforce — gobuster + shuffledns + puredns (parallel)
  when: '{vars.run_active_dns}'
  optional: true
  fanout_concurrency: 3
  fanout_timeout_default: 40m
  fanout:
  - id: gobuster_dns
    skip_if_exists: true
    run: gobuster dns --domain {target} -w {vars.sub_wordlist} -t 200 --resolver 1.1.1.1 --timeout 3s -q --no-fqdn --no-progress --no-error -o {workspace}/a_gobuster_dns.txt
    outputs:
      file: '{workspace}/a_gobuster_dns.txt'
    optional: true
  - id: shuffledns
    shell: true
    skip_if_exists: true
    run: printf '1.1.1.1\n1.0.0.1\n8.8.8.8\n8.8.4.4\n9.9.9.9\n208.67.222.222\n' > {workspace}/resolvers.txt; shuffledns -d {target} -w {vars.sub_wordlist} -r {workspace}/resolvers.txt -t {vars.shuffledns_threads} -silent -o {workspace}/a_shuffledns.txt 2>/dev/null; touch {workspace}/a_shuffledns.txt
    outputs:
      file: '{workspace}/a_shuffledns.txt'
    optional: true
  - id: puredns
    shell: true
    skip_if_exists: true
    run: printf '1.1.1.1\n1.0.0.1\n8.8.8.8\n8.8.4.4\n9.9.9.9\n' > {workspace}/resolvers_pure.txt; puredns bruteforce {vars.sub_wordlist_full} {target} --resolvers {workspace}/resolvers_pure.txt --wildcard-tests 5 -q 2>/dev/null | sort -u > {workspace}/a_puredns.txt; touch {workspace}/a_puredns.txt
    outputs:
      file: '{workspace}/a_puredns.txt'
    optional: true
- id: permutation_dns
  name: DNS permutation — dnsgen + alterx → resolve with dnsx
  depends_on:
  - merge_passive
  when: '{vars.run_permutation}'
  optional: true
  fanout_concurrency: 2
  fanout_timeout_default: 15m
  fanout:
  - id: dnsgen_resolve
    shell: true
    skip_if_exists: true
    timeout: 15m
    run: "printf '1.1.1.1\\n1.0.0.1\\n8.8.8.8\\n8.8.4.4\\n' > {workspace}/resolvers.txt 2>/dev/null || true\nif test -s {workspace}/passive_merged.txt; then\n  head -300 {workspace}/passive_merged.txt | dnsgen - 2>/dev/null \\\n    | shuffledns -d {target} -r {workspace}/resolvers.txt -t 3000 -silent 2>/dev/null \\\n    | sort -u > {workspace}/perm_dnsgen.txt || true\nfi\ntouch {workspace}/perm_dnsgen.txt\n"
    outputs:
      file: '{workspace}/perm_dnsgen.txt'
    optional: true
  - id: alterx_resolve
    shell: true
    skip_if_exists: true
    timeout: 15m
    when: '{vars.run_alterx_resolve}'
    run: "if test -s {workspace}/passive_merged.txt; then\n  alterx -l {workspace}/passive_merged.txt -silent -limit 50000 2>/dev/null \\\n    | dnsx -silent -r {vars.dns_resolvers} -t {vars.dnsx_threads} -retry {vars.dnsx_retry} 2>/dev/null \\\n    | sort -u > {workspace}/perm_alterx.txt || true\nfi\ntouch {workspace}/perm_alterx.txt\n"
    outputs:
      file: '{workspace}/perm_alterx.txt'
    optional: true
- id: merge_all_subdomains
  name: merge passive + active + permutation → final candidate list
  depends_on:
  - merge_passive
  - active_dns_brute
  - permutation_dns
  run_on_failed_deps: true
  shell: true
  run: "(\n  cat {workspace}/passive_merged.txt 2>/dev/null || true\n  cat \\\n    {workspace}/a_gobuster_dns.txt \\\n    {workspace}/a_shuffledns.txt \\\n    {workspace}/a_puredns.txt \\\n    {workspace}/perm_dnsgen.txt \\\n    {workspace}/perm_alterx.txt \\\n    2>/dev/null || true\n) | sed 's|https\\?://||; s|/.*||; s|^\\*\\.||; s|\\.$||; s|[[:space:]].*||' \\\n  | tr '[:upper:]' '[:lower:]' \\\n  | grep -E '^[a-z0-9][a-z0-9._-]*\\.[a-z]{2,}$' \\\n  | awk -v t=\"{target}\" 'length($0)>=length(t) && substr($0,length($0)-length(t)+1)==t' \\\n  | sort -u > {workspace}/subdomains_all.txt\n"
  outputs:
    subdomains_all: '{workspace}/subdomains_all.txt'
  requires:
  - path: '{workspace}/subdomains_all.txt'
    min_bytes: 1
- id: puredns_resolve
  name: DNS resolve pass-1 — puredns mass-resolve + wildcard filter (massdns engine)
  depends_on:
  - merge_all_subdomains
  shell: true
  optional: true
  skip_if_exists: true
  retries: 1
  timeout: 30m
  run: printf '1.1.1.1\n1.0.0.1\n8.8.8.8\n8.8.4.4\n9.9.9.9\n208.67.222.222\n' > {workspace}/resolvers_all.txt; puredns resolve {steps.merge_all_subdomains.subdomains_all} --resolvers {workspace}/resolvers_all.txt --wildcard-tests 5 --wildcard-batch 1000000 -q 2>/dev/null | sort -u > {workspace}/puredns_live.txt || true; touch {workspace}/puredns_live.txt
  outputs:
    puredns_live: '{workspace}/puredns_live.txt'
- id: dnsx_resolve
  name: DNS resolve pass-2 — dnsx enrich live hosts with A/AAAA/CNAME records (+ -resp for IP-grouping)
  depends_on:
  - puredns_resolve
  - merge_all_subdomains
  shell: true
  skip_if_exists: true
  retries: 1
  run: INPUT=$(test -s {workspace}/puredns_live.txt && echo {workspace}/puredns_live.txt || echo {steps.merge_all_subdomains.subdomains_all}); dnsx -l "$INPUT" -silent -r {vars.dns_resolvers} -t {vars.dnsx_threads} -retry {vars.dnsx_retry} -a -aaaa -cname -resp -o {workspace}/resolved_resp.txt 2>/dev/null; touch {workspace}/resolved_resp.txt; awk '{print $1}' {workspace}/resolved_resp.txt | sort -u > {workspace}/subdomains_resolved.txt; touch {workspace}/subdomains_resolved.txt
  outputs:
    resolved: '{workspace}/subdomains_resolved.txt'
    resp: '{workspace}/resolved_resp.txt'
  requires:
  - path: '{workspace}/subdomains_resolved.txt'
    min_bytes: 1
- id: tlsx_san_mine
  name: '[TLS] tlsx — scan live hosts for certificates, extract SAN entries'
  depends_on:
  - dnsx_resolve
  when: '{vars.run_tlsx}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 20m
  run: "test -s {workspace}/subdomains_resolved.txt && tlsx -l {workspace}/subdomains_resolved.txt \\\n  -san -cn -silent \\\n  -p 443,8443,4443 \\\n  -timeout 5 \\\n  -o {workspace}/tlsx_raw.txt 2>/dev/null || true\ntouch {workspace}/tlsx_raw.txt\n"
  outputs:
    file: '{workspace}/tlsx_raw.txt'
- id: tlsx_san_extract
  name: '[TLS] extract new in-scope subdomains from TLS SAN entries'
  depends_on:
  - tlsx_san_mine
  when: '{vars.run_tlsx}'
  shell: true
  optional: true
  run: "sed 's/\\x1b\\[[0-9;]*m//g' {workspace}/tlsx_raw.txt 2>/dev/null \\\n  | grep -oP '(?<=\\[)[^\\]]+(?=\\])' \\\n  | sed 's/^\\*\\.//' \\\n  | tr '[:upper:]' '[:lower:]' \\\n  | grep -E '^[a-z0-9][a-z0-9._-]*\\.[a-z]{2,}$' \\\n  | awk -v t=\"{target}\" 'length($0)>=length(t) && substr($0,length($0)-length(t)+1)==t' \\\n  | sort -u > {workspace}/tlsx_all_subs.txt || true\ncomm -23 \\\n  <(sort {workspace}/tlsx_all_subs.txt 2>/dev/null || true) \\\n  <(sort {workspace}/subdomains_resolved.txt 2>/dev/null || true) \\\n  > {workspace}/tlsx_new_subs.txt 2>/dev/null || touch {workspace}/tlsx_new_subs.txt\ntouch {workspace}/tlsx_new_subs.txt\n"
  outputs:
    file: '{workspace}/tlsx_new_subs.txt'
- id: dnsx_san_resolve
  name: '[TLS] DNS resolve TLS-discovered subdomains → enrich host list'
  depends_on:
  - tlsx_san_extract
  when: '{vars.run_tlsx}'
  shell: true
  optional: true
  run: "test -s {workspace}/tlsx_new_subs.txt && dnsx -l {workspace}/tlsx_new_subs.txt \\\n  -silent -r {vars.dns_resolvers} \\\n  -t {vars.dnsx_threads} -retry {vars.dnsx_retry} \\\n  -a -aaaa -cname \\\n  -o {workspace}/subdomains_tlsx_resolved.txt 2>/dev/null || true\ntouch {workspace}/subdomains_tlsx_resolved.txt\n"
  outputs:
    tlsx_resolved: '{workspace}/subdomains_tlsx_resolved.txt'
- id: merge_all_resolved
  name: merge DNS resolved + TLS SAN resolved → Wave-1 comprehensive host list
  depends_on:
  - dnsx_resolve
  - dnsx_san_resolve
  run_on_failed_deps: true
  shell: true
  run: "(\n  cat {workspace}/subdomains_resolved.txt 2>/dev/null || true;\n  cat {workspace}/subdomains_tlsx_resolved.txt 2>/dev/null || true\n) | sort -u > {workspace}/subdomains_all_resolved.txt; printf 'Total resolved (Wave-1: DNS+TLS): %s\\n' \"$(wc -l < {workspace}/subdomains_all_resolved.txt)\" > {workspace}/resolve_stats.txt"
  outputs:
    all_resolved: '{workspace}/subdomains_all_resolved.txt'
  requires:
  - path: '{workspace}/subdomains_all_resolved.txt'
    min_bytes: 1
- id: naabu_topscan
  name: port scan top-1000 — naabu (fast sweep all live hosts incl. TLS-discovered)
  depends_on:
  - merge_all_resolved
  when: '{vars.run_portscan}'
  optional: true
  skip_if_exists: true
  timeout: 90m
  run: naabu -list {steps.merge_all_resolved.all_resolved} -rate {vars.naabu_rate} -top-ports {vars.naabu_top_ports} -json -o {workspace}/naabu.jsonl -silent -r {vars.dns_resolvers}
  outputs:
    naabu_jsonl: '{workspace}/naabu.jsonl'
- id: naabu_asn_scan
  name: port scan ASN IP ranges — naabu on organization CIDR ranges
  depends_on:
  - asn_discover
  when: '{vars.run_asn} && {vars.run_asn_portscan}'
  optional: true
  skip_if_exists: true
  timeout: 3h
  shell: true
  run: "touch {workspace}/naabu_asn.jsonl\ntest -s {workspace}/asn_ipv4_cidrs.txt || exit 0\nTARGET_IP=$(dig +short {target} 2>/dev/null | grep -oE '[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+' | head -1)\nif [ -n \"$TARGET_IP\" ]; then\n  IS_CDN=$(echo \"$TARGET_IP\" | cdncheck -silent 2>/dev/null | head -1)\n  if [ -n \"$IS_CDN\" ]; then\n    echo \"[asn_scan skip] $TARGET_IP is CDN/WAF ($IS_CDN) — ASN ranges belong to CDN infra, not target org\"\n    exit 0\n  fi\nfi\nCIDR_COUNT=$(wc -l < {workspace}/asn_ipv4_cidrs.txt)\nif [ \"$CIDR_COUNT\" -gt 50 ]; then\n  echo \"[asn_scan skip] $CIDR_COUNT CIDRs discovered — too broad to be target-specific (CDN/cloud ASN), skipping\"\n  exit 0\nfi\necho \"[asn_scan] $CIDR_COUNT CIDRs look target-specific — proceeding with naabu scan\"\nnaabu -list {workspace}/asn_ipv4_cidrs.txt -rate {vars.naabu_rate} -top-ports 100 -json -o {workspace}/naabu_asn.jsonl -silent 2>/dev/null || true\n"
  outputs:
    file: '{workspace}/naabu_asn.jsonl'
- id: deep_portscan
  name: deep port scan — rustscan full range + nmap service detection
  depends_on:
  - merge_all_resolved
  when: '{vars.run_deep_portscan}'
  optional: true
  fanout_concurrency: 2
  fanout_timeout_default: 4h
  fanout:
  - id: rustscan_full
    shell: true
    timeout: 30m
    run: |
      PORTS=$(awk '$2 ~ /\/tcp$/ {split($2,a,"/"); print a[1], $3}' /usr/share/nmap/nmap-services 2>/dev/null | sort -k2 -rn | head -8000 | awk '{print $1}' | tr '\n' ',' | sed 's/,$//')
      test -n "$PORTS" || PORTS='1-65535'
      rustscan -a {target} -p "$PORTS" --scan-order random --batch-size {vars.rustscan_batch} --timeout {vars.rustscan_timeout_ms} --tries 2 --ulimit 5000 -- -Pn -sV -sC --open --stats-every 30s -oN {workspace}/rustscan_full.txt 2>/dev/null
      touch {workspace}/rustscan_full.txt
    outputs:
      file: '{workspace}/rustscan_full.txt'
    optional: true
  - id: nmap_service
    shell: true
    timeout: 45m
    run: test -s {workspace}/subdomains_all_resolved.txt && nmap {vars.nmap_flags} -iL {workspace}/subdomains_all_resolved.txt -oN {workspace}/nmap_service.txt 2>/dev/null; touch {workspace}/nmap_service.txt
    outputs:
      file: '{workspace}/nmap_service.txt'
    optional: true
- id: extract_web_targets
  name: extract web targets — resolved hosts + every naabu-discovered port
  depends_on:
  - merge_all_resolved
  - naabu_topscan
  run_on_failed_deps: true
  shell: true
  run: "(\n  cat {workspace}/subdomains_all_resolved.txt 2>/dev/null || true\n  # Feed every naabu host:port to httpx instead of a hardcoded web-port whitelist —\n  # httpx already auto-detects http vs https per port and fails fast on non-HTTP\n  # ports (bounded by -timeout), so a whitelist here only hides real web ports\n  # (e.g. 8000, 8090, 6443, a custom app port) that naabu already proved are open.\n  test -f {workspace}/naabu.jsonl && jq -r '\"\\(.host // .ip):\\(.port)\"' {workspace}/naabu.jsonl 2>/dev/null || true\n) | sort -u > {workspace}/web_targets.txt\n"
  outputs:
    web_targets: '{workspace}/web_targets.txt'
- id: httpx
  name: HTTP probe (Wave-1) — title / tech-detect / status / redirect chain
  depends_on:
  - extract_web_targets
  optional: true
  skip_if_exists: true
  run: '_H=''''; test -n ''{vars.session_cookie}'' && _H="$_H -H ''Cookie: {vars.session_cookie}''"; test -n ''{vars.auth_header}'' && _H="$_H -H ''Authorization: {vars.auth_header}''"; test -n ''{vars.custom_header}'' && _H="$_H -H ''{vars.custom_header}''"

    eval "httpx -l {steps.extract_web_targets.web_targets} -silent -json -o {workspace}/httpx.jsonl -td -title -status-code -content-length -follow-redirects -timeout {vars.httpx_timeout} -threads {vars.httpx_threads} -random-agent $_H"

    '
  outputs:
    httpx_jsonl: '{workspace}/httpx.jsonl'
    alive_file: '{workspace}/httpx.jsonl'
  requires:
  - path: '{workspace}/httpx.jsonl'
    min_bytes: 1
  shell: true
- id: extract_live_urls
  name: extract live URLs from httpx (Wave-1) → for crawl + vuln scan input
  depends_on:
  - httpx
  shell: true
  run: jq -r '.url // empty' {workspace}/httpx.jsonl 2>/dev/null | sort -u > {workspace}/live_urls.txt; touch {workspace}/live_urls.txt
  outputs:
    live_urls: '{workspace}/live_urls.txt'
- id: whatweb_scan
  name: whatweb — supplementary tech fingerprint (1800+ plugin signatures, merged into Inventory tech)
  depends_on:
  - extract_live_urls
  optional: true
  skip_if_exists: true
  timeout: 15m
  shell: true
  run: timeout 900 whatweb -i {workspace}/live_urls.txt --log-json={workspace}/whatweb.json -q 2>/dev/null; touch {workspace}/whatweb.json
  outputs:
    file: '{workspace}/whatweb.json'
- id: cdncheck_classify
  name: '[CDN] cdncheck — classify live hosts as CDN vs origin (guards pivot + ASN scan; only needs the resolved host list, runs in parallel with httpx instead of after it)'
  depends_on:
  - merge_all_resolved
  when: '{vars.run_cdncheck}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 10m
  run: "test -s {workspace}/subdomains_all_resolved.txt && cdncheck \\\n  -i {workspace}/subdomains_all_resolved.txt \\\n  -jsonl -o {workspace}/cdncheck.jsonl 2>/dev/null || true\ntouch {workspace}/cdncheck.jsonl\njq -r 'select(.cdn != true and .waf != true and .cloud != true) | .input' \\\n  {workspace}/cdncheck.jsonl 2>/dev/null | sort -u > {workspace}/origin_hosts.txt || true\ntouch {workspace}/origin_hosts.txt\nCDN_COUNT=$(jq -r 'select(.cdn==true or .waf==true or .cloud==true) | .input' {workspace}/cdncheck.jsonl 2>/dev/null | wc -l || echo 0)\nORIGIN_COUNT=$(wc -l < {workspace}/origin_hosts.txt 2>/dev/null || echo 0)\nprintf 'CDN hosts: %s | Origin (non-CDN) hosts: %s\\n' \"$CDN_COUNT\" \"$ORIGIN_COUNT\" >> {workspace}/resolve_stats.txt || true\n"
  outputs:
    cdncheck_jsonl: '{workspace}/cdncheck.jsonl'
    origin_hosts: '{workspace}/origin_hosts.txt'
- id: ip_group_analyze
  name: '[IP] group resolved hosts by IP — shared hosting detection'
  depends_on:
  - dnsx_resolve
  shell: true
  optional: true
  run: mkdir -p {workspace}/ip_groups; python {vars.scripts_dir}/scripts/group_by_ip.py --input {workspace}/resolved_resp.txt --output-dir {workspace}/ip_groups 2>/dev/null || true; touch {workspace}/ip_groups/unique_ips.txt {workspace}/ip_groups/shared_hosting.txt
  outputs:
    dir: '{workspace}/ip_groups'
    unique_ips: '{workspace}/ip_groups/unique_ips.txt'
    shared_hosting: '{workspace}/ip_groups/shared_hosting.txt'
- id: origin_ips_extract
  name: '[IP] extract IPs for non-CDN (origin) hosts only — safe fuzz/pivot target set'
  depends_on:
  - cdncheck_classify
  - ip_group_analyze
  shell: true
  optional: true
  run: "touch {workspace}/origin_ips.txt\ntest -s {workspace}/origin_hosts.txt || exit 0\nsed 's/^/^/; s/$/ \\\\[/' {workspace}/origin_hosts.txt > {workspace}/.origin_host_patterns.txt\ngrep -E -f {workspace}/.origin_host_patterns.txt {workspace}/resolved_resp.txt 2>/dev/null \\\n  | grep -oE '[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}' | sort -u > {workspace}/origin_ips.txt || true\ntouch {workspace}/origin_ips.txt\n"
  outputs:
    file: '{workspace}/origin_ips.txt'
- id: favicon_hash
  name: '[favicon] compute mmh3 favicon hash per live host (Shodan/FOFA-compatible)'
  depends_on:
  - extract_live_urls
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 10m
  run: python {vars.scripts_dir}/scripts/favicon_hash.py --input {workspace}/live_urls.txt --output {workspace}/favicon_hashes.txt 2>/dev/null || true; touch {workspace}/favicon_hashes.txt
  outputs:
    file: '{workspace}/favicon_hashes.txt'
- id: favicon_pivot_search
  name: '[favicon] uncover — search FOFA/Shodan for hosts sharing the target favicon hash'
  depends_on:
  - favicon_hash
  when: '{vars.run_favicon_pivot}'
  shell: true
  optional: true
  timeout: 10m
  run: "touch {workspace}/favicon_related_raw.txt {workspace}/favicon_hash_used.txt\ntest -s {workspace}/favicon_hashes.txt || exit 0\nHASH=$(cut -d, -f2 {workspace}/favicon_hashes.txt | sort | uniq -c | sort -rn | head -1 | awk '{print $2}')\ntest -n \"$HASH\" || exit 0\necho \"$HASH\" > {workspace}/favicon_hash_used.txt\n(\n  uncover -q \"http.favicon.hash:$HASH\" -e shodan -silent 2>/dev/null || true\n  uncover -q \"icon_hash=\\\"$HASH\\\"\" -e fofa -silent 2>/dev/null || true\n) | sort -u > {workspace}/favicon_related_raw.txt\n"
  outputs:
    raw: '{workspace}/favicon_related_raw.txt'
    hash_used: '{workspace}/favicon_hash_used.txt'
- id: favicon_pivot_filter
  name: '[favicon] split results — in-scope (auto-merge) vs off-domain (manual review)'
  depends_on:
  - favicon_pivot_search
  when: '{vars.run_favicon_pivot}'
  shell: true
  optional: true
  run: "touch {workspace}/favicon_in_scope.txt {workspace}/favicon_related_offdomain.txt\ntest -s {workspace}/favicon_related_raw.txt || exit 0\nsed 's|https\\?://||; s|/.*||; s|:.*||' {workspace}/favicon_related_raw.txt \\\n  | tr '[:upper:]' '[:lower:]' | sort -u > {workspace}/favicon_hosts.txt\ngrep -E '^[a-z0-9][a-z0-9._-]*\\.[a-z]{2,}$' {workspace}/favicon_hosts.txt \\\n  | awk -v t=\"{target}\" 'length($0)>=length(t) && substr($0,length($0)-length(t)+1)==t' \\\n  | sort -u > {workspace}/favicon_in_scope.txt || true\ncomm -23 <(sort {workspace}/favicon_hosts.txt) <(sort {workspace}/favicon_in_scope.txt) \\\n  > {workspace}/favicon_related_offdomain.txt 2>/dev/null || true\ntouch {workspace}/favicon_in_scope.txt {workspace}/favicon_related_offdomain.txt\n"
  outputs:
    in_scope: '{workspace}/favicon_in_scope.txt'
    offdomain: '{workspace}/favicon_related_offdomain.txt'
- id: vhost_ip_fuzz
  name: '[vhost] ffuf Host-header fuzz against non-CDN IPs (bounded by vhost_ip_fuzz_max_ips)'
  depends_on:
  - origin_ips_extract
  when: '{vars.run_vhost_ip_fuzz}'
  shell: true
  optional: true
  timeout: 2h
  run: "mkdir -p {workspace}/vhost_fuzz\ntouch {workspace}/vhost_fuzz_ips.txt {workspace}/vhost_ffuf_hits.txt\ntest -s {workspace}/origin_ips.txt || exit 0\nhead -n {vars.vhost_ip_fuzz_max_ips} {workspace}/origin_ips.txt > {workspace}/vhost_fuzz_ips.txt\ncat {workspace}/vhost_fuzz_ips.txt | xargs -P 4 -I{} ffuf \\\n  -u \"http://{}\" -H \"Host: FUZZ.{target}\" -w {vars.vhost_wordlist}:FUZZ \\\n  -ac -mc 200,301,302,401,403 -t {vars.vhost_ip_fuzz_threads} \\\n  -of json -o {workspace}/vhost_fuzz/{}.json -s 2>/dev/null\njq -r '.results[]?.input.FUZZ' {workspace}/vhost_fuzz/*.json 2>/dev/null \\\n  | sed 's/$/.{target}/' | sort -u > {workspace}/vhost_ffuf_hits.txt || true\ntouch {workspace}/vhost_ffuf_hits.txt\n"
  outputs:
    dir: '{workspace}/vhost_fuzz'
    hits: '{workspace}/vhost_ffuf_hits.txt'
- id: vhost_ssl_san
  name: '[vhost] SSL cert SAN extraction per non-CDN IP — cheap complementary vhost hint'
  depends_on:
  - origin_ips_extract
  when: '{vars.run_vhost_ip_fuzz}'
  shell: true
  optional: true
  timeout: 30m
  run: "touch {workspace}/vhost_ssl_san_hits.txt\ntest -s {workspace}/origin_ips.txt || exit 0\nhead -n {vars.vhost_ip_fuzz_max_ips} {workspace}/origin_ips.txt | while IFS= read -r ip; do\n  echo | timeout 5 openssl s_client -connect \"$ip:443\" -servername {target} 2>/dev/null \\\n    | openssl x509 -noout -text 2>/dev/null \\\n    | grep -Eo 'DNS:[^,[:space:]]+' | cut -d: -f2\ndone | sed 's/^\\*\\.//' | tr '[:upper:]' '[:lower:]' | sort -u > {workspace}/vhost_ssl_san_hits.txt || true\ntouch {workspace}/vhost_ssl_san_hits.txt\n"
  outputs:
    file: '{workspace}/vhost_ssl_san_hits.txt'
- id: vhost_findings_merge
  name: '[vhost] merge ffuf + SSL-SAN hits → diff against already-known hosts'
  depends_on:
  - vhost_ip_fuzz
  - vhost_ssl_san
  when: '{vars.run_vhost_ip_fuzz}'
  run_on_failed_deps: true
  shell: true
  run: "touch {workspace}/vhost_all_hits.txt {workspace}/vhost_new_hosts.txt\n(cat {workspace}/vhost_ffuf_hits.txt 2>/dev/null; cat {workspace}/vhost_ssl_san_hits.txt 2>/dev/null) \\\n  | grep -E '^[a-z0-9][a-z0-9._-]*\\.[a-z]{2,}$' \\\n  | awk -v t=\"{target}\" 'length($0)>=length(t) && substr($0,length($0)-length(t)+1)==t' \\\n  | sort -u > {workspace}/vhost_all_hits.txt || true\ncomm -23 {workspace}/vhost_all_hits.txt <(sort {workspace}/subdomains_all_resolved.txt 2>/dev/null) \\\n  > {workspace}/vhost_new_hosts.txt 2>/dev/null || true\ntouch {workspace}/vhost_all_hits.txt {workspace}/vhost_new_hosts.txt\n"
  outputs:
    all_hits: '{workspace}/vhost_all_hits.txt'
    new_hosts: '{workspace}/vhost_new_hosts.txt'
- id: ip_pivot_reverse
  name: '[IP-pivot] mapcidr expand + dnsx PTR reverse sweep on neighboring blocks (ASN + amass-intel + origin IPs)'
  depends_on:
  - origin_ips_extract
  - amass_intel_extract
  - asn_discover
  when: '{vars.run_ip_pivot}'
  run_on_failed_deps: true
  shell: true
  optional: true
  timeout: 1h
  run: "touch {workspace}/ip_pivot_ranges.txt {workspace}/ip_pivot_ptr_raw.txt\n(\n  test -s {workspace}/origin_ips.txt && awk -v p=\"{vars.ip_pivot_prefix}\" '{print $1\"/\"p}' {workspace}/origin_ips.txt || true\n  cat {workspace}/amass_intel_cidrs.txt 2>/dev/null || true\n  cat {workspace}/asn_ipv4_cidrs.txt 2>/dev/null || true\n) | sort -u | head -n {vars.ip_pivot_max_ranges} > {workspace}/ip_pivot_ranges.txt\n\ntest -s {workspace}/ip_pivot_ranges.txt || exit 0\n\nwhile IFS= read -r cidr; do\n  IP1=$(echo \"$cidr\" | cut -d/ -f1)\n  IS_CDN=$(echo \"$IP1\" | cdncheck -silent 2>/dev/null | head -1)\n  if [ -n \"$IS_CDN\" ]; then\n    echo \"[ip_pivot skip] $cidr belongs to CDN/WAF ($IS_CDN) — shared infra, not target-specific\"\n    continue\n  fi\n  echo \"$cidr\" | mapcidr -silent 2>/dev/null | dnsx -ptr -resp-only -silent -r {vars.dns_resolvers} 2>/dev/null\ndone < {workspace}/ip_pivot_ranges.txt > {workspace}/ip_pivot_ptr_raw.txt\n"
  outputs:
    ranges: '{workspace}/ip_pivot_ranges.txt'
    ptr_raw: '{workspace}/ip_pivot_ptr_raw.txt'
- id: ip_pivot_filter
  name: '[IP-pivot] split PTR results — in-scope (auto-merge) vs neighbor domains (reference only)'
  depends_on:
  - ip_pivot_reverse
  when: '{vars.run_ip_pivot}'
  run_on_failed_deps: true
  shell: true
  optional: true
  run: "touch {workspace}/ip_pivot_in_scope.txt {workspace}/ip_pivot_neighbors.txt\ntest -s {workspace}/ip_pivot_ptr_raw.txt || exit 0\nsed 's/\\.$//' {workspace}/ip_pivot_ptr_raw.txt | tr '[:upper:]' '[:lower:]' | sort -u > {workspace}/ip_pivot_hosts.txt\ngrep -E '^[a-z0-9][a-z0-9._-]*\\.[a-z]{2,}$' {workspace}/ip_pivot_hosts.txt \\\n  | awk -v t=\"{target}\" 'length($0)>=length(t) && substr($0,length($0)-length(t)+1)==t' \\\n  | sort -u > {workspace}/ip_pivot_in_scope.txt || true\ncomm -23 <(sort {workspace}/ip_pivot_hosts.txt) <(sort {workspace}/ip_pivot_in_scope.txt) \\\n  > {workspace}/ip_pivot_neighbors.txt 2>/dev/null || true\ntouch {workspace}/ip_pivot_in_scope.txt {workspace}/ip_pivot_neighbors.txt\n"
  outputs:
    in_scope: '{workspace}/ip_pivot_in_scope.txt'
    neighbors: '{workspace}/ip_pivot_neighbors.txt'
- id: hackertarget_reverseiplookup
  name: '[IP-pivot] hackertarget — Reverse IP Lookup (other domains hosted on the target''s IP)'
  when: '{vars.run_passive} && {vars.run_hackertarget_reverseip}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 30s
  run: |
    touch {workspace}/hackertarget_reverseip_raw.txt {workspace}/hackertarget_reverseip_in_scope.txt {workspace}/hackertarget_reverseip_offdomain.txt
    IP=$(echo {target} | dnsx -silent -a -resp-only 2>/dev/null | grep -oE '[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}' | head -1)
    test -n "$IP" || exit 0
    curl -s --max-time 20 "https://api.hackertarget.com/reverseiplookup/?q=$IP" 2>/dev/null | grep -v '^error' > {workspace}/hackertarget_reverseip_raw.txt || true
    touch {workspace}/hackertarget_reverseip_raw.txt
    tr '[:upper:]' '[:lower:]' < {workspace}/hackertarget_reverseip_raw.txt | grep -E '^[a-z0-9][a-z0-9._-]*\.[a-z]{2,}$' | sort -u > {workspace}/hackertarget_reverseip_hosts.txt || true
    awk -v t="{target}" 'length($0)>=length(t) && substr($0,length($0)-length(t)+1)==t' {workspace}/hackertarget_reverseip_hosts.txt 2>/dev/null | sort -u > {workspace}/hackertarget_reverseip_in_scope.txt || true
    comm -23 <(sort {workspace}/hackertarget_reverseip_hosts.txt 2>/dev/null) <(sort {workspace}/hackertarget_reverseip_in_scope.txt 2>/dev/null) > {workspace}/hackertarget_reverseip_offdomain.txt 2>/dev/null || true
    touch {workspace}/hackertarget_reverseip_in_scope.txt {workspace}/hackertarget_reverseip_offdomain.txt
  outputs:
    in_scope: '{workspace}/hackertarget_reverseip_in_scope.txt'
    offdomain: '{workspace}/hackertarget_reverseip_offdomain.txt'
- id: merge_new_discoveries
  name: merge in-scope discoveries from all Wave-2 pivot techniques
  depends_on:
  - favicon_pivot_filter
  - vhost_findings_merge
  - ip_pivot_filter
  - hackertarget_reverseiplookup
  run_on_failed_deps: true
  shell: true
  run: "(\n  cat {workspace}/favicon_in_scope.txt 2>/dev/null || true\n  cat {workspace}/vhost_new_hosts.txt 2>/dev/null || true\n  cat {workspace}/ip_pivot_in_scope.txt 2>/dev/null || true\n  cat {workspace}/hackertarget_reverseip_in_scope.txt 2>/dev/null || true\n) | grep -E '^[a-z0-9][a-z0-9._-]*\\.[a-z]{2,}$' \\\n  | awk -v t=\"{target}\" 'length($0)>=length(t) && substr($0,length($0)-length(t)+1)==t' \\\n  | sort -u > {workspace}/new_discoveries.txt\ntouch {workspace}/new_discoveries.txt\n"
  outputs:
    file: '{workspace}/new_discoveries.txt'
- id: dnsx_resolve_new
  name: resolve newly discovered Wave-2 hosts
  depends_on:
  - merge_new_discoveries
  shell: true
  optional: true
  run: 'touch {workspace}/new_resolved.txt

    test -s {workspace}/new_discoveries.txt || exit 0

    dnsx -l {workspace}/new_discoveries.txt -silent -r {vars.dns_resolvers} -t {vars.dnsx_threads} -retry {vars.dnsx_retry} -a -aaaa -cname -o {workspace}/new_resolved.txt 2>/dev/null || true

    touch {workspace}/new_resolved.txt

    '
  outputs:
    file: '{workspace}/new_resolved.txt'
- id: merge_final_resolved
  name: merge Wave-1 + Wave-2 resolved hosts → ONE final host list for every downstream phase
  depends_on:
  - merge_all_resolved
  - dnsx_resolve_new
  run_on_failed_deps: true
  shell: true
  run: (cat {workspace}/subdomains_all_resolved.txt 2>/dev/null; cat {workspace}/new_resolved.txt 2>/dev/null) | sort -u > {workspace}/subdomains_final_resolved.txt; touch {workspace}/subdomains_final_resolved.txt
  outputs:
    file: '{workspace}/subdomains_final_resolved.txt'
  requires:
  - path: '{workspace}/subdomains_final_resolved.txt'
    min_bytes: 1
- id: httpx_wave2
  name: HTTP probe Wave-2 (newly pivoted) hosts only — avoids re-probing Wave-1
  depends_on:
  - dnsx_resolve_new
  shell: true
  optional: true
  run: 'touch {workspace}/httpx_wave2.jsonl

    test -s {workspace}/new_resolved.txt || exit 0

    httpx -l {workspace}/new_resolved.txt -silent -json -o {workspace}/httpx_wave2.jsonl -td -title -status-code -content-length -follow-redirects -timeout {vars.httpx_timeout} -threads {vars.httpx_threads} -random-agent 2>/dev/null || true

    touch {workspace}/httpx_wave2.jsonl

    '
  outputs:
    file: '{workspace}/httpx_wave2.jsonl'
- id: merge_final_httpx
  name: merge Wave-1 + Wave-2 httpx results → ONE final probe file for every downstream phase
  depends_on:
  - httpx
  - httpx_wave2
  run_on_failed_deps: true
  shell: true
  run: (cat {workspace}/httpx.jsonl 2>/dev/null; cat {workspace}/httpx_wave2.jsonl 2>/dev/null) > {workspace}/httpx_all.jsonl; touch {workspace}/httpx_all.jsonl; jq -r '.url // empty' {workspace}/httpx_all.jsonl 2>/dev/null | sort -u > {workspace}/live_urls_final.txt; touch {workspace}/live_urls_final.txt
  outputs:
    httpx_jsonl: '{workspace}/httpx_all.jsonl'
    live_urls: '{workspace}/live_urls_final.txt'
- id: screenshot
  name: headless screenshots — gowitness (all live HTTP endpoints, Wave-1 + Wave-2)
  depends_on:
  - merge_final_httpx
  when: '{vars.run_screenshot}'
  shell: true
  optional: true
  run: "test -s {workspace}/live_urls_final.txt || exit 0\nmkdir -p {workspace}/screenshots\ngowitness scan file \\\n  -f {workspace}/live_urls_final.txt \\\n  -s {workspace}/screenshots \\\n  --write-db \\\n  --write-db-uri sqlite://{workspace}/gowitness.sqlite3 \\\n  --chrome-path /usr/local/bin/chromium-docker \\\n  -T 30 --threads {vars.screenshot_threads} -q 2>{workspace}/gowitness.log || true\ncd {workspace} && gowitness report generate \\\n  --db-uri sqlite://{workspace}/gowitness.sqlite3 -q 2>/dev/null || true\n"
  outputs:
    screenshot_dir: '{workspace}/screenshots'
    gallery_html: '{workspace}/gallery.html'
- id: katana_crawl
  name: '[crawl] katana — JS-aware deep crawl (single shared pass, feeds subdomain/JS/secrets/param-discovery)'
  depends_on:
  - merge_final_httpx
  when: '{vars.run_crawl}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 20m
  run: "test -s {workspace}/live_urls_final.txt && katana \\\n  -list {workspace}/live_urls_final.txt \\\n  -d {vars.katana_depth} \\\n  -jc -silent \\\n  -c {vars.katana_concurrency} \\\n  -ct {vars.katana_crawl_timeout} \\\n  -kf all \\\n  -o {workspace}/katana_urls.txt 2>/dev/null || true\ntouch {workspace}/katana_urls.txt\n"
  outputs:
    file: '{workspace}/katana_urls.txt'
- id: hakrawler_crawl
  name: '[crawl] hakrawler — additional recursive crawl pass (cheap, catches what katana misses)'
  when: '{vars.run_crawl}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 10m
  run: echo {target} | hakrawler -depth 4 -plain -insecure 2>/dev/null | sort -u > {workspace}/hakrawler_urls.txt || true; touch {workspace}/hakrawler_urls.txt
  outputs:
    file: '{workspace}/hakrawler_urls.txt'
- id: merge_crawl_urls
  name: merge katana + hakrawler + already-fetched archive URLs (gau/wayback/waymore/urlfinder from Phase A) → one URL corpus
  depends_on:
  - katana_crawl
  - hakrawler_crawl
  - merge_final_httpx
  when: '{vars.run_crawl}'
  run_on_failed_deps: true
  shell: true
  run: "(\n  cat {workspace}/live_urls_final.txt 2>/dev/null || true\n  cat {workspace}/katana_urls.txt 2>/dev/null || true\n  cat {workspace}/hakrawler_urls.txt 2>/dev/null || true\n  cat {workspace}/p_gau_urls.txt 2>/dev/null || true\n  cat {workspace}/p_waybackurls_urls.txt 2>/dev/null || true\n  cat {workspace}/p_waymore_urls.txt 2>/dev/null || true\n  cat {workspace}/p_urlfinder_urls.txt 2>/dev/null || true\n) | grep -E '^https?://' | awk -v t=\"{target}\" 'tolower($0) ~ tolower(t)' | sort -u > {workspace}/all_urls.txt\ntouch {workspace}/all_urls.txt\nprintf 'Total unique URLs collected (1 shared crawl pass): %s\\n' \"$(wc -l < {workspace}/all_urls.txt)\" >> {workspace}/resolve_stats.txt || true\n"
  outputs:
    all_urls: '{workspace}/all_urls.txt'
- id: subjs_extract
  name: '[JS] subjs — collect JS file URLs from the shared crawl corpus'
  depends_on:
  - merge_crawl_urls
  when: '{vars.run_js_analysis}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 20m
  run: 'test -s {workspace}/all_urls.txt && subjs -i {workspace}/all_urls.txt -c 20 2>/dev/null | grep -iE ''\.js(\?|$)'' | sort -u > {workspace}/js_urls.txt || true; touch {workspace}/js_urls.txt; printf ''JS files discovered: %s\n'' "$(wc -l < {workspace}/js_urls.txt)" >> {workspace}/resolve_stats.txt'
  outputs:
    js_urls: '{workspace}/js_urls.txt'
- id: download_js
  name: '[JS] download top-150 JS files for static analysis'
  depends_on:
  - subjs_extract
  when: '{vars.run_js_analysis}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 15m
  run: "mkdir -p {workspace}/js_files\nif test -s {workspace}/js_urls.txt; then\n  head -150 {workspace}/js_urls.txt | while IFS= read -r url; do\n    fname=$(printf '%s' \"$url\" | md5sum | cut -d' ' -f1)\n    curl -skL --max-time 15 -A \"Mozilla/5.0\" \"$url\" -o \"{workspace}/js_files/$fname.js\" 2>/dev/null || true\n  done\nfi\nfind {workspace}/js_files/ -empty -delete 2>/dev/null || true\n"
  outputs:
    js_dir: '{workspace}/js_files'
- id: jsapiscan_scan
  name: '[JS] jsapiscan — extract API endpoints from collected JS files'
  depends_on:
  - subjs_extract
  when: '{vars.run_js_analysis}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 20m
  run: 'test -s {workspace}/js_urls.txt && mkdir -p {workspace}/jsapiscan_out && cd {workspace}/jsapiscan_out && jsapiscan -f {workspace}/js_urls.txt -o {workspace}/jsapiscan_results.txt -K -t 20 -d 2 2>/dev/null || true; touch {workspace}/jsapiscan_results.txt; printf ''JS API endpoints found: %s\n'' "$(wc -l < {workspace}/jsapiscan_results.txt 2>/dev/null || echo 0)" >> {workspace}/resolve_stats.txt'
  outputs:
    file: '{workspace}/jsapiscan_results.txt'
- id: linkfinder_scan
  name: '[JS] LinkFinder — extract endpoints/paths from JS'
  depends_on:
  - subjs_extract
  when: '{vars.run_js_analysis} && {vars.run_linkfinder}'
  optional: true
  skip_if_exists: true
  timeout: 15m
  shell: true
  run: linkfinder -d {target} -o cli 2>/dev/null | grep -v '^#' | grep -v '^\s*$' | sort -u > {workspace}/linkfinder_endpoints.txt || true; touch {workspace}/linkfinder_endpoints.txt
  outputs:
    endpoints: '{workspace}/linkfinder_endpoints.txt'
- id: jsubfinder_scan
  name: '[JS] jsubfinder — crawl JS for subdomains + secrets'
  depends_on:
  - subjs_extract
  when: '{vars.run_js_analysis} && {vars.run_jsubfinder}'
  optional: true
  skip_if_exists: true
  timeout: 15m
  shell: true
  run: jsubfinder search -u {target} -c --output-file {workspace}/jsubfinder_subs.txt --secrets {workspace}/jsubfinder_secrets.txt -S 2>/dev/null || true; touch {workspace}/jsubfinder_subs.txt {workspace}/jsubfinder_secrets.txt
  outputs:
    secrets: '{workspace}/jsubfinder_secrets.txt'
    subdomains: '{workspace}/jsubfinder_subs.txt'
- id: secretfinder_scan
  name: '[JS] SecretFinder — API keys/tokens/credentials in downloaded JS'
  depends_on:
  - download_js
  when: '{vars.run_js_analysis} && {vars.run_secretfinder}'
  optional: true
  skip_if_exists: true
  timeout: 20m
  shell: true
  run: ": > {workspace}/secretfinder_results.txt; for f in {workspace}/js_files/*.js; do\n  test -f \"$f\" || continue;\n  python3 /opt/SecretFinder/SecretFinder.py -i \"$f\" -o cli 2>/dev/null || true;\ndone | grep -v '^\\s*$' | sort -u >> {workspace}/secretfinder_results.txt || true; touch {workspace}/secretfinder_results.txt"
  outputs:
    results: '{workspace}/secretfinder_results.txt'
- id: static_secret_scan
  name: '[secrets] TruffleHog + Gitleaks — deep secret scan on downloaded JS files'
  depends_on:
  - download_js
  when: '{vars.run_js_analysis} && {vars.run_static_secrets}'
  optional: true
  fanout_concurrency: 2
  fanout_timeout_default: 20m
  fanout:
  - id: trufflehog_scan
    shell: true
    skip_if_exists: true
    optional: true
    run: test -d {workspace}/js_files || { touch {workspace}/trufflehog_results.jsonl; exit 0; }; trufflehog filesystem {workspace}/js_files/ --json --no-update 2>/dev/null | grep -v '^\s*$' > {workspace}/trufflehog_results.jsonl || true; touch {workspace}/trufflehog_results.jsonl
    outputs:
      results: '{workspace}/trufflehog_results.jsonl'
  - id: gitleaks_scan
    shell: true
    skip_if_exists: true
    optional: true
    run: test -d {workspace}/js_files || { touch {workspace}/gitleaks_results.json; exit 0; }; gitleaks detect --source {workspace}/js_files/ --no-git --report-path {workspace}/gitleaks_results.json --report-format json -q 2>/dev/null || true; touch {workspace}/gitleaks_results.json
    outputs:
      results: '{workspace}/gitleaks_results.json'
- id: js_subdomain_extract
  name: '[JS] extract new subdomains mentioned in JS (informational — not re-resolved, avoids unbounded pivot loop)'
  depends_on:
  - subjs_extract
  - jsapiscan_scan
  - jsubfinder_scan
  when: '{vars.run_js_analysis}'
  shell: true
  optional: true
  run: "(\n  grep -oP '(?:https?://)\\K[a-zA-Z0-9._-]+\\.{target}(?=[/?#]|$)' {workspace}/js_urls.txt 2>/dev/null || true;\n  grep -oP '(?:https?://)\\K[a-zA-Z0-9._-]+\\.{target}(?=[/?#]|$)' {workspace}/jsapiscan_results.txt 2>/dev/null || true;\n  cat {workspace}/jsubfinder_subs.txt 2>/dev/null || true\n) | sort -u > {workspace}/js_subs.txt || true; touch {workspace}/js_subs.txt"
  outputs:
    file: '{workspace}/js_subs.txt'
- id: gf_patterns
  name: '[gf] jsvar / params / lfi / ssrf / xss / sqli / idor / rce / redirect'
  depends_on:
  - merge_crawl_urls
  when: '{vars.run_crawl} && {vars.run_gf}'
  optional: true
  shell: true
  run: "mkdir -p {workspace}/gf\ntest -s {workspace}/all_urls.txt || { touch {workspace}/gf/.done; exit 0; }\nfor pat in jsvar interestingparams interestingEXT lfi ssrf redirect xss sqli idor rce; do\n  gf \"$pat\" < {workspace}/all_urls.txt > {workspace}/gf/$pat.txt 2>/dev/null || true\n  touch {workspace}/gf/$pat.txt\ndone\n"
  outputs:
    gf_dir: '{workspace}/gf'
- id: takeover_check
  name: subdomain takeover — subzy + subjack + dnstake (parallel)
  depends_on:
  - merge_final_resolved
  when: '{vars.run_takeover}'
  optional: true
  fanout_concurrency: 3
  fanout_timeout_default: 20m
  fanout:
  - id: subzy
    shell: true
    run: subzy run --targets {workspace}/subdomains_final_resolved.txt --concurrency 100 --verify-ssl --hide-fails > {workspace}/takeover_subzy.txt 2>/dev/null; touch {workspace}/takeover_subzy.txt
    outputs:
      file: '{workspace}/takeover_subzy.txt'
    optional: true
  - id: subjack
    shell: true
    run: subjack -w {workspace}/subdomains_final_resolved.txt -t 100 -timeout 30 -ssl -a -o {workspace}/takeover_subjack.txt 2>/dev/null; touch {workspace}/takeover_subjack.txt
    outputs:
      file: '{workspace}/takeover_subjack.txt'
    optional: true
  - id: dnstake
    shell: true
    run: dnstake -f {workspace}/subdomains_final_resolved.txt -o {workspace}/takeover_dnstake.txt 2>/dev/null; touch {workspace}/takeover_dnstake.txt
    outputs:
      file: '{workspace}/takeover_dnstake.txt'
    optional: true
- id: merge_takeover
  name: merge takeover findings → filter VULNERABLE entries
  depends_on:
  - takeover_check
  when: '{vars.run_takeover}'
  run_on_failed_deps: true
  shell: true
  run: "(\n  cat {workspace}/takeover_subzy.txt 2>/dev/null || true\n  cat {workspace}/takeover_subjack.txt 2>/dev/null || true\n  cat {workspace}/takeover_dnstake.txt 2>/dev/null || true\n) | grep -iE '\\[Vulnerable\\]|VULNERABLE:|found.*takeover|takeover.*found|\\[FOUND\\]' \\\n  | grep -iv 'not vulnerable\\|not found\\|\\[Not ' \\\n  | sort -u > {workspace}/takeover_findings.txt\ntouch {workspace}/takeover_findings.txt\n"
  outputs:
    file: '{workspace}/takeover_findings.txt'
- id: s3scanner_buckets
  name: '[cloud] s3scanner — enumerate exposed S3/GCS/Azure cloud storage buckets (bucket names derived from {target} only — runs immediately, no subdomain-enum wait)'
  when: '{vars.run_s3scan}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 15m
  run: "STEM=$(echo {target} | sed 's/\\.[^.]*$//'); printf '%s\\n%s\\n%s\\n%s\\n%s\\n%s\\n%s\\n%s\\n%s\\n%s\\n%s\\n%s\\n%s\\n%s\\n%s\\n' \\\n  \"{target}\" \"$STEM\" \\\n  \"$STEM-assets\" \"$STEM-static\" \"$STEM-media\" \"$STEM-uploads\" \\\n  \"$STEM-backup\" \"$STEM-data\" \"$STEM-files\" \"$STEM-public\" \\\n  \"$STEM-private\" \"$STEM-dev\" \"$STEM-staging\" \"$STEM-prod\" \"$STEM-logs\" \\\n> {workspace}/bucket_names.txt; s3scanner -bucket-file {workspace}/bucket_names.txt -json -threads 10 2>/dev/null > {workspace}/s3scanner.json || true; touch {workspace}/s3scanner.json"
  outputs:
    file: '{workspace}/s3scanner.json'
- id: prepare_dir_wordlist
  name: '[dirbrute] truncate dir_wordlist to the top N lines — common.txt alone is 25k+ lines, far too slow as a default'
  shell: true
  optional: true
  run: head -n {vars.dir_wordlist_quick_lines} {vars.dir_wordlist} > {workspace}/dir_wordlist_quick.txt 2>/dev/null || cp {vars.dir_wordlist} {workspace}/dir_wordlist_quick.txt; touch {workspace}/dir_wordlist_quick.txt
  outputs:
    file: '{workspace}/dir_wordlist_quick.txt'
- id: dirbrute
  name: '[brute] dirsearch + ffuf + feroxbuster + gobuster — dir brute on primary target (fuzzes {target} directly with a small top-N wordlist; runs immediately, in parallel with the whole recon pipeline, no subdomain-enum wait)'
  depends_on:
  - prepare_dir_wordlist
  when: '{vars.run_dirbrute}'
  optional: true
  fanout_concurrency: 4
  fanout_timeout_default: 30m
  fanout:
  - id: dirsearch_run
    shell: true
    skip_if_exists: true
    optional: true
    run: dirsearch -u {target} -w {workspace}/dir_wordlist_quick.txt -t {vars.dirsearch_threads} -o {workspace}/dirsearch.txt --format=plain --exclude-status=404 -q 2>/dev/null || true; touch {workspace}/dirsearch.txt
    outputs:
      results: '{workspace}/dirsearch.txt'
  - id: ffuf_path_run
    shell: true
    skip_if_exists: true
    optional: true
    run: ffuf -u {target}/FUZZ -w {workspace}/dir_wordlist_quick.txt -t {vars.ffuf_path_threads} -mc 200,201,204,301,302,307,401,403,405,500 -of json -o {workspace}/ffuf_paths.json -s 2>/dev/null || true; touch {workspace}/ffuf_paths.json
    outputs:
      results: '{workspace}/ffuf_paths.json'
  - id: feroxbuster_run
    shell: true
    skip_if_exists: true
    optional: true
    run: feroxbuster -u {target} -w {workspace}/dir_wordlist_quick.txt -t {vars.ferox_threads} --silent --json --extract-links --collect-words -o {workspace}/feroxbuster.json 2>/dev/null || true; touch {workspace}/feroxbuster.json
    outputs:
      results: '{workspace}/feroxbuster.json'
  - id: gobuster_run
    shell: true
    skip_if_exists: true
    optional: true
    run: gobuster dir -u {target} -w {workspace}/dir_wordlist_quick.txt -t 50 -q --no-error -o {workspace}/gobuster_dir.txt 2>/dev/null || true; touch {workspace}/gobuster_dir.txt
    outputs:
      results: '{workspace}/gobuster_dir.txt'
- id: merge_endpoints
  name: merge all endpoints — JS + dir brute + crawl
  depends_on:
  - linkfinder_scan
  - jsapiscan_scan
  - gf_patterns
  - dirbrute
  run_on_failed_deps: true
  shell: true
  run: (cat {workspace}/linkfinder_endpoints.txt 2>/dev/null; cat {workspace}/jsapiscan_results.txt 2>/dev/null; grep -oP '/[a-zA-Z0-9/_\-\.%?=&]+' {workspace}/all_urls.txt 2>/dev/null; grep -oP 'https?://[^\s]+' {workspace}/dirsearch.txt 2>/dev/null | grep -oP '/[a-zA-Z0-9/_\-\.]+' || true; jq -r '.results[]?.url' {workspace}/ffuf_paths.json 2>/dev/null | grep -oP '/[a-zA-Z0-9/_\-\.]+' || true; jq -r 'select(.type=="response" and .status!=404) | .url' {workspace}/feroxbuster.json 2>/dev/null | grep -oP '/[a-zA-Z0-9/_\-\.]+' || true; grep -oP '/[a-zA-Z0-9/_\-\.]+' {workspace}/gobuster_dir.txt 2>/dev/null || true) | grep -vE '^/$|^\.$' | sort -u > {workspace}/all_endpoints.txt || true; touch {workspace}/all_endpoints.txt
  outputs:
    endpoints: '{workspace}/all_endpoints.txt'
- id: fallparams_run
  name: '[param] fallparams — crawl-based parameter discovery on primary target (auth-aware)'
  when: '{vars.run_params} && {vars.run_fallparams}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 15m
  run: '_H=''''; test -n ''{vars.session_cookie}'' && _H="$_H -H ''Cookie: {vars.session_cookie}''"; test -n ''{vars.auth_header}'' && _H="$_H -H ''Authorization: {vars.auth_header}''"; test -n ''{vars.custom_header}'' && _H="$_H -H ''{vars.custom_header}''"

    URL=$(echo {target} | grep -oP ''https?://[^/]+'' || echo "https://{target}")

    eval "fallparams -u \"$URL\" -c -d 2 -o {workspace}/fallparams_urls.txt $_H 2>/dev/null" || true

    touch {workspace}/fallparams_urls.txt

    '
  outputs:
    file: '{workspace}/fallparams_urls.txt'
- id: merge_param_urls
  name: '[param] merge shared URL corpus + fallparams → URLs that carry query parameters'
  depends_on:
  - merge_crawl_urls
  - fallparams_run
  when: '{vars.run_params}'
  run_on_failed_deps: true
  shell: true
  run: "(cat {workspace}/all_urls.txt 2>/dev/null || true; cat {workspace}/fallparams_urls.txt 2>/dev/null || true) \\\n  | grep '[?&][a-zA-Z0-9_%-]\\+=' | sort -u > {workspace}/urls_with_params.txt || true\ntouch {workspace}/urls_with_params.txt\n"
  outputs:
    param_urls: '{workspace}/urls_with_params.txt'
- id: extract_param_names
  name: '[param] extract existing param names → augment brute-force wordlist'
  depends_on:
  - merge_param_urls
  when: '{vars.run_params}'
  shell: true
  run: grep -oP '[?&][a-zA-Z0-9_%-]+=' {workspace}/urls_with_params.txt 2>/dev/null | tr -d '?&=' | sort -u > {workspace}/found_params.txt || true; touch {workspace}/found_params.txt; (cat {vars.param_wordlist} 2>/dev/null; cat {workspace}/found_params.txt) | sort -u > {workspace}/combined_wordlist.txt || true; touch {workspace}/combined_wordlist.txt
  outputs:
    found_params: '{workspace}/found_params.txt'
    combined_wordlist: '{workspace}/combined_wordlist.txt'
- id: brute_params
  name: '[brute] arjun + x8 + ffuf — parameter brute-force on primary target (auth-aware)'
  depends_on:
  - extract_param_names
  when: '{vars.run_params}'
  optional: true
  fanout_concurrency: 3
  fanout_timeout_default: 40m
  fanout:
  - id: arjun_scan
    shell: true
    skip_if_exists: true
    optional: true
    when: '{vars.run_arjun}'
    run: '_H=''''; test -n ''{vars.session_cookie}'' && _H="$_H -H ''Cookie: {vars.session_cookie}''"; test -n ''{vars.auth_header}''    && _H="$_H -H ''Authorization: {vars.auth_header}''"; test -n ''{vars.custom_header}''  && _H="$_H -H ''{vars.custom_header}''"; WLIST=''''; test -s {workspace}/combined_wordlist.txt && WLIST=''-w {workspace}/combined_wordlist.txt''; eval "arjun -u {target} -m {vars.method} --rate-limit {vars.arjun_rate} -t {vars.arjun_threads} $WLIST $_H -oJ {workspace}/arjun.json 2>/dev/null" || true; touch {workspace}/arjun.json'
    outputs:
      results: '{workspace}/arjun.json'
  - id: x8_scan
    shell: true
    skip_if_exists: true
    optional: true
    when: '{vars.run_x8}'
    run: '_H=''''; test -n ''{vars.session_cookie}'' && _H="$_H -H ''Cookie: {vars.session_cookie}''"; test -n ''{vars.auth_header}''    && _H="$_H -H ''Authorization: {vars.auth_header}''"; test -n ''{vars.custom_header}''  && _H="$_H -H ''{vars.custom_header}''"; WLIST=''''; test -s {workspace}/combined_wordlist.txt && WLIST="-w {workspace}/combined_wordlist.txt"; eval "x8 -u ''{target}/?FUZZ=1'' -X {vars.method} --output-format json $WLIST $_H -o {workspace}/x8_params.json 2>/dev/null" || true; touch {workspace}/x8_params.json'
    outputs:
      results: '{workspace}/x8_params.json'
  - id: ffuf_param_scan
    shell: true
    skip_if_exists: true
    optional: true
    when: '{vars.run_ffuf_params}'
    run: '_H=''''; test -n ''{vars.session_cookie}'' && _H="$_H -H ''Cookie: {vars.session_cookie}''"; test -n ''{vars.auth_header}''    && _H="$_H -H ''Authorization: {vars.auth_header}''"; test -n ''{vars.custom_header}''  && _H="$_H -H ''{vars.custom_header}''"; WLIST={workspace}/combined_wordlist.txt; test -s "$WLIST" || WLIST={vars.param_wordlist}; FSIZE=''''; test -n ''{vars.ffuf_filter_size}'' && FSIZE="-fs {vars.ffuf_filter_size}"; eval "ffuf -u ''{target}?FUZZ=k1probe'' -w $WLIST -X {vars.method} -t {vars.ffuf_threads} -ac -json $FSIZE $_H -o {workspace}/ffuf_params.json 2>/dev/null" || true; touch {workspace}/ffuf_params.json'
    outputs:
      results: '{workspace}/ffuf_params.json'
- id: merge_params_results
  name: '[param] merge all discovered parameters'
  depends_on:
  - brute_params
  when: '{vars.run_params}'
  run_on_failed_deps: true
  shell: true
  run: (jq -r '.[] | .params[]?' {workspace}/arjun.json 2>/dev/null || true; jq -r '.[] | .name' {workspace}/x8_params.json 2>/dev/null || true; jq -r '.results[]?.input.FUZZ' {workspace}/ffuf_params.json 2>/dev/null || true; cat {workspace}/found_params.txt 2>/dev/null || true) | grep -v '^null$' | grep -v '^\s*$' | sort -u > {workspace}/all_params.txt || true; touch {workspace}/all_params.txt
  outputs:
    all_params: '{workspace}/all_params.txt'
- id: nuclei_hosts
  name: nuclei — live HTTP hosts (full template set, skip dns)
  depends_on:
  - merge_final_httpx
  when: '{vars.run_nuclei}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 15m
  run: 'timeout 900 nuclei -l {workspace}/httpx_all.jsonl -nmhe -jsonl -silent -rl {vars.nuclei_rl} -c {vars.nuclei_concurrency} -timeout {vars.nuclei_timeout} -etags dns -o {workspace}/nuclei_hosts.jsonl 2>/dev/null; RC=$?; touch {workspace}/nuclei_hosts.jsonl; test "$RC" = 124 && echo "- nuclei_hosts: timed out after 15m, results may be incomplete" >> {workspace}/scan_notes.txt || true'
  outputs:
    nuclei_jsonl: '{workspace}/nuclei_hosts.jsonl'
- id: nuclei_misconfig
  name: nuclei — misconfigurations + exposures on all resolved hosts
  depends_on:
  - merge_final_resolved
  when: '{vars.run_nuclei}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 15m
  run: 'timeout 900 nuclei -l {workspace}/subdomains_final_resolved.txt -nmhe -jsonl -silent -rl {vars.nuclei_rl} -c {vars.nuclei_concurrency} -timeout {vars.nuclei_timeout} -tags misconfig,exposure,dns,network -o {workspace}/nuclei_misconfig.jsonl 2>/dev/null; RC=$?; touch {workspace}/nuclei_misconfig.jsonl; test "$RC" = 124 && echo "- nuclei_misconfig: timed out after 15m, results may be incomplete" >> {workspace}/scan_notes.txt || true'
  outputs:
    nuclei_misconfig_jsonl: '{workspace}/nuclei_misconfig.jsonl'
- id: afrog_scan
  name: afrog — PoC-based vuln scan (complements nuclei)
  depends_on:
  - merge_final_httpx
  when: '{vars.run_afrog}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 2h
  run: jq -r '.url // empty' {workspace}/httpx_all.jsonl 2>/dev/null | sort -u > {workspace}/afrog_targets.txt; afrog -T {workspace}/afrog_targets.txt -S critical,high,medium -j {workspace}/afrog.jsonl -doh 2>/dev/null; touch {workspace}/afrog.jsonl
  outputs:
    afrog_jsonl: '{workspace}/afrog.jsonl'
- id: nuclei_naabu_ports
  name: nuclei — non-HTTP ports discovered by naabu (network templates)
  depends_on:
  - naabu_topscan
  when: '{vars.run_nuclei} && {vars.run_portscan}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 15m
  run: "touch {workspace}/naabu_nonweb_targets.txt {workspace}/nuclei_ports.jsonl\ntest -f {workspace}/naabu.jsonl || exit 0\njq -r '\"\\(.host // .ip):\\(.port)\"' {workspace}/naabu.jsonl 2>/dev/null \\\n  | grep -vE ':(80|443|8080|8443|8888)$' | sort -u > {workspace}/naabu_nonweb_targets.txt\ntest -s {workspace}/naabu_nonweb_targets.txt && timeout 900 nuclei \\\n  -l {workspace}/naabu_nonweb_targets.txt \\\n  -nmhe -jsonl -silent \\\n  -rl 50 -c 10 -timeout 15 \\\n  -tags network,dns,ssl,ssh,ftp,smtp \\\n  -o {workspace}/nuclei_ports.jsonl 2>/dev/null\nRC=$?\ntest \"$RC\" = 124 && echo \"- nuclei_naabu_ports: timed out after 15m, results may be incomplete\" >> {workspace}/scan_notes.txt || true\n"
  outputs:
    file: '{workspace}/nuclei_ports.jsonl'
- id: nuclei_js_secrets
  name: '[nuclei] API key / token / exposure scanning on JS surface (3 parallel)'
  depends_on:
  - subjs_extract
  - download_js
  when: '{vars.run_nuclei_js} && {vars.run_nuclei}'
  optional: true
  fanout_concurrency: 3
  fanout_timeout_default: 15m
  fanout:
  - id: nuclei_file_keys
    shell: true
    skip_if_exists: true
    optional: true
    run: 'find {workspace}/js_files/ -name ''*.js'' 2>/dev/null | timeout 900 nuclei -t /root/nuclei-templates/file/keys/ -rl {vars.nuclei_rl} -timeout {vars.nuclei_timeout} -silent -jsonl -o {workspace}/nuclei_file_keys.jsonl 2>/dev/null; RC=$?; touch {workspace}/nuclei_file_keys.jsonl; test "$RC" = 124 && echo "- nuclei_file_keys: timed out after 15m, results may be incomplete" >> {workspace}/scan_notes.txt || true'
    outputs:
      results: '{workspace}/nuclei_file_keys.jsonl'
  - id: nuclei_js_urls
    shell: true
    skip_if_exists: true
    optional: true
    run: 'test -s {workspace}/js_urls.txt && timeout 900 nuclei -l {workspace}/js_urls.txt -t /root/nuclei-templates/http/exposures/ -rl {vars.nuclei_rl} -timeout {vars.nuclei_timeout} -silent -jsonl -o {workspace}/nuclei_js_exposure.jsonl 2>/dev/null; RC=$?; touch {workspace}/nuclei_js_exposure.jsonl; test "$RC" = 124 && echo "- nuclei_js_urls: timed out after 15m, results may be incomplete" >> {workspace}/scan_notes.txt || true'
    outputs:
      results: '{workspace}/nuclei_js_exposure.jsonl'
  - id: nuclei_target_exposure
    shell: true
    skip_if_exists: true
    optional: true
    run: 'echo {target} | timeout 900 nuclei -t /root/nuclei-templates/http/exposures/ -rl {vars.nuclei_rl} -timeout {vars.nuclei_timeout} -silent -jsonl -o {workspace}/nuclei_target_exposure.jsonl 2>/dev/null; RC=$?; touch {workspace}/nuclei_target_exposure.jsonl; test "$RC" = 124 && echo "- nuclei_target_exposure: timed out after 15m, results may be incomplete" >> {workspace}/scan_notes.txt || true'
    outputs:
      results: '{workspace}/nuclei_target_exposure.jsonl'
- id: nuclei_paths
  name: '[nuclei] scan discovered endpoints for misconfigs + exposures'
  depends_on:
  - merge_endpoints
  when: '{vars.run_nuclei_js} && {vars.run_nuclei}'
  optional: true
  skip_if_exists: true
  timeout: 15m
  shell: true
  run: 'BASE=$(echo {target} | grep -oP ''https?://[^/]+'' || echo "https://{target}"); test -s {workspace}/all_endpoints.txt && head -300 {workspace}/all_endpoints.txt | sed "s|^|$BASE|" | timeout 900 nuclei -t /root/nuclei-templates/http/exposures/ -rl {vars.nuclei_rl} -timeout {vars.nuclei_timeout} -silent -jsonl -o {workspace}/nuclei_paths.jsonl 2>/dev/null; RC=$?; touch {workspace}/nuclei_paths.jsonl; test "$RC" = 124 && echo "- nuclei_paths: timed out after 15m, results may be incomplete" >> {workspace}/scan_notes.txt || true'
  outputs:
    results: '{workspace}/nuclei_paths.jsonl'
- id: nuclei_params
  name: '[nuclei] scan discovered param endpoints for vulns (auth-aware)'
  depends_on:
  - merge_params_results
  when: '{vars.run_nuclei_params} && {vars.run_nuclei}'
  optional: true
  skip_if_exists: true
  timeout: 15m
  shell: true
  run: "_H=''; test -n '{vars.session_cookie}' && _H=\"$_H -H 'Cookie: {vars.session_cookie}'\"; test -n '{vars.auth_header}' && _H=\"$_H -H 'Authorization: {vars.auth_header}'\"; test -n '{vars.custom_header}' && _H=\"$_H -H '{vars.custom_header}'\"\ntest -s {workspace}/all_params.txt || { touch {workspace}/nuclei_params.jsonl; exit 0; }\nhead -200 {workspace}/all_params.txt | while IFS= read -r param; do\n  echo \"{target}?$param=k1test\"\ndone > {workspace}/param_probe_urls.txt\neval \"timeout 900 nuclei -l {workspace}/param_probe_urls.txt -t /root/nuclei-templates/http/exposures/ -rl {vars.nuclei_rl} -timeout {vars.nuclei_timeout} -silent -jsonl $_H -o {workspace}/nuclei_params.jsonl 2>/dev/null\"\nRC=$?\ntest \"$RC\" = 124 && echo \"- nuclei_params: timed out after 15m, results may be incomplete\" >> {workspace}/scan_notes.txt\ntouch {workspace}/nuclei_params.jsonl\n"
  outputs:
    results: '{workspace}/nuclei_params.jsonl'
- id: final_report
  name: generate consolidated all-in-one recon report
  depends_on:
  - merge_final_resolved
  - merge_final_httpx
  - asn_discover
  - amass_intel_extract
  - cdncheck_classify
  - ip_group_analyze
  - favicon_pivot_filter
  - uncover_org_filter
  - vhost_findings_merge
  - ip_pivot_filter
  - hackertarget_reverseiplookup
  - tlsx_san_extract
  - merge_crawl_urls
  - subjs_extract
  - jsapiscan_scan
  - secretfinder_scan
  - static_secret_scan
  - jsubfinder_scan
  - gf_patterns
  - takeover_check
  - s3scanner_buckets
  - merge_endpoints
  - merge_params_results
  - nuclei_hosts
  - nuclei_misconfig
  - nuclei_js_secrets
  - nuclei_paths
  - nuclei_params
  - afrog_scan
  - nuclei_naabu_ports
  - screenshot
  - whatweb_scan
  run_on_failed_deps: true
  shell: true
  run: "mkdir -p {workspace}/report\n\nPASSIVE=$(wc -l < {workspace}/passive_merged.txt 2>/dev/null || echo 0)\nCANDIDATES=$(wc -l < {workspace}/subdomains_all.txt 2>/dev/null || echo 0)\nCRTSH=$(wc -l < {workspace}/p_crtsh.txt 2>/dev/null || echo 0)\nASN_CIDRS=$(wc -l < {workspace}/asn_ipv4_cidrs.txt 2>/dev/null || echo 0)\nAMASS_INTEL_CIDRS=$(wc -l < {workspace}/amass_intel_cidrs.txt 2>/dev/null || echo 0)\nAMASS_ACTIVE=$(wc -l < {workspace}/amass_active.txt 2>/dev/null || echo 0)\nUNCOVER_CERT=$(wc -l < {workspace}/uncover_cert.txt 2>/dev/null || echo 0)\nUNCOVER_ORG_IN=$(wc -l < {workspace}/uncover_org_in_scope.txt 2>/dev/null || echo 0)\nUNCOVER_ORG_OFF=$(wc -l < {workspace}/uncover_org_offdomain.txt 2>/dev/null || echo 0)\nTLSX_NEW=$(wc -l < {workspace}/tlsx_new_subs.txt 2>/dev/null || echo 0)\nWAVE1_RESOLVED=$(wc -l < {workspace}/subdomains_all_resolved.txt 2>/dev/null || echo 0)\n\nOPEN_PORTS=$(test -f {workspace}/naabu.jsonl && jq -r '\"\\(.host):\\(.port)\"' {workspace}/naabu.jsonl 2>/dev/null | sort -u | wc -l || echo 0)\nCDN_HOSTS=$(jq -r 'select(.cdn==true) | .host' {workspace}/cdncheck.jsonl 2>/dev/null | wc -l || echo 0)\nORIGIN_HOSTS=$(wc -l < {workspace}/origin_hosts.txt 2>/dev/null || echo 0)\nUNIQUE_IPS=$(wc -l < {workspace}/ip_groups/unique_ips.txt 2>/dev/null || echo 0)\nSHARED_HOSTING=$(wc -l < {workspace}/ip_groups/shared_hosting.txt 2>/dev/null || echo 0)\nFAVICON_HASH=$(cat {workspace}/favicon_hash_used.txt 2>/dev/null || echo '-')\nFAVICON_IN=$(wc -l < {workspace}/favicon_in_scope.txt 2>/dev/null || echo 0)\nFAVICON_OFF=$(wc -l < {workspace}/favicon_related_offdomain.txt 2>/dev/null || echo 0)\nVHOST_IPS_FUZZED=$(wc -l < {workspace}/vhost_fuzz_ips.txt 2>/dev/null || echo 0)\nVHOST_NEW=$(wc -l < {workspace}/vhost_new_hosts.txt 2>/dev/null || echo 0)\nIP_PIVOT_RANGES=$(wc -l < {workspace}/ip_pivot_ranges.txt 2>/dev/null || echo 0)\nIP_PIVOT_IN=$(wc -l < {workspace}/ip_pivot_in_scope.txt 2>/dev/null || echo 0)\nIP_PIVOT_NEIGHBORS=$(wc -l < {workspace}/ip_pivot_neighbors.txt 2>/dev/null || echo 0)\nTOTAL_RESOLVED=$(wc -l < {workspace}/subdomains_final_resolved.txt 2>/dev/null || echo 0)\nLIVE_HTTP=$(wc -l < {workspace}/live_urls_final.txt 2>/dev/null || echo 0)\n\nURLS=$(wc -l < {workspace}/all_urls.txt 2>/dev/null || echo 0)\nJS_FILES=$(wc -l < {workspace}/js_urls.txt 2>/dev/null || echo 0)\nJS_APIS=$(wc -l < {workspace}/jsapiscan_results.txt 2>/dev/null || echo 0)\nJS_SUBS=$(wc -l < {workspace}/js_subs.txt 2>/dev/null || echo 0)\nSECRETFINDER=$(wc -l < {workspace}/secretfinder_results.txt 2>/dev/null || echo 0)\nTRUFFLEHOG=$(wc -l < {workspace}/trufflehog_results.jsonl 2>/dev/null || echo 0)\nGITLEAKS=$(jq 'if type==\"array\" then length else 0 end' {workspace}/gitleaks_results.json 2>/dev/null || echo 0)\nJSUBFINDER_SECRETS=$(wc -l < {workspace}/jsubfinder_secrets.txt 2>/dev/null || echo 0)\nGF_TOTAL=$(cat {workspace}/gf/*.txt 2>/dev/null | wc -l || echo 0)\n\nTAKEOVER=$(wc -l < {workspace}/takeover_findings.txt 2>/dev/null || echo 0)\nBUCKETS=$(jq -r 'select(.bucket.exists==1) | .bucket.name' {workspace}/s3scanner.json 2>/dev/null | wc -l || echo 0)\nENDPOINTS=$(wc -l < {workspace}/all_endpoints.txt 2>/dev/null || echo 0)\nALL_PARAMS=$(wc -l < {workspace}/all_params.txt 2>/dev/null || echo 0)\n\nNUCLEI_CRIT=$(jq -r 'select(.info.severity==\"critical\") | .host' {workspace}/nuclei_hosts.jsonl {workspace}/nuclei_misconfig.jsonl 2>/dev/null | sort -u | wc -l || echo 0)\nNUCLEI_HIGH=$(jq -r 'select(.info.severity==\"high\") | .host' {workspace}/nuclei_hosts.jsonl {workspace}/nuclei_misconfig.jsonl 2>/dev/null | sort -u | wc -l || echo 0)\nNUCLEI_MED=$(jq -r 'select(.info.severity==\"medium\") | .host' {workspace}/nuclei_hosts.jsonl {workspace}/nuclei_misconfig.jsonl 2>/dev/null | sort -u | wc -l || echo 0)\nNUCLEI_JS=$(cat {workspace}/nuclei_file_keys.jsonl {workspace}/nuclei_js_exposure.jsonl {workspace}/nuclei_target_exposure.jsonl {workspace}/nuclei_paths.jsonl 2>/dev/null | wc -l || echo 0)\nNUCLEI_PARAMS=$(wc -l < {workspace}/nuclei_params.jsonl 2>/dev/null || echo 0)\nAFROG_TOTAL=$(jq -r '.[\"poc-id\"\
    ]' {workspace}/afrog.jsonl 2>/dev/null | wc -l || echo 0)\n\nprintf '# VRecon — All-in-One Recon Report\\n**Target:** {target}\\n\\n## Phase A — Subdomain Discovery\\n| Metric | Count |\\n|--------|-------|\\n| Passive sources unique | %s |\\n| All candidates (passive+active+permutation) | %s |\\n| crt.sh (CT log) | %s |\\n| ASN/IP CIDR ranges | %s |\\n| amass intel CIDR ranges | %s |\\n| amass active/brute hits | %s |\\n| uncover cert-CN match | %s |\\n| uncover org-search — in-scope | %s |\\n| uncover org-search — off-domain (review) | %s |\\n| TLS SAN new discoveries | %s |\\n| **Wave-1 resolved hosts** | **%s** |\\n\\n## Phase B — Ports + Pivot (Wave-2)\\n| Metric | Count |\\n|--------|-------|\\n| Open ports found | %s |\\n| CDN hosts | %s |\\n| Origin (non-CDN) hosts | %s |\\n| Unique IPs | %s |\\n| Shared-hosting IPs (>1 host) | %s |\\n| Favicon-hash pivot (hash: %s) — in-scope | %s |\\n| Favicon-hash pivot — off-domain (review) | %s |\\n| VHost-IP-fuzz — IPs fuzzed | %s |\\n| VHost-IP-fuzz — new hosts | %s |\\n| IP-CIDR reverse pivot — ranges swept | %s |\\n| IP-CIDR reverse pivot — in-scope new hosts | %s |\\n| IP-CIDR reverse pivot — neighbor domains (review) | %s |\\n| **Total resolved hosts (Wave-1 + Wave-2)** | **%s** |\\n| Live HTTP endpoints | %s |\\n\\n## Phase C — URL / JS / Secrets Intelligence\\n| Metric | Count |\\n|--------|-------|\\n| Total URLs collected (1 shared crawl) | %s |\\n| JS files discovered | %s |\\n| JS API endpoints | %s |\\n| New subs mentioned in JS (informational) | %s |\\n| SecretFinder findings | %s |\\n| TruffleHog secrets | %s |\\n| Gitleaks findings | %s |\\n| jsubfinder secrets | %s |\\n| GF pattern matches (xss/sqli/ssrf/lfi/idor/rce/redirect) | %s |\\n\\n## Phase D — Takeover / Cloud / Endpoints / Params\\n| Metric | Count |\\n|--------|-------|\\n| Takeover candidates | %s |\\n| Cloud buckets exposed | %s |\\n| Dir-brute + JS + crawl endpoints (merged) | %s |\\n| Hidden parameters discovered | %s |\\n\\n## Phase E — Vulnerability Findings\\n| Severity / Source | Count |\\n|--------|-------|\\n| Critical | %s |\\n| High | %s |\\n| Medium | %s |\\n| JS/secrets/paths nuclei findings | %s |\\n| Param-surface nuclei findings | %s |\\n| afrog PoC findings | %s |\\n\\n## Files needing manual review (NOT auto-scanned further)\\n- favicon_related_offdomain.txt\\n- uncover_org_offdomain.txt\\n- ip_pivot_neighbors.txt\\n- ip_groups/shared_hosting.txt\\n\\n## Key Output Files\\n- subdomains_final_resolved.txt — all live hosts (Wave-1 + Wave-2)\\n- httpx_all.jsonl — live HTTP hosts with title/tech\\n- all_urls.txt — full URL corpus (1 shared crawl)\\n- all_params.txt — hidden parameters\\n- nuclei_hosts.jsonl / nuclei_misconfig.jsonl / afrog.jsonl — vuln findings\\n- screenshots/ + gallery.html — visual recon gallery\\n' \\\n  \"$PASSIVE\" \"$CANDIDATES\" \"$CRTSH\" \"$ASN_CIDRS\" \"$AMASS_INTEL_CIDRS\" \"$AMASS_ACTIVE\" \"$UNCOVER_CERT\" \"$UNCOVER_ORG_IN\" \"$UNCOVER_ORG_OFF\" \"$TLSX_NEW\" \"$WAVE1_RESOLVED\" \\\n  \"$OPEN_PORTS\" \"$CDN_HOSTS\" \"$ORIGIN_HOSTS\" \"$UNIQUE_IPS\" \"$SHARED_HOSTING\" \"$FAVICON_HASH\" \"$FAVICON_IN\" \"$FAVICON_OFF\" \"$VHOST_IPS_FUZZED\" \"$VHOST_NEW\" \"$IP_PIVOT_RANGES\" \"$IP_PIVOT_IN\" \"$IP_PIVOT_NEIGHBORS\" \"$TOTAL_RESOLVED\" \"$LIVE_HTTP\" \\\n  \"$URLS\" \"$JS_FILES\" \"$JS_APIS\" \"$JS_SUBS\" \"$SECRETFINDER\" \"$TRUFFLEHOG\" \"$GITLEAKS\" \"$JSUBFINDER_SECRETS\" \"$GF_TOTAL\" \\\n  \"$TAKEOVER\" \"$BUCKETS\" \"$ENDPOINTS\" \"$ALL_PARAMS\" \\\n  \"$NUCLEI_CRIT\" \"$NUCLEI_HIGH\" \"$NUCLEI_MED\" \"$NUCLEI_JS\" \"$NUCLEI_PARAMS\" \"$AFROG_TOTAL\" \\\n  > {workspace}/report/summary.md\n\ntest -s {workspace}/scan_notes.txt && { printf '\\n## Scan Notes\\n' >> {workspace}/report/summary.md; cat {workspace}/scan_notes.txt >> {workspace}/report/summary.md; }\n\nprintf '\\n=== ALL-IN-ONE RECON COMPLETE ===\\n'; cat {workspace}/report/summary.md\n"
  outputs:
