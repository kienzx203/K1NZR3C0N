name: 01-full-recon-pipeline
description: 'Full recon pipeline: passive+active subdomain → ASN/IP recon → amass intel → org uncover → TLS SAN mining → DNS resolve → IP grouping → HTTP probe → CDN check → favicon hash pivot → vhost IP fuzz → IP/PTR pivot → URL crawl → JS analysis → takeover → cloud storage → nuclei/afrog vuln scan'
vars:
  run_passive: 'true'
  run_waymore: 'true'
  run_asn: 'true'
  run_active_dns: 'true'
  run_permutation: 'true'
  run_tlsx: 'true'
  run_portscan: 'true'
  run_asn_portscan: 'true'
  run_deep_portscan: 'true'
  run_screenshot: 'true'
  run_cdncheck: 'true'
  run_crawl: 'true'
  run_js_analysis: 'true'
  run_takeover: 'true'
  run_s3scan: 'true'
  run_nuclei: 'true'
  run_afrog: 'true'
  run_axfr: 'true'
  run_revdns: 'true'
  run_ptr_scan: 'true'
  run_amass_active: 'false'
  run_recursive: 'false'      # recursive sub-subdomain enum on broad wildcards (slow)
  run_dns_records: 'true'     # extract SRV/MX/NS/TXT records → new hosts
  subdomains_list: ''
  chaos_key: ''
  # API keys are auto-injected from the /keys page — no need to set them here.
  # Wordlists — ordered fastest→most-complete
  sub_wordlist: ${K1NZR3C0N_BASE:-/opt/k1nzr3c0n}/wordlists/subdomains-top1million-20000.txt
  sub_wordlist_full: ${K1NZR3C0N_BASE:-/opt/k1nzr3c0n}/wordlists/subdomains-top1million-110000.txt
  sub_wordlist_jhaddix: ${K1NZR3C0N_BASE:-/opt/k1nzr3c0n}/wordlists/dns-Jhaddix.txt      # 2.17M entries
  sub_wordlist_assetnote: ${K1NZR3C0N_BASE:-/opt/k1nzr3c0n}/wordlists/best-dns-wordlist.txt # 9.5M entries (download on first build)
  sub_wordlist_namelist: ${K1NZR3C0N_BASE:-/opt/k1nzr3c0n}/wordlists/namelist.txt         # 151k focused list
  # Resolvers — trickest pre-validated list (12k resolvers) preferred; fallback = 6 hardcoded
  resolvers_file: ${K1NZR3C0N_BASE:-/opt/k1nzr3c0n}/wordlists/resolvers-trickest.txt
  dns_resolvers: 1.1.1.1,8.8.8.8,1.0.0.1,8.8.4.4,9.9.9.9,208.67.222.222
  dnsx_threads: '200'
  dnsx_retry: '3'
  massdns_rate: '20000'
  gotator_depth: '2'
  shuffledns_threads: '5000'
  naabu_rate: '1500'
  naabu_top_ports: '1000'
  rustscan_batch: '5000'
  rustscan_timeout_ms: '2000'
  nmap_flags: -sV -sC -Pn --open -T4 --max-retries 2
  httpx_threads: '100'
  httpx_timeout: '10'
  katana_depth: '3'
  katana_concurrency: '20'
  katana_crawl_timeout: 10m
  screenshot_threads: '10'
  nuclei_rl: '150'
  nuclei_concurrency: '25'
  nuclei_timeout: '10'
  org_name: ''
  # ── Pivot techniques (off by default — enable per-engagement) ───────────────
  run_amass_intel: 'false'       # amass intel removed in v5 — disabled (metabigor covers ASN)
  run_uncover_org: 'true'        # uncover org-name search on Shodan/FOFA/ZoomEye (needs org_name)
  run_favicon_pivot: 'false'     # mmh3 favicon hash → Shodan/FOFA same-favicon hosts
  run_vhost_ip_fuzz: 'false'     # ffuf Host-header fuzz non-CDN IPs (touches target directly)
  run_ip_pivot: 'false'          # mapcidr PTR sweep neighboring /24 CIDR blocks
  vhost_wordlist: ${K1NZR3C0N_BASE:-/opt/k1nzr3c0n}/wordlists/subdomains-top1million-20000.txt
  vhost_ip_fuzz_max_ips: '20'
  ip_pivot_prefix: '24'
  ip_pivot_max_ranges: '5'
  scripts_dir: /app
  oneforall_cmd: python /opt/OneForAll/oneforall.py
steps:
- id: setup_subfinder_keys
  name: '[setup] verify subfinder + uncover provider keys (written by system before run starts)'
  shell: true
  run: |
    # NOTE: The system (tasks.py) already writes ~/.config/subfinder/provider-config.yaml
    # and ~/.config/uncover/provider-config.yaml from the /keys UI DB BEFORE this step runs.
    # This step only supplements with any env-var-only keys NOT yet in the DB
    # (e.g., SECURITYTRAILS_KEY, VIRUSTOTAL_KEY added manually to .env but not /keys UI).
    # It reads the existing config and ADDS missing keys rather than overwriting.

    mkdir -p ~/.config/subfinder ~/.config/uncover
    EXISTING_SF=/root/.config/subfinder/provider-config.yaml

    # ── Supplement subfinder config with any env-var keys not yet written ───────
    # tasks.py writes provider-config.yaml from /keys UI DB before the run starts.
    # This block adds any keys present only as env vars (e.g. set in .env / systemd
    # service environment) that were not in the DB at run start time. It never overwrites DB keys.
    {
      # Preserve what tasks.py already wrote
      cat "$EXISTING_SF" 2>/dev/null || true

      # SECURITYTRAILS — managed via /keys UI; fallback covers env-only deployments
      ST_T="${SECURITYTRAILS_KEY:-}"
      [ -n "$ST_T" ] && ! grep -q '^securitytrails:' "$EXISTING_SF" 2>/dev/null && \
        printf 'securitytrails:\n  - %s\n' "$ST_T"

      # VIRUSTOTAL — managed via /keys UI; fallback covers env-only deployments
      VT_T="${VIRUSTOTAL_KEY:-}"
      [ -n "$VT_T" ] && ! grep -q '^virustotal:' "$EXISTING_SF" 2>/dev/null && \
        printf 'virustotal:\n  - %s\n' "$VT_T"

      # ZOOMEYE — not currently in /keys UI
      ZY_T="${ZOOMEYE_API_KEY:-}"
      [ -n "$ZY_T" ] && ! grep -q '^zoomeyeapi:' "$EXISTING_SF" 2>/dev/null && \
        printf 'zoomeyeapi:\n  - %s\n' "$ZY_T"

      # HACKERTARGET — optional key for higher rate limits
      HT_T="${HACKERTARGET_API_KEY:-}"
      [ -n "$HT_T" ] && ! grep -q '^hackertarget:' "$EXISTING_SF" 2>/dev/null && \
        printf 'hackertarget:\n  - %s\n' "$HT_T"
    } > /tmp/.sf_merged.yaml 2>/dev/null || true

    # Write merged config only if we actually added anything new
    if [ -s /tmp/.sf_merged.yaml ]; then
      cp /tmp/.sf_merged.yaml "$EXISTING_SF"
    fi

    # ── Also supplement uncover config with env-var hunter/greynoise/etc ────
    EXISTING_UC=/root/.config/uncover/provider-config.yaml
    {
      cat "$EXISTING_UC" 2>/dev/null || true
      HUNTER_T="${HUNTER_API_KEY:-}"
      [ -n "$HUNTER_T" ] && ! grep -q '^hunter:' "$EXISTING_UC" 2>/dev/null && \
        printf 'hunter:\n  - %s\n' "$HUNTER_T"
      GN_T="${GREYNOISE_API_KEY:-}"
      [ -n "$GN_T" ] && ! grep -q '^greynoise:' "$EXISTING_UC" 2>/dev/null && \
        printf 'greynoise:\n  - %s\n' "$GN_T"
    } > /tmp/.uc_merged.yaml 2>/dev/null || true
    if [ -s /tmp/.uc_merged.yaml ]; then
      cp /tmp/.uc_merged.yaml "$EXISTING_UC"
    fi

    ACTIVE_KEYS=$(grep -c '^\w' ~/.config/subfinder/provider-config.yaml 2>/dev/null || echo 0)
    ACTIVE_UNCOVER=$(grep -c '^\w' ~/.config/uncover/provider-config.yaml 2>/dev/null || echo 0)
    printf '[setup] subfinder: %s providers | uncover: %s providers active\n' \
      "$ACTIVE_KEYS" "$ACTIVE_UNCOVER"
    # Print which providers are configured
    printf '[setup] subfinder sources: %s\n' \
      "$(grep '^\w' ~/.config/subfinder/provider-config.yaml 2>/dev/null | tr -d ':' | tr '\n' ',' | sed 's/,$//')"
    touch {workspace}/.setup_done
  outputs:
    file: '{workspace}/.setup_done'
- id: p_subfinder
  name: '[passive] subfinder — cert transparency + 50 passive sources (with all /keys UI providers)'
  when: '{vars.run_passive}'
  depends_on:
  - setup_subfinder_keys
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 10m
  run: |
    subfinder -d {target} -silent -all -recursive \
      -timeout 60 2>/dev/null \
      > {workspace}/p_subfinder.txt || true
    touch {workspace}/p_subfinder.txt
    printf 'subfinder: %s subdomains\n' "$(wc -l < {workspace}/p_subfinder.txt)"
  outputs:
    file: '{workspace}/p_subfinder.txt'
- id: p_assetfinder
  name: '[passive] assetfinder — Facebook CT + various APIs'
  when: '{vars.run_passive}'
  shell: true
  optional: true
  skip_if_exists: true
  run: assetfinder --subs-only {target} > {workspace}/p_assetfinder.txt 2>/dev/null; touch {workspace}/p_assetfinder.txt
  outputs:
    file: '{workspace}/p_assetfinder.txt'
- id: p_findomain
  name: '[passive] findomain — certificate transparency + APIs'
  when: '{vars.run_passive}'
  optional: true
  skip_if_exists: true
  run: findomain -t {target} -q -u {workspace}/p_findomain.txt
  outputs:
    file: '{workspace}/p_findomain.txt'
- id: p_sublist3r
  name: '[passive] sublist3r — search engines (Google/Bing/Baidu/Netcraft)'
  when: '{vars.run_passive}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 10m
  run: sublist3r -d {target} -o {workspace}/p_sublist3r.txt 2>/dev/null; touch {workspace}/p_sublist3r.txt
  outputs:
    file: '{workspace}/p_sublist3r.txt'
- id: p_amass
  name: '[passive] amass — OWASP passive multi-source'
  when: '{vars.run_passive}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 30m
  run: amass enum -passive -d {target} -silent -o {workspace}/p_amass.txt 2>/dev/null; touch {workspace}/p_amass.txt
  outputs:
    file: '{workspace}/p_amass.txt'
- id: p_chaos
  name: '[passive] chaos — ProjectDiscovery bug-bounty dataset'
  when: '{vars.run_passive}'
  shell: true
  optional: true
  skip_if_exists: true
  run: |
    CHAOS_KEY="${CHAOS_API_KEY:-{vars.chaos_key}}"
    if [ -z "$CHAOS_KEY" ]; then
      echo "[chaos] no CHAOS_API_KEY set — skipping (add to .env to enable)"
      touch {workspace}/p_chaos.txt; exit 0
    fi
    chaos -d {target} -silent -key "$CHAOS_KEY" -o {workspace}/p_chaos.txt 2>/dev/null
    touch {workspace}/p_chaos.txt
    printf '[chaos] %s subdomains\n' "$(wc -l < {workspace}/p_chaos.txt)"
  outputs:
    file: '{workspace}/p_chaos.txt'
- id: p_oneforall
  name: '[passive] OneForAll — comprehensive 60-source aggregator'
  when: '{vars.run_passive}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 45m
  run: mkdir -p {workspace}/oneforall && {vars.oneforall_cmd} --target {target} --path {workspace}/oneforall --fmt csv --brute False run 2>/dev/null; true
  outputs:
    dir: '{workspace}/oneforall'
- id: p_oneforall_extract
  name: '[passive] OneForAll — extract subdomains from CSV'
  depends_on:
  - p_oneforall
  shell: true
  optional: true
  run: python {vars.scripts_dir}/scripts/oneforall_extract.py --input {workspace}/oneforall --output {workspace}/p_oneforall.txt 2>/dev/null; touch {workspace}/p_oneforall.txt
  outputs:
    file: '{workspace}/p_oneforall.txt'
- id: p_cero
  name: '[passive] cero — TLS certificate SAN extraction via SNI'
  when: '{vars.run_passive}'
  shell: true
  optional: true
  skip_if_exists: true
  run: cero {target} 2>/dev/null | grep -F ".{target}" | sed 's/^\*\.//' | sort -u > {workspace}/p_cero.txt; touch {workspace}/p_cero.txt
  outputs:
    file: '{workspace}/p_cero.txt'
- id: p_uncover
  name: '[passive] uncover — Shodan/Fofa/Censys/Hunter/Netlas OSINT'
  when: '{vars.run_passive}'
  shell: true
  optional: true
  skip_if_exists: true
  run: |
    (
      uncover -q "ssl.cert.subject.cn:{target}"    -silent 2>/dev/null || true
      uncover -q "ssl.cert.subject.cn:*.{target}"  -silent 2>/dev/null || true
      uncover -q "domain:{target}"                 -silent 2>/dev/null || true
      uncover -q "hostname:{target}"               -silent 2>/dev/null || true
      uncover -q "http.title:{target}"             -silent 2>/dev/null || true
    ) | grep -oP '[a-zA-Z0-9._-]+\.{target}' | sort -u > {workspace}/p_uncover.txt
    touch {workspace}/p_uncover.txt
    printf 'uncover subs: %s\n' "$(wc -l < {workspace}/p_uncover.txt)"
  outputs:
    file: '{workspace}/p_uncover.txt'
- id: p_uncover_org
  name: '[passive] uncover — org-name search across Shodan/FOFA/ZoomEye (finds IPs + subs under org name)'
  depends_on:
  - setup_subfinder_keys
  when: '{vars.run_passive} && {vars.run_uncover_org} && {vars.org_name}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 5m
  run: |
    uncover -q "org:\"{vars.org_name}\"" -e shodan,fofa,zoomeye -silent 2>/dev/null | sort -u > {workspace}/p_uncover_org_raw.txt
    touch {workspace}/p_uncover_org_raw.txt
    printf 'uncover org-name raw results: %s\n' "$(wc -l < {workspace}/p_uncover_org_raw.txt)"
  outputs:
    file: '{workspace}/p_uncover_org_raw.txt'
- id: p_uncover_org_filter
  name: '[passive] split org-name uncover results — in-scope (auto-merge) vs off-domain (reference)'
  depends_on:
  - p_uncover_org
  when: '{vars.run_passive} && {vars.run_uncover_org} && {vars.org_name}'
  run_on_failed_deps: true
  shell: true
  optional: true
  run: |
    touch {workspace}/p_uncover_org_in_scope.txt {workspace}/p_uncover_org_offdomain.txt
    test -s {workspace}/p_uncover_org_raw.txt || exit 0
    sed 's|https\?://||; s|/.*||; s|:.*||' {workspace}/p_uncover_org_raw.txt \
      | tr '[:upper:]' '[:lower:]' | sort -u > {workspace}/p_uncover_org_hosts.txt
    grep -E '^[a-z0-9][a-z0-9._-]*\.[a-z]{2,}$' {workspace}/p_uncover_org_hosts.txt \
      | awk -v t="{target}" 'length($0)>=length(t) && substr($0,length($0)-length(t)+1)==t' \
      | sort -u > {workspace}/p_uncover_org_in_scope.txt || true
    comm -23 <(sort {workspace}/p_uncover_org_hosts.txt) <(sort {workspace}/p_uncover_org_in_scope.txt) \
      > {workspace}/p_uncover_org_offdomain.txt 2>/dev/null || true
    touch {workspace}/p_uncover_org_in_scope.txt {workspace}/p_uncover_org_offdomain.txt
    printf 'org uncover: %s in-scope | %s off-domain (different org asset)\n' \
      "$(wc -l < {workspace}/p_uncover_org_in_scope.txt)" \
      "$(wc -l < {workspace}/p_uncover_org_offdomain.txt)"
  outputs:
    in_scope: '{workspace}/p_uncover_org_in_scope.txt'
    offdomain: '{workspace}/p_uncover_org_offdomain.txt'
- id: p_waybackurls
  name: '[passive] waybackurls — extract subdomains from Wayback Machine URLs (saves full URL corpus too)'
  when: '{vars.run_passive}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 10m
  run: |
    echo {target} | timeout 90 waybackurls 2>/dev/null \
      | tee {workspace}/p_waybackurls_urls.txt \
      | grep -oP '(?:https?://)\K[a-zA-Z0-9._-]+\.{target}(?=[/?#]|$)' \
      | sort -u > {workspace}/p_waybackurls_subs.txt || true
    touch {workspace}/p_waybackurls_subs.txt {workspace}/p_waybackurls_urls.txt
  outputs:
    subs: '{workspace}/p_waybackurls_subs.txt'
    urls: '{workspace}/p_waybackurls_urls.txt'
- id: p_gau
  name: '[passive] gau — extract subdomains from GAU URL archive (saves full URL corpus too)'
  when: '{vars.run_passive}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 10m
  run: |
    gau --subs {target} --threads 5 --timeout 30 2>/dev/null \
      | tee {workspace}/p_gau_urls.txt \
      | grep -oP '(?:https?://)\K[a-zA-Z0-9._-]+\.{target}(?=[/?#]|$)' \
      | sort -u > {workspace}/p_gau_subs.txt || true
    touch {workspace}/p_gau_subs.txt {workspace}/p_gau_urls.txt
  outputs:
    subs: '{workspace}/p_gau_subs.txt'
    urls: '{workspace}/p_gau_urls.txt'
- id: p_waymore
  name: '[passive] waymore — Wayback+CommonCrawl+OTX+URLScan URL archive → subdomains'
  when: '{vars.run_passive} && {vars.run_waymore}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 15m
  run: waymore -i {target} -mode U -oU {workspace}/p_waymore_urls.txt -t 120 2>/dev/null || true; test -f {workspace}/p_waymore_urls.txt && grep -oP '(?:https?://)\K[a-zA-Z0-9._-]+\.{target}(?=[/?#]|$)' {workspace}/p_waymore_urls.txt | sort -u > {workspace}/p_waymore_subs.txt || true; touch {workspace}/p_waymore_subs.txt {workspace}/p_waymore_urls.txt
  outputs:
    subs: '{workspace}/p_waymore_subs.txt'
    urls: '{workspace}/p_waymore_urls.txt'
- id: p_urlfinder
  name: '[passive] urlfinder — Wayback+AlienVault+CommonCrawl+URLScan URL archive → subdomains'
  when: '{vars.run_passive} && {vars.run_waymore}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 10m
  run: urlfinder -d {target} -silent -o {workspace}/p_urlfinder_urls.txt 2>/dev/null || true; test -f {workspace}/p_urlfinder_urls.txt && grep -oP '(?:https?://)\K[a-zA-Z0-9._-]+\.{target}(?=[/?#]|$)' {workspace}/p_urlfinder_urls.txt | sort -u > {workspace}/p_urlfinder_subs.txt || true; touch {workspace}/p_urlfinder_subs.txt {workspace}/p_urlfinder_urls.txt
  outputs:
    subs: '{workspace}/p_urlfinder_subs.txt'
    urls: '{workspace}/p_urlfinder_urls.txt'
- id: p_crtsh
  name: '[passive] crt.sh — certificate transparency direct API (wildcard % + exact domain — finds multi-SAN certs)'
  when: '{vars.run_passive}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 5m
  run: |
    (
      curl -s "https://crt.sh/?q=%.{target}&output=json" --max-time 60 2>/dev/null \
        | jq -r '.[].name_value' 2>/dev/null | tr ',' '\n' | sed 's/^\*\.//' || true
      curl -s "https://crt.sh/?q={target}&output=json" --max-time 60 2>/dev/null \
        | jq -r '.[].name_value' 2>/dev/null | tr ',' '\n' | sed 's/^\*\.//' || true
    ) | tr '[:upper:]' '[:lower:]' \
      | grep -E "\.{target}$|^{target}$" | sort -u > {workspace}/p_crtsh.txt || true
    touch {workspace}/p_crtsh.txt
    printf 'crt.sh subs: %s\n' "$(wc -l < {workspace}/p_crtsh.txt)"
  outputs:
    file: '{workspace}/p_crtsh.txt'
- id: p_certspotter
  name: '[passive] certspotter — SSLMate CT log API (different dataset from crt.sh, free)'
  when: '{vars.run_passive}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 10m
  run: |
    > {workspace}/p_certspotter.txt
    TOKEN="";  # free tier: 100/page, no key needed; set CERTSPOTTER_KEY for higher limits
    [ -n "${CERTSPOTTER_KEY:-}" ] && TOKEN="-H 'Authorization: Bearer ${CERTSPOTTER_KEY}'"
    AFTER=""
    for PAGE in $(seq 1 20); do
      URL="https://api.certspotter.com/v1/issuances?domain={target}&include_subdomains=true&expand=dns_names"
      [ -n "$AFTER" ] && URL="$URL&after=$AFTER"
      RESP=$(eval curl -sL "$URL" $TOKEN --max-time 30 2>/dev/null)
      COUNT=$(echo "$RESP" | jq 'length' 2>/dev/null || echo 0)
      COUNT=${COUNT:-0}
      [ "$COUNT" -le 0 ] && break
      echo "$RESP" | jq -r '.[].dns_names[]' 2>/dev/null \
        | sed 's/^\*\.//' | tr '[:upper:]' '[:lower:]' \
        | grep -E "(^|\.)$(echo {target} | sed 's/\./\\./g')$" >> {workspace}/p_certspotter.txt || true
      # Get last ID for pagination
      AFTER=$(echo "$RESP" | jq -r '.[-1].id // empty' 2>/dev/null)
      [ -z "$AFTER" ] && break
      [ "$COUNT" -lt 100 ] && break
    done
    sort -u -o {workspace}/p_certspotter.txt {workspace}/p_certspotter.txt
    touch {workspace}/p_certspotter.txt
    printf 'certspotter CT subs: %s\n' "$(wc -l < {workspace}/p_certspotter.txt)"
  outputs:
    file: '{workspace}/p_certspotter.txt'
- id: p_hackertarget
  name: '[passive] hackertarget — free DNS lookup API (no key required)'
  when: '{vars.run_passive}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 3m
  run: |
    curl -s "https://api.hackertarget.com/hostsearch/?q={target}" --max-time 30 2>/dev/null \
      | grep -oP '[a-zA-Z0-9._-]+\.{target}' | sort -u > {workspace}/p_hackertarget.txt || true
    touch {workspace}/p_hackertarget.txt
  outputs:
    file: '{workspace}/p_hackertarget.txt'
- id: p_alienvault
  name: '[passive] alienvault OTX — passive DNS + URL intel → subdomains'
  when: '{vars.run_passive}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 5m
  run: |
    > {workspace}/p_alienvault.txt
    for PAGE in 1 2 3 4 5; do
      RESP=$(curl -s "https://otx.alienvault.com/api/v1/indicators/domain/{target}/passive_dns?page=${PAGE}&limit=100" --max-time 30 2>/dev/null)
      COUNT=$(echo "$RESP" | jq '.count // 0' 2>/dev/null || echo 0)
      COUNT=${COUNT:-0}
      echo "$RESP" | jq -r '.passive_dns[]?.hostname // empty' 2>/dev/null \
        | grep -E "(^|\.)({target}|[a-z0-9._-]+\.{target})$" >> {workspace}/p_alienvault.txt || true
      [ "$COUNT" -le 0 ] && break
    done
    sort -u -o {workspace}/p_alienvault.txt {workspace}/p_alienvault.txt
    touch {workspace}/p_alienvault.txt
  outputs:
    file: '{workspace}/p_alienvault.txt'
- id: p_rapiddns
  name: '[passive] rapiddns — fast passive DNS lookup (no key required)'
  when: '{vars.run_passive}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 3m
  run: |
    curl -s "https://rapiddns.io/subdomain/{target}?full=1&down=1" --max-time 30 \
      -H "User-Agent: Mozilla/5.0" 2>/dev/null \
      | grep -oP '[a-zA-Z0-9._-]+\.{target}' | sort -u > {workspace}/p_rapiddns.txt || true
    touch {workspace}/p_rapiddns.txt
  outputs:
    file: '{workspace}/p_rapiddns.txt'
- id: p_gauplus
  name: '[passive] gauplus — extended URL archive (Wayback+OTX+VirusTotal+URLScan+more) → subdomains'
  when: '{vars.run_passive}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 10m
  run: |
    gauplus --subs {target} -t 10 --timeout 30 2>/dev/null \
      | grep -oP '(?:https?://)\K[a-zA-Z0-9._-]+\.{target}(?=[/?#]|$)' \
      | sort -u > {workspace}/p_gauplus_subs.txt || true
    touch {workspace}/p_gauplus_subs.txt
  outputs:
    file: '{workspace}/p_gauplus_subs.txt'
- id: p_urlscan
  name: '[passive] urlscan.io — global scan index (finds subs from security researcher scans)'
  when: '{vars.run_passive}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 5m
  run: |
    # Paginate using correct `from` offset (not search_after cursor — that requires prev response)
    # Authenticated via URLSCAN_API_KEY if available (1000/day quota; public = 120/min limit)
    > {workspace}/p_urlscan.txt
    URLSCAN_HEADER=""
    [ -n "${URLSCAN_API_KEY:-}" ] && URLSCAN_HEADER="-H API-Key:${URLSCAN_API_KEY}"
    PAGE_SIZE=100
    MAX_RESULTS=1000
    OFFSET=0
    while [ "$OFFSET" -lt "$MAX_RESULTS" ]; do
      RESP=$(curl -sL $URLSCAN_HEADER \
        "https://urlscan.io/api/v1/search/?q=domain:{target}&size=${PAGE_SIZE}&from=${OFFSET}" \
        --max-time 20 2>/dev/null)
      COUNT=$(echo "$RESP" | jq '.results | length' 2>/dev/null || echo 0)
      COUNT=${COUNT:-0}
      [ "$COUNT" -le 0 ] && break
      echo "$RESP" | jq -r '.results[].page.domain // empty' 2>/dev/null \
        | grep -E "(^|\.)$(echo {target} | sed 's/\./\\./g')$" >> {workspace}/p_urlscan.txt || true
      TOTAL=$(echo "$RESP" | jq -r '.total // 0' 2>/dev/null || echo 0)
      TOTAL=${TOTAL:-0}
      OFFSET=$((OFFSET + PAGE_SIZE))
      [ "$OFFSET" -ge "$TOTAL" ] && break
      [ "$COUNT" -lt "$PAGE_SIZE" ] && break
    done
    sort -u -o {workspace}/p_urlscan.txt {workspace}/p_urlscan.txt
    touch {workspace}/p_urlscan.txt
    printf 'urlscan.io subs: %s\n' "$(wc -l < {workspace}/p_urlscan.txt)"
  outputs:
    file: '{workspace}/p_urlscan.txt'
- id: p_github_code
  name: '[passive] github code search — find hardcoded subdomains in public repos (uses GITHUB_TOKEN)'
  when: '{vars.run_passive}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 10m
  run: |
    GH_TOKEN="${GITHUB_TOKEN:-}"
    touch {workspace}/p_github_code.txt
    if [ -z "$GH_TOKEN" ]; then
      echo "[github_code] GITHUB_TOKEN not set — skipping (set in .env for up to 5000 req/hr)"; exit 0
    fi
    # Check if github-subdomains binary is available (installed in image)
    if command -v github-subdomains >/dev/null 2>&1; then
      github-subdomains -d {target} -raw -t "$GH_TOKEN" 2>/dev/null \
        | grep -E "(^|\.)$(echo {target} | sed 's/\./\\./g')$" \
        | sort -u > {workspace}/p_github_code.txt || true
    else
      # Fallback: GitHub Search API directly (3 search queries)
      for QUERY in "$(echo {target})" "\"https://\" \".{target}\"" "\".{target}\" in:file"; do
        curl -sL "https://api.github.com/search/code?q=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$QUERY'))")&per_page=100" \
          -H "Authorization: token $GH_TOKEN" \
          -H "Accept: application/vnd.github.v3.text-match+json" \
          --max-time 30 2>/dev/null \
          | jq -r '.items[].text_matches[]?.fragment // empty' 2>/dev/null \
          | grep -oE '[a-zA-Z0-9_.-]+\.{target}' >> {workspace}/p_github_code.txt || true
        sleep 2  # GitHub search rate limit
      done
      sort -u -o {workspace}/p_github_code.txt {workspace}/p_github_code.txt
    fi
    touch {workspace}/p_github_code.txt
    printf 'GitHub code subs: %s\n' "$(wc -l < {workspace}/p_github_code.txt)"
  outputs:
    file: '{workspace}/p_github_code.txt'
- id: p_securitytrails
  name: '[passive] securitytrails API — historical passive DNS'
  when: '{vars.run_passive}'
  shell: true
  optional: true
  timeout: 5m
  # Run after subfinder/gau/waymore finish — they saturate the network
  # during the first 60-120s of the workflow, causing SecurityTrails TLS timeouts.
  depends_on:
    - p_subfinder
    - p_gau
    - p_waymore
  run: |
    ST_KEY="${SECURITYTRAILS_KEY:-}"
    [ -z "$ST_KEY" ] && echo "[securitytrails] no key — skipping" && touch {workspace}/p_securitytrails.txt && exit 0
    python3 ${K1NZR3C0N_BASE:-/opt/k1nzr3c0n}/scripts/securitytrails_fetch.py "$ST_KEY" "{target}" \
      | sort -u > {workspace}/p_securitytrails.txt || true
    touch {workspace}/p_securitytrails.txt
    printf 'SecurityTrails: %s subdomains\n' "$(wc -l < {workspace}/p_securitytrails.txt)"
  outputs:
    file: '{workspace}/p_securitytrails.txt'
- id: p_virustotal
  name: '[passive] virustotal passive DNS — huge historical dataset (needs VIRUSTOTAL_KEY)'
  when: '{vars.run_passive}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 5m
  run: |
    VT_KEY="${VIRUSTOTAL_KEY:-}"
    touch {workspace}/p_virustotal.txt
    [ -z "$VT_KEY" ] && echo "[virustotal] no key — skipping (free tier at virustotal.com)" && exit 0
    CURSOR=""
    for PAGE in 1 2 3 4 5; do
      URL="https://www.virustotal.com/api/v3/domains/{target}/subdomains?limit=40"
      [ -n "$CURSOR" ] && URL="$URL&cursor=$CURSOR"
      RESP=$(curl -sL "$URL" -H "x-apikey: $VT_KEY" --max-time 30 2>/dev/null)
      echo "$RESP" | jq -r '.data[].id // empty' 2>/dev/null >> {workspace}/p_virustotal.txt || true
      CURSOR=$(echo "$RESP" | jq -r '.meta.cursor // empty' 2>/dev/null)
      [ -z "$CURSOR" ] && break
    done
    sort -u -o {workspace}/p_virustotal.txt {workspace}/p_virustotal.txt
    touch {workspace}/p_virustotal.txt
    printf 'VirusTotal subs: %s\n' "$(wc -l < {workspace}/p_virustotal.txt)"
  outputs:
    file: '{workspace}/p_virustotal.txt'
- id: p_bevigil
  name: '[passive] bevigil — mobile app (APK/IPA) subdomain recon (needs BEVIGIL_KEY)'
  when: '{vars.run_passive}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 3m
  run: |
    BEV_KEY="${BEVIGIL_KEY:-}"
    touch {workspace}/p_bevigil.txt
    [ -z "$BEV_KEY" ] && echo "[bevigil] no key — skipping (register free at bevigil.com)" && exit 0
    curl -sL "https://osint.bevigil.com/api/{target}/subdomains/" \
      -H "X-Access-Token: $BEV_KEY" --max-time 30 2>/dev/null \
      | jq -r '.subdomains[]? // empty' 2>/dev/null \
      | sort -u > {workspace}/p_bevigil.txt || true
    touch {workspace}/p_bevigil.txt
    printf 'Bevigil subs: %s\n' "$(wc -l < {workspace}/p_bevigil.txt)"
  outputs:
    file: '{workspace}/p_bevigil.txt'
- id: p_shosubgo
  name: '[passive] shosubgo — Shodan subdomain database (needs SHODAN_API_KEY)'
  when: '{vars.run_passive}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 5m
  run: |
    SHODAN_KEY="${SHODAN_API_KEY:-}"
    touch {workspace}/p_shosubgo.txt
    if [ -z "$SHODAN_KEY" ]; then
      echo "[shosubgo] no SHODAN_API_KEY — skipping"; exit 0
    fi
    if command -v shosubgo >/dev/null 2>&1; then
      shosubgo -d {target} -shodanKey "$SHODAN_KEY" 2>/dev/null \
        | grep -E "(^|\.)$(echo {target} | sed 's/\./\\./g')$" \
        | sort -u > {workspace}/p_shosubgo.txt || true
    else
      # Fallback: Shodan API directly for SSL certificates
      curl -sL "https://api.shodan.io/dns/domain/{target}?key=$SHODAN_KEY&history=false&type=A&page=1" \
        --max-time 30 2>/dev/null \
        | jq -r '.subdomains[]? // empty' 2>/dev/null \
        | awk '{print $0".{target}"}' > {workspace}/p_shosubgo.txt || true
    fi
    touch {workspace}/p_shosubgo.txt
    printf 'Shosubgo/Shodan subs: %s\n' "$(wc -l < {workspace}/p_shosubgo.txt)"
  outputs:
    file: '{workspace}/p_shosubgo.txt'
- id: p_threatcrowd
  name: '[passive] threatcrowd + dnstable — threat intel passive DNS (free)'
  when: '{vars.run_passive}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 5m
  run: |
    touch {workspace}/p_threatcrowd.txt
    # ThreatCrowd (free, community API)
    curl -sL "https://www.threatcrowd.org/searchApi/v2/domain/report/?domain={target}" \
      --max-time 20 2>/dev/null \
      | jq -r '.subdomains[]? // empty' 2>/dev/null \
      | grep -E "(^|\.)$(echo {target} | sed 's/\./\\./g')$" >> {workspace}/p_threatcrowd.txt || true
    # DNSRepo (free, no key)
    curl -sL "https://dnsrepo.noc.org/?domain={target}&type=A" \
      --max-time 20 -H "User-Agent: Mozilla/5.0" 2>/dev/null \
      | grep -oP '[a-zA-Z0-9._-]+\.{target}' >> {workspace}/p_threatcrowd.txt || true
    sort -u -o {workspace}/p_threatcrowd.txt {workspace}/p_threatcrowd.txt
    touch {workspace}/p_threatcrowd.txt
  outputs:
    file: '{workspace}/p_threatcrowd.txt'
- id: p_amass_active
  name: '[active] amass enum active — DNS brute + AXFR + reverse + cert (slow, thorough)'
  when: '{vars.run_amass_active}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 90m
  run: |
    amass enum -active -d {target} -silent \
      -o {workspace}/p_amass_active.txt 2>/dev/null || true
    touch {workspace}/p_amass_active.txt
    printf 'amass active subs: %s\n' "$(wc -l < {workspace}/p_amass_active.txt)"
  outputs:
    file: '{workspace}/p_amass_active.txt'
- id: axfr_check
  name: '[active] AXFR zone transfer — attempt on all authoritative NS records'
  when: '{vars.run_axfr}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 5m
  run: |
    touch {workspace}/axfr_subs.txt
    NS_LIST=$(dig +short NS {target} 2>/dev/null | sed 's/\.$//')
    if [ -z "$NS_LIST" ]; then
      echo "[axfr] no NS records found for {target}"; exit 0
    fi
    for NS in $NS_LIST; do
      echo "[axfr] trying $NS ..."
      dig AXFR {target} @"$NS" 2>/dev/null \
        | awk -v dom="{target}" '$4=="A"||$4=="CNAME"||$4=="AAAA" {
            sub(/\.$/, "", $1);
            if ($1 ~ dom"$" && $1 != dom) print $1
          }' >> {workspace}/axfr_subs.txt || true
    done
    sort -u -o {workspace}/axfr_subs.txt {workspace}/axfr_subs.txt
    AXFR_COUNT=$(wc -l < {workspace}/axfr_subs.txt)
    printf '[axfr] zone transfer subdomains leaked: %s\n' "$AXFR_COUNT"
  outputs:
    file: '{workspace}/axfr_subs.txt'
- id: merge_passive
  name: merge all passive sources → deduplicate + scope-filter
  depends_on:
  - p_subfinder
  - p_assetfinder
  - p_findomain
  - p_sublist3r
  - p_amass
  - p_chaos
  - p_oneforall_extract
  - p_cero
  - p_uncover
  - p_waybackurls
  - p_gau
  - p_waymore
  - p_urlfinder
  - p_crtsh
  - p_certspotter
  - p_hackertarget
  - p_alienvault
  - p_rapiddns
  - p_gauplus
  - p_urlscan
  - p_github_code
  - p_securitytrails
  - p_virustotal
  - p_bevigil
  - p_shosubgo
  - p_threatcrowd
  - p_amass_active
  - axfr_check
  - p_uncover_org_filter
  run_on_failed_deps: true
  shell: true
  run: |
    (
      printf '%s\n%s\n' "{target}" "www.{target}"
      cat \
        {workspace}/p_subfinder.txt \
        {workspace}/p_assetfinder.txt \
        {workspace}/p_findomain.txt \
        {workspace}/p_sublist3r.txt \
        {workspace}/p_amass.txt \
        {workspace}/p_chaos.txt \
        {workspace}/p_oneforall.txt \
        {workspace}/p_cero.txt \
        {workspace}/p_uncover.txt \
        {workspace}/p_uncover_org_in_scope.txt \
        {workspace}/p_waybackurls_subs.txt \
        {workspace}/p_gau_subs.txt \
        {workspace}/p_waymore_subs.txt \
        {workspace}/p_urlfinder_subs.txt \
        {workspace}/p_crtsh.txt \
        {workspace}/p_certspotter.txt \
        {workspace}/p_hackertarget.txt \
        {workspace}/p_alienvault.txt \
        {workspace}/p_rapiddns.txt \
        {workspace}/p_gauplus_subs.txt \
        {workspace}/p_urlscan.txt \
        {workspace}/p_github_code.txt \
        {workspace}/p_securitytrails.txt \
        {workspace}/p_virustotal.txt \
        {workspace}/p_bevigil.txt \
        {workspace}/p_shosubgo.txt \
        {workspace}/p_threatcrowd.txt \
        {workspace}/p_amass_active.txt \
        {workspace}/axfr_subs.txt \
        2>/dev/null || true
      test -n '{vars.subdomains_list}' && test -f '{vars.subdomains_list}' && cat '{vars.subdomains_list}' || true
    ) | sed 's|https\?://||; s|/.*||; s|^\*\.||; s|\.$||; s|[[:space:]].*||' \
      | tr '[:upper:]' '[:lower:]' \
      | grep -E '^[a-z0-9][a-z0-9._-]*\.[a-z]{2,}$' \
      | awk -v t="{target}" 'length($0)>=length(t) && substr($0,length($0)-length(t)+1)==t' \
      | sort -u > {workspace}/passive_merged.txt
  outputs:
    file: '{workspace}/passive_merged.txt'
  requires:
  - path: '{workspace}/passive_merged.txt'
    min_bytes: 1
- id: recursive_enum
  name: '[passive] recursive subfinder — enumerate sub-subdomains of wildcard/broad hosts'
  depends_on:
  - merge_passive
  when: '{vars.run_recursive}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 60m
  run: |
    touch {workspace}/p_recursive.txt
    test -s {workspace}/passive_merged.txt || exit 0
    # Extract unique 2nd-level subdomains (e.g., cloud.target.com → enumerate *.cloud.target.com)
    # Find hosts with 3+ labels that could be wildcard parents
    grep -oP '^[^.]+\.[^.]+\.{target}$' {workspace}/passive_merged.txt 2>/dev/null \
      | awk -F. '{print $2"."$3"."$4}' | sort -u \
      | head -50 > {workspace}/recursive_parents.txt || true
    touch {workspace}/recursive_parents.txt
    if test -s {workspace}/recursive_parents.txt; then
      echo "[recursive] enumerating $(wc -l < {workspace}/recursive_parents.txt) parent domains ..."
      while IFS= read -r parent; do
        subfinder -d "$parent" -silent -all -t 100 -timeout 30 2>/dev/null \
          | grep -E "\.$(echo {target} | sed 's/\./\\./g')$" >> {workspace}/p_recursive.txt || true
      done < {workspace}/recursive_parents.txt
    fi
    sort -u -o {workspace}/p_recursive.txt {workspace}/p_recursive.txt
    printf 'recursive sub-subs found: %s\n' "$(wc -l < {workspace}/p_recursive.txt)"
  outputs:
    file: '{workspace}/p_recursive.txt'
- id: asn_discover
  name: '[ASN] metabigor — discover IP/CIDR ranges for org (local ASN DB, no API key)'
  when: '{vars.run_asn}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 5m
  run: "(\n  echo '{target}' | metabigor net --domain 2>/dev/null || true;\n  test -n '{vars.org_name}' && echo '{vars.org_name}' | metabigor net --org 2>/dev/null || true\n) | grep -oE '[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}/[0-9]+' | sort -u > {workspace}/asn_ipv4_cidrs.txt || true; touch {workspace}/asn_ipv4_cidrs.txt; printf 'ASN IPv4 CIDRs discovered: %s\\n' \"$(wc -l < {workspace}/asn_ipv4_cidrs.txt)\" > {workspace}/asn_stats.txt"
  outputs:
    ipv4_cidrs: '{workspace}/asn_ipv4_cidrs.txt'
- id: amass_intel
  name: '[ASN] amass intel — org/WHOIS-based ASN discovery (amass v4 only; v5 uses metabigor)'
  when: '{vars.run_asn} && {vars.run_amass_intel} && {vars.org_name}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 15m
  run: |
    # amass intel subcommand was removed in v5 — use metabigor as fallback
    touch {workspace}/amass_intel.txt
    if amass intel -org "{vars.org_name}" -o {workspace}/amass_intel.txt 2>/dev/null; then
      echo "[amass_intel] amass intel completed"
    else
      # v5 fallback: use metabigor net --org for CIDR discovery
      echo "{vars.org_name}" | metabigor net --org 2>/dev/null \
        | grep -oE '[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}/[0-9]+' \
        > {workspace}/amass_intel.txt || true
    fi
    touch {workspace}/amass_intel.txt
  outputs:
    file: '{workspace}/amass_intel.txt'
- id: amass_intel_extract
  name: '[ASN] extract CIDR ranges from amass intel output'
  depends_on:
  - amass_intel
  shell: true
  optional: true
  run: |
    grep -oE '[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}/[0-9]+' \
      {workspace}/amass_intel.txt 2>/dev/null | sort -u > {workspace}/amass_intel_cidrs.txt || true
    touch {workspace}/amass_intel_cidrs.txt
    printf 'amass intel CIDRs: %s\n' "$(wc -l < {workspace}/amass_intel_cidrs.txt)"
  outputs:
    file: '{workspace}/amass_intel_cidrs.txt'
- id: reverse_dns_asn
  name: '[ASN] hakrevdns — reverse DNS on ASN IP ranges → hidden subdomains not in CT'
  depends_on:
  - asn_discover
  when: '{vars.run_asn} && {vars.run_revdns}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 30m
  run: |
    touch {workspace}/reverse_dns_subs.txt
    test -s {workspace}/asn_ipv4_cidrs.txt || exit 0
    CIDR_COUNT=$(wc -l < {workspace}/asn_ipv4_cidrs.txt)
    if [ "$CIDR_COUNT" -gt 50 ]; then
      echo "[revdns skip] $CIDR_COUNT CIDRs too broad (CDN/cloud ASN), skipping"; exit 0
    fi
    echo "[revdns] expanding $CIDR_COUNT CIDRs → reverse DNS ..."
    # Expand CIDRs → IPs (cap at 65536), then reverse DNS lookup
    mapcidr -cl {workspace}/asn_ipv4_cidrs.txt -silent 2>/dev/null \
      | head -65536 \
      | hakrevdns -d -t 250 -r 1.1.1.1 2>/dev/null \
      | awk '{print $2}' \
      | sed 's/\.$//; s/^\*\.//' \
      | grep -E "(^|\.)$(echo {target} | sed 's/\./\\./g')$" \
      | sort -u > {workspace}/reverse_dns_subs.txt || true
    touch {workspace}/reverse_dns_subs.txt
    printf 'Reverse DNS subs found: %s\n' "$(wc -l < {workspace}/reverse_dns_subs.txt)"
  outputs:
    file: '{workspace}/reverse_dns_subs.txt'
- id: active_dns_brute
  name: active DNS bruteforce — gobuster + shuffledns + puredns + massdns (parallel)
  when: '{vars.run_active_dns}'
  optional: true
  fanout_concurrency: 4
  fanout_timeout_default: 40m
  fanout:
  - id: gobuster_dns
    shell: true
    skip_if_exists: true
    run: |
      # gobuster: fast, parallel — use namelist for speed + unique coverage vs shuffledns
      gobuster dns --domain {target} \
        -w {vars.sub_wordlist_namelist} \
        -t 300 --resolver 1.1.1.1 --timeout 3s \
        -q --no-fqdn --no-progress --no-error \
        -o {workspace}/a_gobuster_dns.txt 2>/dev/null || true
      touch {workspace}/a_gobuster_dns.txt
    outputs:
      file: '{workspace}/a_gobuster_dns.txt'
    optional: true
  - id: shuffledns
    shell: true
    skip_if_exists: true
    run: |
      # shuffledns: use 12k validated resolvers + 110k wordlist + strict-wildcard detection
      RFILE=$(test -s {vars.resolvers_file} && echo {vars.resolvers_file} || printf '1.1.1.1\n8.8.8.8\n')
      shuffledns -d {target} -w {vars.sub_wordlist_full} \
        -r "$RFILE" \
        -t {vars.shuffledns_threads} \
        -mode bruteforce -sw -silent \
        -o {workspace}/a_shuffledns.txt 2>/dev/null || true
      touch {workspace}/a_shuffledns.txt
    outputs:
      file: '{workspace}/a_shuffledns.txt'
    optional: true
  - id: puredns
    shell: true
    skip_if_exists: true
    run: |
      # puredns: best wildcard filtering + mass DNS resolver support
      RFILE=$(test -s {vars.resolvers_file} && echo {vars.resolvers_file} || printf '1.1.1.1\n8.8.8.8\n')
      puredns bruteforce {vars.sub_wordlist_full} {target} \
        --resolvers "$RFILE" \
        --wildcard-tests 10 \
        --wildcard-batch 1000000 \
        -q 2>/dev/null | sort -u > {workspace}/a_puredns.txt || true
      touch {workspace}/a_puredns.txt
    outputs:
      file: '{workspace}/a_puredns.txt'
    optional: true
  - id: massdns_brute
    shell: true
    skip_if_exists: true
    timeout: 60m
    run: |
      # massdns: ultra-fast raw DNS — use dns-Jhaddix 2.17M entries for maximum coverage
      RFILE=$(test -s {vars.resolvers_file} && echo {vars.resolvers_file} \
              || printf '1.1.1.1\n1.0.0.1\n8.8.8.8\n8.8.4.4\n9.9.9.9\n208.67.222.222\n' \
                 > /tmp/resolvers_fallback.txt && echo /tmp/resolvers_fallback.txt)
      # Use Assetnote 9.5M if available, else Jhaddix 2.17M
      WLIST=$(test -s {vars.sub_wordlist_assetnote} && echo {vars.sub_wordlist_assetnote} || echo {vars.sub_wordlist_jhaddix})
      printf '[massdns] using wordlist: %s (%s entries)\n' "$WLIST" "$(wc -l < "$WLIST")"
      sed "s/$/.{target}/" "$WLIST" > {workspace}/massdns_input.txt
      massdns -r "$RFILE" -t A \
        -o S -w {workspace}/massdns_raw.txt \
        --root -s {vars.massdns_rate} \
        --flush \
        {workspace}/massdns_input.txt 2>/dev/null || true
      # Parse "name. A ip" format → extract resolved names
      awk '$2=="A"||$2=="CNAME" {sub(/\.$/, "", $1); print $1}' \
        {workspace}/massdns_raw.txt 2>/dev/null \
        | grep -E "(^|\.)$(echo {target} | sed 's/\./\\./g')$" \
        | sort -u > {workspace}/a_massdns.txt || true
      touch {workspace}/a_massdns.txt
      printf 'massdns resolved (Jhaddix 2.17M): %s\n' "$(wc -l < {workspace}/a_massdns.txt)"
    outputs:
      file: '{workspace}/a_massdns.txt'
    optional: true
- id: permutation_dns
  name: DNS permutation — dnsgen + alterx + gotator → resolve with dnsx/shuffledns
  depends_on:
  - merge_passive
  when: '{vars.run_permutation}'
  optional: true
  fanout_concurrency: 3
  fanout_timeout_default: 20m
  fanout:
  - id: dnsgen_resolve
    shell: true
    skip_if_exists: true
    timeout: 15m
    run: |
      printf '1.1.1.1\n1.0.0.1\n8.8.8.8\n8.8.4.4\n' > {workspace}/resolvers.txt 2>/dev/null || true
      if test -s {workspace}/passive_merged.txt; then
        head -300 {workspace}/passive_merged.txt | dnsgen - 2>/dev/null \
          | shuffledns -d {target} -r {workspace}/resolvers.txt -t 3000 -mode resolve -silent 2>/dev/null \
          | sort -u > {workspace}/perm_dnsgen.txt || true
      fi
      touch {workspace}/perm_dnsgen.txt
    outputs:
      file: '{workspace}/perm_dnsgen.txt'
    optional: true
  - id: alterx_resolve
    shell: true
    skip_if_exists: true
    timeout: 15m
    run: |
      if test -s {workspace}/passive_merged.txt; then
        alterx -l {workspace}/passive_merged.txt -silent -limit 50000 2>/dev/null \
          | dnsx -silent -r {vars.dns_resolvers} -t {vars.dnsx_threads} -retry {vars.dnsx_retry} 2>/dev/null \
          | sort -u > {workspace}/perm_alterx.txt || true
      fi
      touch {workspace}/perm_alterx.txt
    outputs:
      file: '{workspace}/perm_alterx.txt'
    optional: true
  - id: gotator_resolve
    shell: true
    skip_if_exists: true
    timeout: 20m
    run: |
      # gotator: smarter permutations — prefix/suffix/number increments + word mutations
      printf '1.1.1.1\n1.0.0.1\n8.8.8.8\n8.8.4.4\n' > {workspace}/resolvers.txt 2>/dev/null || true
      if test -s {workspace}/passive_merged.txt; then
        gotator -sub {workspace}/passive_merged.txt \
          -depth {vars.gotator_depth} -numbers 3 -md \
          -mindup -t 200 -silent 2>/dev/null \
          | grep -E "\.{target}$" \
          | shuffledns -d {target} -r {workspace}/resolvers.txt \
              -t 3000 -mode resolve -silent 2>/dev/null \
          | sort -u > {workspace}/perm_gotator.txt || true
      fi
      touch {workspace}/perm_gotator.txt
      printf 'gotator permutations resolved: %s\n' "$(wc -l < {workspace}/perm_gotator.txt)"
    outputs:
      file: '{workspace}/perm_gotator.txt'
    optional: true
  - id: target_word_bruteforce
    shell: true
    skip_if_exists: true
    timeout: 25m
    run: |
      # ─────────────────────────────────────────────────────────────────────────
      # TARGET-AWARE BRUTE-FORCE
      # Problem: company-specific subdomains like "idc-pentest" are NEVER in any
      # public wordlist (not Jhaddix 2.1M, not Assetnote 9.5M) AND have no TLS
      # cert → not in CT logs. They can only be found by:
      #   1. Extracting word stems from the target's own discovered subdomains
      #   2. Cross-combining with a security/ops seed list
      #   3. Brute-forcing the generated combinations
      # Example: found "idc.*" → stem "idc" × "pentest" = "idc-pentest" ✓
      # ─────────────────────────────────────────────────────────────────────────
      touch {workspace}/perm_target_words.txt

      INPUT="{workspace}/passive_merged.txt"
      if ! test -s "$INPUT"; then
        printf 'No passive subdomains yet — skipping target-word bruteforce\n'
        exit 0
      fi

      # ── Step 1: extract unique single-label prefixes from known subdomains ──
      # e.g. "idc-pentest.viettelidc.com.vn" → prefix = "idc-pentest"
      # then split by "-" and "." to get stems: "idc", "pentest"
      STEMS=$(grep -oP '^[a-z0-9][a-z0-9._-]*(?=\.{target})' "$INPUT" 2>/dev/null \
        | tr '-.' '\n\n' \
        | tr '[:upper:]' '[:lower:]' \
        | grep -E '^[a-z][a-z0-9]{1,19}$' \
        | sort -u)

      # Also extract top-level prefixes as whole tokens (e.g. "idc", "cloud", "api")
      PREFIXES=$(grep -oP '^[a-z0-9][a-z0-9-]{1,29}(?=\.{target})' "$INPUT" 2>/dev/null \
        | tr '[:upper:]' '[:lower:]' \
        | grep -E '^[a-z][a-z0-9-]{1,29}$' \
        | sort -u)

      STEM_COUNT=$(echo "$STEMS" | wc -l)
      PREFIX_COUNT=$(echo "$PREFIXES" | wc -l)
      printf 'Extracted %s word stems and %s prefix tokens from passive subdomains\n' \
        "$STEM_COUNT" "$PREFIX_COUNT"

      # ── Step 2: security / ops / infra seed list ──────────────────────────
      # Covers common enterprise subdomain patterns not in public wordlists
      printf '%s\n' \
        pentest pentest1 pentest2 pentesting pentest-internal \
        vuln vulnscan scan scanner audit audit1 \
        security sec sectest secops \
        red redteam red-team blue blueteam blue-team \
        soc csirt cert bug bugbounty bug-bounty ctf \
        lab labs lab1 lab2 sandbox \
        test test1 test2 test3 testbed testing \
        dev dev1 dev2 dev3 development \
        staging stg stage stage1 uat qa qa1 qa2 qas \
        demo demo1 demo2 poc prototype preview \
        beta alpha canary nightly \
        internal intranet extranet private corp corporate office headquarters hq \
        vpn vpn1 vpn2 ovpn ssl-vpn remote rdp ssh \
        bastion jumpbox jump gateway gw gw1 gw2 \
        fw firewall ids ips waf proxy prx \
        loadbalancer lb lb1 lb2 haproxy nginx apache \
        mgmt manage management \
        monitor monitoring mon nagios zabbix grafana \
        prometheus alertmanager kibana elastic opensearch \
        siem splunk logstash log logs logging \
        admin administrator control panel portal dashboard console ui \
        ops devops netops sysadmin helpdesk support \
        backup bak backup1 backup2 dr disaster recovery \
        archive old legacy decom deprecated \
        git gitlab github bitbucket svn cvs ci cd \
        jenkins bamboo teamcity circleci pipeline \
        deploy deployment registry nexus artifactory \
        sonar sonarqube jira confluence wiki redmine tracker issue ticket \
        smtp mail mail1 mail2 mx imap pop3 webmail \
        exchange autodiscover calendar owa relay mailer \
        db database db1 db2 mysql postgres postgresql \
        mariadb mssql oracle mongo mongodb \
        redis memcache cassandra nfs storage nas san backup-db \
        cloud vm vmware esxi vsphere vcenter proxmox kvm hyperv \
        docker k8s kubernetes rancher openshift helm \
        cluster node1 node2 node3 master worker \
        api api1 api2 apiv1 apiv2 api-v1 api-v2 apigateway \
        rest graphql grpc micro microservice service svc srv \
        idc datacenter dc1 dc2 core backbone edge \
        cdn static assets media upload download ftp sftp files store \
        > {workspace}/security_seeds.txt

      SEED_COUNT=$(wc -l < {workspace}/security_seeds.txt)
      printf 'Seed list: %s entries\n' "$SEED_COUNT"

      # ── Step 3: generate cross-product combinations ───────────────────────
      # Pattern A: stem-seed (e.g. "idc-pentest")
      # Pattern B: seed-stem (e.g. "pentest-idc")
      # Pattern C: use full prefix tokens too (e.g. "api-gw-pentest")
      {
        # stem × seed (stem-seed)
        echo "$STEMS" | while read STEM; do
          [ -z "$STEM" ] && continue
          while read SEED; do
            [ -z "$SEED" ] && continue
            [ "$STEM" = "$SEED" ] && continue
            printf '%s-%s\n' "$STEM" "$SEED"
            printf '%s-%s\n' "$SEED" "$STEM"
          done < {workspace}/security_seeds.txt
        done
        # prefix token × seed (prefix-seed) — catches "idc-pentest" directly
        echo "$PREFIXES" | while read PFX; do
          [ -z "$PFX" ] && continue
          while read SEED; do
            [ -z "$SEED" ] && continue
            printf '%s-%s\n' "$PFX" "$SEED"
            printf '%s-%s\n' "$SEED" "$PFX"
          done < {workspace}/security_seeds.txt
        done
        # also try raw seeds directly (in case "pentest.target.com" exists)
        cat {workspace}/security_seeds.txt
      } | sort -u > {workspace}/target_custom_wordlist.txt

      WLIST_COUNT=$(wc -l < {workspace}/target_custom_wordlist.txt)
      printf 'Generated target-specific wordlist: %s candidates\n' "$WLIST_COUNT"

      # ── Step 4: brute-force the generated wordlist ────────────────────────
      RFILE=$(test -s {vars.resolvers_file} && echo {vars.resolvers_file} || \
        printf '1.1.1.1\n1.0.0.1\n8.8.8.8\n8.8.4.4\n9.9.9.9\n208.67.222.222\n' \
        > {workspace}/resolvers_fallback.txt && echo {workspace}/resolvers_fallback.txt)

      puredns bruteforce {workspace}/target_custom_wordlist.txt {target} \
        --resolvers "$RFILE" \
        --wildcard-tests 10 \
        --wildcard-batch 1000000 \
        -q 2>/dev/null \
        | sort -u > {workspace}/perm_target_words.txt || true

      touch {workspace}/perm_target_words.txt
      printf 'Target-aware brute-force resolved: %s subdomains\n' \
        "$(wc -l < {workspace}/perm_target_words.txt)"
    outputs:
      file: '{workspace}/perm_target_words.txt'
    optional: true
- id: merge_all_subdomains
  name: merge passive + active + permutation + revdns + recursive + amass intel → final candidate list
  depends_on:
  - merge_passive
  - active_dns_brute
  - permutation_dns
  - reverse_dns_asn
  - recursive_enum
  - amass_intel_extract
  run_on_failed_deps: true
  shell: true
  run: |
    (
      cat {workspace}/passive_merged.txt      2>/dev/null || true
      cat {workspace}/p_recursive.txt         2>/dev/null || true
      cat {workspace}/amass_intel.txt         2>/dev/null || true
      cat \
        {workspace}/a_gobuster_dns.txt \
        {workspace}/a_shuffledns.txt \
        {workspace}/a_puredns.txt \
        {workspace}/a_massdns.txt \
        {workspace}/perm_dnsgen.txt \
        {workspace}/perm_alterx.txt \
        {workspace}/perm_gotator.txt \
        {workspace}/perm_target_words.txt \
        {workspace}/reverse_dns_subs.txt \
        2>/dev/null || true
    ) | sed 's|https\?://||; s|/.*||; s|^\*\.||; s|\.$||; s|[[:space:]].*||' \
      | tr '[:upper:]' '[:lower:]' \
      | grep -E '^[a-z0-9][a-z0-9._-]*\.[a-z]{2,}$' \
      | awk -v t="{target}" 'length($0)>=length(t) && substr($0,length($0)-length(t)+1)==t' \
      | sort -u > {workspace}/subdomains_all.txt
  outputs:
    subdomains_all: '{workspace}/subdomains_all.txt'
  requires:
  - path: '{workspace}/subdomains_all.txt'
    min_bytes: 1
- id: puredns_resolve
  name: DNS resolve pass-1 — puredns mass-resolve + wildcard filter (massdns engine)
  depends_on:
  - merge_all_subdomains
  shell: true
  optional: true
  skip_if_exists: true
  retries: 1
  timeout: 30m
  shell: true
  run: |
    RFILE=$(test -s {vars.resolvers_file} && echo {vars.resolvers_file} || \
      printf '1.1.1.1\n1.0.0.1\n8.8.8.8\n8.8.4.4\n9.9.9.9\n208.67.222.222\n' > {workspace}/resolvers_fallback.txt && echo {workspace}/resolvers_fallback.txt)
    puredns resolve {steps.merge_all_subdomains.subdomains_all} \
      --resolvers "$RFILE" \
      --wildcard-tests 10 \
      --wildcard-batch 1000000 \
      -q 2>/dev/null | sort -u > {workspace}/puredns_live.txt || true
    touch {workspace}/puredns_live.txt
  outputs:
    puredns_live: '{workspace}/puredns_live.txt'
  _phase: resolve
- id: dnsx_resolve
  name: DNS resolve pass-2 — dnsx enrich live hosts with A/AAAA/CNAME records
  depends_on:
  - puredns_resolve
  - merge_all_subdomains
  shell: true
  skip_if_exists: true
  retries: 1
  run: |
    INPUT=$(test -s {workspace}/puredns_live.txt && echo {workspace}/puredns_live.txt || echo {steps.merge_all_subdomains.subdomains_all})
    # -resp outputs "host [IP1, IP2]" format — used by ip_group_analyze later
    dnsx -l "$INPUT" -silent -r {vars.dns_resolvers} -t {vars.dnsx_threads} -retry {vars.dnsx_retry} \
      -a -aaaa -cname -resp -o {workspace}/subdomains_resolved_resp.txt 2>/dev/null
    # Extract plain hostnames for all downstream steps
    awk '{print $1}' {workspace}/subdomains_resolved_resp.txt | sort -u > {workspace}/subdomains_resolved.txt
    touch {workspace}/subdomains_resolved.txt {workspace}/subdomains_resolved_resp.txt
  outputs:
    resolved: '{workspace}/subdomains_resolved.txt'
    resolved_resp: '{workspace}/subdomains_resolved_resp.txt'
  requires:
  - path: '{workspace}/subdomains_resolved.txt'
    min_bytes: 1
- id: ip_group_analyze
  name: '[IP] group resolved hosts by IP — shared-hosting detection + origin IP list'
  depends_on:
  - dnsx_resolve
  shell: true
  optional: true
  run: |
    mkdir -p {workspace}/ip_groups
    touch {workspace}/ip_groups/unique_ips.txt {workspace}/ip_groups/shared_hosting.txt
    test -s {workspace}/subdomains_resolved_resp.txt || exit 0
    python {vars.scripts_dir}/scripts/group_by_ip.py \
      --input {workspace}/subdomains_resolved_resp.txt \
      --output-dir {workspace}/ip_groups 2>/dev/null || true
    touch {workspace}/ip_groups/unique_ips.txt {workspace}/ip_groups/shared_hosting.txt
    printf 'Unique IPs: %s | Shared-hosting IPs: %s\n' \
      "$(wc -l < {workspace}/ip_groups/unique_ips.txt)" \
      "$(wc -l < {workspace}/ip_groups/shared_hosting.txt)"
  outputs:
    dir: '{workspace}/ip_groups'
    unique_ips: '{workspace}/ip_groups/unique_ips.txt'
    shared_hosting: '{workspace}/ip_groups/shared_hosting.txt'
- id: ptr_scan_dns
  name: '[PTR] reverse DNS on resolved IPs — find hosts hidden from CT/passive sources'
  depends_on:
  - dnsx_resolve
  when: '{vars.run_ptr_scan}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 20m
  run: |
    touch {workspace}/ptr_subs.txt {workspace}/ptr_resolved.txt
    test -s {workspace}/subdomains_resolved.txt || exit 0
    # Extract IP addresses from resolved subdomains
    dnsx -l {workspace}/subdomains_resolved.txt \
      -a -resp-only -silent \
      -r {vars.dns_resolvers} -t {vars.dnsx_threads} 2>/dev/null \
      | sort -u > {workspace}/all_dns_ips.txt || true
    test -s {workspace}/all_dns_ips.txt || exit 0
    printf '[ptr] %s IPs → PTR lookup ...\n' "$(wc -l < {workspace}/all_dns_ips.txt)"
    # PTR lookup — extract in-scope hostnames
    dnsx -l {workspace}/all_dns_ips.txt \
      -ptr -resp-only -silent \
      -r {vars.dns_resolvers} -t 200 -retry 2 2>/dev/null \
      | tr '[:upper:]' '[:lower:]' \
      | sed 's/\.$//; s/^\*\.//' \
      | grep -E "(^|\.)$(echo {target} | sed 's/\./\\./g')$" \
      | sort -u > {workspace}/ptr_subs_raw.txt || true
    # Find NEW subdomains not already in resolved list
    comm -23 \
      <(sort {workspace}/ptr_subs_raw.txt 2>/dev/null) \
      <(sort {workspace}/subdomains_resolved.txt 2>/dev/null) \
      > {workspace}/ptr_subs.txt 2>/dev/null || touch {workspace}/ptr_subs.txt
    # Resolve PTR-discovered new subdomains to confirm they're live
    if test -s {workspace}/ptr_subs.txt; then
      dnsx -l {workspace}/ptr_subs.txt \
        -silent -a -aaaa -cname \
        -r {vars.dns_resolvers} -t {vars.dnsx_threads} -retry {vars.dnsx_retry} 2>/dev/null \
        | sort -u > {workspace}/ptr_resolved.txt || true
    fi
    touch {workspace}/ptr_subs.txt {workspace}/ptr_resolved.txt
    printf '[ptr] new subs via PTR: %s | confirmed live: %s\n' \
      "$(wc -l < {workspace}/ptr_subs.txt)" "$(wc -l < {workspace}/ptr_resolved.txt)"
  outputs:
    ptr_subs: '{workspace}/ptr_subs.txt'
    ptr_resolved: '{workspace}/ptr_resolved.txt'
- id: dns_record_enum
  name: DNS record enrichment — SRV/MX/NS/TXT on resolved hosts → find additional infra hosts
  depends_on:
  - dnsx_resolve
  when: '{vars.run_dns_records}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 20m
  run: |
    touch {workspace}/dns_records_subs.txt
    test -s {workspace}/subdomains_resolved.txt || exit 0
    printf '[dns_records] querying SRV/MX/NS/TXT on %s hosts ...\n' "$(wc -l < {workspace}/subdomains_resolved.txt)"
    # Query all useful DNS record types
    dnsx -l {workspace}/subdomains_resolved.txt \
      -mx -ns -srv -txt \
      -resp -silent \
      -r {vars.dns_resolvers} -t {vars.dnsx_threads} \
      2>/dev/null > {workspace}/dns_records_raw.txt || true
    # Extract hostnames from responses (e.g., mail servers, SRV targets, NS servers)
    grep -oP '[a-zA-Z0-9._-]+\.$(echo {target} | sed "s/\./\\\\./g")' \
      {workspace}/dns_records_raw.txt 2>/dev/null \
      | sort -u > {workspace}/dns_records_subs_raw.txt || true
    # Find NEW ones not already in resolved list
    comm -23 \
      <(sort {workspace}/dns_records_subs_raw.txt 2>/dev/null) \
      <(sort {workspace}/subdomains_resolved.txt 2>/dev/null) \
      > {workspace}/dns_records_new.txt 2>/dev/null || touch {workspace}/dns_records_new.txt
    # Resolve new hosts
    if test -s {workspace}/dns_records_new.txt; then
      dnsx -l {workspace}/dns_records_new.txt \
        -a -aaaa -cname -silent \
        -r {vars.dns_resolvers} -t {vars.dnsx_threads} -retry {vars.dnsx_retry} \
        2>/dev/null | sort -u > {workspace}/dns_records_subs.txt || true
    fi
    touch {workspace}/dns_records_subs.txt
    printf '[dns_records] new hosts from SRV/MX/NS/TXT: %s\n' "$(wc -l < {workspace}/dns_records_subs.txt)"
  outputs:
    file: '{workspace}/dns_records_subs.txt'
- id: resolve_stats
  name: resolution stats — count passive vs active vs puredns vs dnsx resolved
  depends_on:
  - merge_all_subdomains
  - puredns_resolve
  - dnsx_resolve
  - ptr_scan_dns
  - dns_record_enum
  run_on_failed_deps: true
  shell: true
  run: |
    printf 'Passive unique: %s\nAll candidates: %s\npuredns live (wildcard-filtered): %s\ndnsx resolved (A/AAAA/CNAME): %s\nPTR new subs: %s\n' \
      "$(wc -l < {workspace}/passive_merged.txt    2>/dev/null || echo 0)" \
      "$(wc -l < {workspace}/subdomains_all.txt    2>/dev/null || echo 0)" \
      "$(wc -l < {workspace}/puredns_live.txt      2>/dev/null || echo 0)" \
      "$(wc -l < {workspace}/subdomains_resolved.txt 2>/dev/null || echo 0)" \
      "$(wc -l < {workspace}/ptr_subs.txt          2>/dev/null || echo 0)" \
      > {workspace}/resolve_stats.txt
    cat {workspace}/resolve_stats.txt
  outputs:
    stats: '{workspace}/resolve_stats.txt'
- id: tlsx_san_mine
  name: '[TLS] tlsx — scan live hosts for certificates, extract SAN entries'
  depends_on:
  - dnsx_resolve
  when: '{vars.run_tlsx}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 20m
  run: |
    test -s {workspace}/subdomains_resolved.txt && tlsx -l {workspace}/subdomains_resolved.txt \
      -san -cn -silent \
      -p 443,8443,4443 \
      -timeout 5 \
      -o {workspace}/tlsx_raw.txt 2>/dev/null || true
    touch {workspace}/tlsx_raw.txt
  outputs:
    file: '{workspace}/tlsx_raw.txt'
- id: tlsx_san_extract
  name: '[TLS] extract new in-scope subdomains from TLS SAN entries'
  depends_on:
  - tlsx_san_mine
  when: '{vars.run_tlsx}'
  shell: true
  optional: true
  run: |
    sed 's/\x1b\[[0-9;]*m//g' {workspace}/tlsx_raw.txt 2>/dev/null \
      | grep -oP '(?<=\[)[^\]]+(?=\])' \
      | sed 's/^\*\.//' \
      | tr '[:upper:]' '[:lower:]' \
      | grep -E '^[a-z0-9][a-z0-9._-]*\.[a-z]{2,}$' \
      | awk -v t="{target}" 'length($0)>=length(t) && substr($0,length($0)-length(t)+1)==t' \
      | sort -u > {workspace}/tlsx_all_subs.txt || true
    comm -23 \
      <(sort {workspace}/tlsx_all_subs.txt 2>/dev/null || true) \
      <(sort {workspace}/subdomains_resolved.txt 2>/dev/null || true) \
      > {workspace}/tlsx_new_subs.txt 2>/dev/null || touch {workspace}/tlsx_new_subs.txt
    touch {workspace}/tlsx_new_subs.txt
    printf 'TLS SAN new subs discovered: %s\n' "$(wc -l < {workspace}/tlsx_new_subs.txt)" >> {workspace}/resolve_stats.txt || true
  outputs:
    file: '{workspace}/tlsx_new_subs.txt'
- id: dnsx_san_resolve
  name: '[TLS] DNS resolve TLS-discovered subdomains → enrich host list'
  depends_on:
  - tlsx_san_extract
  when: '{vars.run_tlsx}'
  shell: true
  optional: true
  run: |
    test -s {workspace}/tlsx_new_subs.txt && dnsx -l {workspace}/tlsx_new_subs.txt \
      -silent -r {vars.dns_resolvers} \
      -t {vars.dnsx_threads} -retry {vars.dnsx_retry} \
      -a -aaaa -cname \
      -o {workspace}/subdomains_tlsx_resolved.txt 2>/dev/null || true
    touch {workspace}/subdomains_tlsx_resolved.txt
    printf 'TLS SAN resolved (live): %s\n' "$(wc -l < {workspace}/subdomains_tlsx_resolved.txt)" >> {workspace}/resolve_stats.txt || true
  outputs:
    tlsx_resolved: '{workspace}/subdomains_tlsx_resolved.txt'
- id: merge_all_resolved
  name: merge DNS resolved + TLS SAN + PTR + DNS records → comprehensive host list
  depends_on:
  - dnsx_resolve
  - dnsx_san_resolve
  - ptr_scan_dns
  - dns_record_enum
  run_on_failed_deps: true
  shell: true
  run: |
    (
      cat {workspace}/subdomains_resolved.txt      2>/dev/null || true
      cat {workspace}/subdomains_tlsx_resolved.txt 2>/dev/null || true
      cat {workspace}/ptr_resolved.txt             2>/dev/null || true
      cat {workspace}/dns_records_subs.txt         2>/dev/null || true
    ) | sort -u > {workspace}/subdomains_all_resolved.txt
    printf 'Total resolved (DNS+TLS+PTR+Records): %s\n' \
      "$(wc -l < {workspace}/subdomains_all_resolved.txt)" >> {workspace}/resolve_stats.txt || true
  outputs:
    all_resolved: '{workspace}/subdomains_all_resolved.txt'
  requires:
  - path: '{workspace}/subdomains_all_resolved.txt'
    min_bytes: 1
- id: naabu_topscan
  name: port scan top-1000 — naabu (fast sweep all live hosts incl. TLS-discovered)
  depends_on:
  - merge_all_resolved
  when: '{vars.run_portscan}'
  optional: true
  skip_if_exists: true
  timeout: 90m
  run: naabu -list {steps.merge_all_resolved.all_resolved} -rate {vars.naabu_rate} -top-ports {vars.naabu_top_ports} -json -o {workspace}/naabu.jsonl -silent -r {vars.dns_resolvers}
  outputs:
    naabu_jsonl: '{workspace}/naabu.jsonl'
- id: naabu_asn_scan
  name: port scan ASN IP ranges — naabu on organization CIDR ranges
  depends_on:
  - asn_discover
  when: '{vars.run_asn} && {vars.run_asn_portscan}'
  optional: true
  skip_if_exists: true
  timeout: 3h
  shell: true
  run: |
    touch {workspace}/naabu_asn.jsonl
    test -s {workspace}/asn_ipv4_cidrs.txt || exit 0

    # Guard 1: if target's main IP is CDN/WAF, ASN ranges are CDN infra — skip
    TARGET_IP=$(dig +short {target} 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -1)
    if [ -n "$TARGET_IP" ]; then
      IS_CDN=$(echo "$TARGET_IP" | cdncheck -silent 2>/dev/null | head -1)
      if [ -n "$IS_CDN" ]; then
        echo "[asn_scan skip] $TARGET_IP is CDN/WAF ($IS_CDN) — ASN ranges belong to CDN infra, not target org"
        exit 0
      fi
    fi

    # Guard 2: > 50 CIDRs almost always means a major CDN/cloud provider, not the target org
    CIDR_COUNT=$(wc -l < {workspace}/asn_ipv4_cidrs.txt)
    if [ "$CIDR_COUNT" -gt 50 ]; then
      echo "[asn_scan skip] $CIDR_COUNT CIDRs discovered — too broad to be target-specific (CDN/cloud ASN), skipping"
      exit 0
    fi

    echo "[asn_scan] $CIDR_COUNT CIDRs look target-specific — proceeding with naabu scan"
    naabu -list {workspace}/asn_ipv4_cidrs.txt -rate {vars.naabu_rate} -top-ports 100 -json -o {workspace}/naabu_asn.jsonl -silent 2>/dev/null || true
  outputs:
    file: '{workspace}/naabu_asn.jsonl'
- id: deep_portscan
  name: deep port scan — rustscan full range + nmap service detection
  depends_on:
  - merge_all_resolved
  when: '{vars.run_deep_portscan}'
  optional: true
  fanout_concurrency: 2
  fanout_timeout_default: 4h
  fanout:
  - id: rustscan_full
    shell: true
    run: rustscan -a {target} --range 1-65535 --scan-order random --batch-size {vars.rustscan_batch} --timeout {vars.rustscan_timeout_ms} --tries 2 --ulimit 5000 -- -Pn -sV -sC --open -oN {workspace}/rustscan_full.txt 2>/dev/null; touch {workspace}/rustscan_full.txt
    outputs:
      file: '{workspace}/rustscan_full.txt'
    optional: true
  - id: nmap_service
    shell: true
    run: test -s {workspace}/subdomains_all_resolved.txt && nmap {vars.nmap_flags} -iL {workspace}/subdomains_all_resolved.txt -oN {workspace}/nmap_service.txt 2>/dev/null; touch {workspace}/nmap_service.txt
    outputs:
      file: '{workspace}/nmap_service.txt'
    optional: true
- id: extract_web_targets
  name: extract web targets — resolved hosts + naabu web ports (80/443/8x)
  depends_on:
  - merge_all_resolved
  - naabu_topscan
  run_on_failed_deps: true
  shell: true
  run: |
    (
      cat {workspace}/subdomains_all_resolved.txt 2>/dev/null || true
      if test -f {workspace}/naabu.jsonl; then
        jq -r 'select(.port and (.port==80 or .port==443 or .port==8080 or .port==8443 or .port==8888 or .port==9090 or .port==9443 or .port==3000 or .port==5000 or .port==4443)) | "\(.host // .ip)"' \
          {workspace}/naabu.jsonl 2>/dev/null || true
        jq -r '"\(.host // .ip):\(.port)"' {workspace}/naabu.jsonl 2>/dev/null \
          | grep -E ':(80|443|8080|8443|8888|9090|9443|3000|5000|4443)$' || true
      fi
    ) | sort -u > {workspace}/web_targets.txt
  outputs:
    web_targets: '{workspace}/web_targets.txt'
- id: httpx
  name: HTTP probe — title / tech-detect / status / redirect chain
  depends_on:
  - extract_web_targets
  skip_if_exists: true
  run: httpx -l {steps.extract_web_targets.web_targets} -silent -json -o {workspace}/httpx.jsonl -td -title -status-code -content-length -follow-redirects -timeout {vars.httpx_timeout} -threads {vars.httpx_threads} -random-agent
  outputs:
    httpx_jsonl: '{workspace}/httpx.jsonl'
    alive_file: '{workspace}/httpx.jsonl'
  requires:
  - path: '{workspace}/httpx.jsonl'
    min_bytes: 1
- id: extract_live_urls
  name: extract live URLs from httpx → for crawl + vuln scan input
  depends_on:
  - httpx
  shell: true
  run: jq -r '.url // empty' {workspace}/httpx.jsonl 2>/dev/null | sort -u > {workspace}/live_urls.txt; touch {workspace}/live_urls.txt
  outputs:
    live_urls: '{workspace}/live_urls.txt'
- id: favicon_hash
  name: '[favicon] compute mmh3 favicon hash per live host (Shodan/FOFA http.favicon.hash compatible)'
  depends_on:
  - extract_live_urls
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 10m
  run: |
    touch {workspace}/favicon_hashes.txt
    test -s {workspace}/live_urls.txt || exit 0
    python {vars.scripts_dir}/scripts/favicon_hash.py \
      --input {workspace}/live_urls.txt \
      --output {workspace}/favicon_hashes.txt \
      --timeout 10 --threads 15 2>/dev/null || true
    touch {workspace}/favicon_hashes.txt
    printf 'Favicon hashes computed: %s\n' "$(wc -l < {workspace}/favicon_hashes.txt)"
  outputs:
    file: '{workspace}/favicon_hashes.txt'
- id: favicon_pivot_search
  name: '[favicon] uncover — search Shodan/FOFA for hosts sharing target favicon hash'
  depends_on:
  - favicon_hash
  when: '{vars.run_favicon_pivot}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 10m
  run: |
    touch {workspace}/favicon_related_raw.txt {workspace}/favicon_hash_used.txt
    test -s {workspace}/favicon_hashes.txt || exit 0
    HASH=$(cut -d, -f2 {workspace}/favicon_hashes.txt | sort | uniq -c | sort -rn | head -1 | awk '{print $2}')
    test -n "$HASH" || exit 0
    echo "$HASH" > {workspace}/favicon_hash_used.txt
    (
      uncover -q "http.favicon.hash:$HASH" -e shodan -silent 2>/dev/null || true
      uncover -q "icon_hash=\"$HASH\"" -e fofa -silent 2>/dev/null || true
    ) | sort -u > {workspace}/favicon_related_raw.txt
    printf 'Favicon pivot raw results: %s (hash: %s)\n' "$(wc -l < {workspace}/favicon_related_raw.txt)" "$HASH"
  outputs:
    raw: '{workspace}/favicon_related_raw.txt'
    hash_used: '{workspace}/favicon_hash_used.txt'
- id: favicon_pivot_filter
  name: '[favicon] split results — in-scope (new subs) vs off-domain (different org assets)'
  depends_on:
  - favicon_pivot_search
  when: '{vars.run_favicon_pivot}'
  run_on_failed_deps: true
  shell: true
  optional: true
  run: |
    touch {workspace}/favicon_in_scope.txt {workspace}/favicon_related_offdomain.txt
    test -s {workspace}/favicon_related_raw.txt || exit 0
    sed 's|https\?://||; s|/.*||; s|:.*||' {workspace}/favicon_related_raw.txt \
      | tr '[:upper:]' '[:lower:]' | sort -u > {workspace}/favicon_hosts.txt
    grep -E '^[a-z0-9][a-z0-9._-]*\.[a-z]{2,}$' {workspace}/favicon_hosts.txt \
      | awk -v t="{target}" 'length($0)>=length(t) && substr($0,length($0)-length(t)+1)==t' \
      | sort -u > {workspace}/favicon_in_scope.txt || true
    comm -23 <(sort {workspace}/favicon_hosts.txt) <(sort {workspace}/favicon_in_scope.txt) \
      > {workspace}/favicon_related_offdomain.txt 2>/dev/null || true
    touch {workspace}/favicon_in_scope.txt {workspace}/favicon_related_offdomain.txt
    printf 'Favicon pivot: %s in-scope | %s off-domain (review manually)\n' \
      "$(wc -l < {workspace}/favicon_in_scope.txt)" \
      "$(wc -l < {workspace}/favicon_related_offdomain.txt)"
  outputs:
    in_scope: '{workspace}/favicon_in_scope.txt'
    offdomain: '{workspace}/favicon_related_offdomain.txt'
- id: vhost_ip_fuzz
  name: '[vhost] ffuf Host-header fuzz non-CDN IPs — discovers virtualhost subs without DNS records'
  depends_on:
  - origin_ips_extract
  when: '{vars.run_vhost_ip_fuzz}'
  shell: true
  optional: true
  timeout: 2h
  run: |
    mkdir -p {workspace}/vhost_fuzz
    touch {workspace}/vhost_fuzz_ips.txt {workspace}/vhost_ffuf_hits.txt
    test -s {workspace}/origin_ips.txt || exit 0
    head -n {vars.vhost_ip_fuzz_max_ips} {workspace}/origin_ips.txt > {workspace}/vhost_fuzz_ips.txt
    cat {workspace}/vhost_fuzz_ips.txt | xargs -P 4 -I{} ffuf \
      -u "http://{}" -H "Host: FUZZ.{target}" -w {vars.vhost_wordlist}:FUZZ \
      -ac -mc 200,301,302,401,403 -t 40 \
      -of json -o {workspace}/vhost_fuzz/{}.json -s 2>/dev/null || true
    jq -r '.results[]?.input.FUZZ' {workspace}/vhost_fuzz/*.json 2>/dev/null \
      | sed 's/$/.{target}/' | sort -u > {workspace}/vhost_ffuf_hits.txt || true
    touch {workspace}/vhost_ffuf_hits.txt
    printf 'VHost ffuf: %s new subs from %s IPs\n' \
      "$(wc -l < {workspace}/vhost_ffuf_hits.txt)" "$(wc -l < {workspace}/vhost_fuzz_ips.txt)"
  outputs:
    dir: '{workspace}/vhost_fuzz'
    hits: '{workspace}/vhost_ffuf_hits.txt'
- id: vhost_ssl_san
  name: '[vhost] SSL cert SAN extraction per non-CDN IP — cheap vhost hint (no fuzzing needed)'
  depends_on:
  - origin_ips_extract
  when: '{vars.run_vhost_ip_fuzz}'
  shell: true
  optional: true
  timeout: 20m
  run: |
    touch {workspace}/vhost_ssl_san_hits.txt
    test -s {workspace}/origin_ips.txt || exit 0
    head -n {vars.vhost_ip_fuzz_max_ips} {workspace}/origin_ips.txt | while IFS= read -r ip; do
      echo | timeout 5 openssl s_client -connect "$ip:443" -servername {target} 2>/dev/null \
        | openssl x509 -noout -text 2>/dev/null \
        | grep -Eo 'DNS:[^,[:space:]]+' | cut -d: -f2
    done | sed 's/^\*\.//' | tr '[:upper:]' '[:lower:]' | sort -u > {workspace}/vhost_ssl_san_hits.txt || true
    touch {workspace}/vhost_ssl_san_hits.txt
    printf 'SSL SAN extraction: %s candidate hosts\n' "$(wc -l < {workspace}/vhost_ssl_san_hits.txt)"
  outputs:
    file: '{workspace}/vhost_ssl_san_hits.txt'
- id: vhost_findings_merge
  name: '[vhost] merge ffuf + SSL-SAN → new hosts not yet in resolved list'
  depends_on:
  - vhost_ip_fuzz
  - vhost_ssl_san
  when: '{vars.run_vhost_ip_fuzz}'
  run_on_failed_deps: true
  shell: true
  run: |
    touch {workspace}/vhost_new_hosts.txt
    (cat {workspace}/vhost_ffuf_hits.txt 2>/dev/null; cat {workspace}/vhost_ssl_san_hits.txt 2>/dev/null) \
      | grep -E '^[a-z0-9][a-z0-9._-]*\.[a-z]{2,}$' \
      | awk -v t="{target}" 'length($0)>=length(t) && substr($0,length($0)-length(t)+1)==t' \
      | sort -u > {workspace}/vhost_all_hits.txt || true
    comm -23 <(sort {workspace}/vhost_all_hits.txt 2>/dev/null) \
      <(sort {workspace}/subdomains_all_resolved.txt 2>/dev/null) \
      > {workspace}/vhost_new_hosts.txt 2>/dev/null || true
    touch {workspace}/vhost_all_hits.txt {workspace}/vhost_new_hosts.txt
    printf 'VHost new hosts (not in prior resolved): %s\n' "$(wc -l < {workspace}/vhost_new_hosts.txt)"
  outputs:
    new_hosts: '{workspace}/vhost_new_hosts.txt'
- id: ip_pivot_reverse
  name: '[IP-pivot] mapcidr expand + dnsx PTR reverse sweep neighboring /24 blocks'
  depends_on:
  - origin_ips_extract
  - amass_intel_extract
  - asn_discover
  when: '{vars.run_ip_pivot}'
  run_on_failed_deps: true
  shell: true
  optional: true
  timeout: 1h
  run: |
    touch {workspace}/ip_pivot_ranges.txt {workspace}/ip_pivot_ptr_raw.txt
    (
      test -s {workspace}/origin_ips.txt && \
        awk -v p="{vars.ip_pivot_prefix}" '{print $1"/"p}' {workspace}/origin_ips.txt || true
      cat {workspace}/amass_intel_cidrs.txt 2>/dev/null || true
      cat {workspace}/asn_ipv4_cidrs.txt    2>/dev/null || true
    ) | sort -u | head -n {vars.ip_pivot_max_ranges} > {workspace}/ip_pivot_ranges.txt
    test -s {workspace}/ip_pivot_ranges.txt || exit 0
    while IFS= read -r cidr; do
      IP1=$(echo "$cidr" | cut -d/ -f1)
      IS_CDN=$(echo "$IP1" | cdncheck -silent 2>/dev/null | head -1)
      if [ -n "$IS_CDN" ]; then
        echo "[ip_pivot skip] $cidr is CDN/WAF ($IS_CDN) — skipping"
        continue
      fi
      echo "$cidr" | mapcidr -silent 2>/dev/null \
        | dnsx -ptr -resp-only -silent -r {vars.dns_resolvers} 2>/dev/null
    done < {workspace}/ip_pivot_ranges.txt > {workspace}/ip_pivot_ptr_raw.txt
    printf 'IP pivot PTR raw: %s entries from %s ranges\n' \
      "$(wc -l < {workspace}/ip_pivot_ptr_raw.txt)" "$(wc -l < {workspace}/ip_pivot_ranges.txt)"
  outputs:
    ranges: '{workspace}/ip_pivot_ranges.txt'
    ptr_raw: '{workspace}/ip_pivot_ptr_raw.txt'
- id: ip_pivot_filter
  name: '[IP-pivot] split PTR results — in-scope new hosts vs neighbor domains (manual review)'
  depends_on:
  - ip_pivot_reverse
  when: '{vars.run_ip_pivot}'
  run_on_failed_deps: true
  shell: true
  optional: true
  run: |
    touch {workspace}/ip_pivot_in_scope.txt {workspace}/ip_pivot_neighbors.txt
    test -s {workspace}/ip_pivot_ptr_raw.txt || exit 0
    sed 's/\.$//' {workspace}/ip_pivot_ptr_raw.txt | tr '[:upper:]' '[:lower:]' | sort -u \
      > {workspace}/ip_pivot_hosts.txt
    grep -E '^[a-z0-9][a-z0-9._-]*\.[a-z]{2,}$' {workspace}/ip_pivot_hosts.txt \
      | awk -v t="{target}" 'length($0)>=length(t) && substr($0,length($0)-length(t)+1)==t' \
      | sort -u > {workspace}/ip_pivot_in_scope.txt || true
    comm -23 <(sort {workspace}/ip_pivot_hosts.txt) <(sort {workspace}/ip_pivot_in_scope.txt) \
      > {workspace}/ip_pivot_neighbors.txt 2>/dev/null || true
    touch {workspace}/ip_pivot_in_scope.txt {workspace}/ip_pivot_neighbors.txt
    printf 'IP pivot: %s in-scope | %s neighbor domains\n' \
      "$(wc -l < {workspace}/ip_pivot_in_scope.txt)" \
      "$(wc -l < {workspace}/ip_pivot_neighbors.txt)"
  outputs:
    in_scope: '{workspace}/ip_pivot_in_scope.txt'
    neighbors: '{workspace}/ip_pivot_neighbors.txt'
- id: pivot_new_hosts_merge
  name: merge all pivot-discovered hosts (favicon + vhost + ip_pivot) → resolve new ones
  depends_on:
  - favicon_pivot_filter
  - vhost_findings_merge
  - ip_pivot_filter
  run_on_failed_deps: true
  shell: true
  run: |
    (
      cat {workspace}/favicon_in_scope.txt 2>/dev/null || true
      cat {workspace}/vhost_new_hosts.txt  2>/dev/null || true
      cat {workspace}/ip_pivot_in_scope.txt 2>/dev/null || true
    ) | grep -E '^[a-z0-9][a-z0-9._-]*\.[a-z]{2,}$' \
      | awk -v t="{target}" 'length($0)>=length(t) && substr($0,length($0)-length(t)+1)==t' \
      | sort -u > {workspace}/pivot_new_candidates.txt
    touch {workspace}/pivot_new_candidates.txt
    printf 'Pivot new candidates: %s\n' "$(wc -l < {workspace}/pivot_new_candidates.txt)"
  outputs:
    file: '{workspace}/pivot_new_candidates.txt'
- id: pivot_dnsx_resolve
  name: resolve pivot-discovered new hosts (bonus coverage on top of main resolved set)
  depends_on:
  - pivot_new_hosts_merge
  shell: true
  optional: true
  run: |
    touch {workspace}/pivot_new_resolved.txt
    test -s {workspace}/pivot_new_candidates.txt || exit 0
    dnsx -l {workspace}/pivot_new_candidates.txt -silent \
      -r {vars.dns_resolvers} -t {vars.dnsx_threads} -retry {vars.dnsx_retry} \
      -a -aaaa -cname -o {workspace}/pivot_new_resolved.txt 2>/dev/null || true
    touch {workspace}/pivot_new_resolved.txt
    NEW_COUNT=$(wc -l < {workspace}/pivot_new_resolved.txt)
    printf 'Pivot resolved: %s new hosts beyond main enumeration\n' "$NEW_COUNT"
    if [ "$NEW_COUNT" -gt 0 ]; then
      printf '→ Recommend: probe with httpx -l pivot_new_resolved.txt\n'
    fi
  outputs:
    file: '{workspace}/pivot_new_resolved.txt'
- id: http_redirect_subs
  name: mine HTTP redirect Location headers for new in-scope subdomains
  depends_on:
  - httpx
  - extract_live_urls
  shell: true
  optional: true
  run: |
    touch {workspace}/http_redirect_subs.txt {workspace}/http_redirect_resolved.txt
    test -s {workspace}/httpx.jsonl || exit 0
    # Extract subdomains from Location redirect headers
    jq -r '.location // empty' {workspace}/httpx.jsonl 2>/dev/null \
      | grep -oP '[a-zA-Z0-9._-]+\.{target}' \
      | sort -u > {workspace}/http_redirect_raw.txt || true
    # Also extract from final_url (after redirect chain)
    jq -r '.final_url // empty' {workspace}/httpx.jsonl 2>/dev/null \
      | grep -oP '[a-zA-Z0-9._-]+\.{target}' >> {workspace}/http_redirect_raw.txt || true
    # Also extract from response body hostnames (knowledgebase/csp headers)
    jq -r '(.csp // empty), (.response_headers."content-security-policy" // empty)' \
      {workspace}/httpx.jsonl 2>/dev/null \
      | grep -oP '[a-zA-Z0-9._-]+\.{target}' >> {workspace}/http_redirect_raw.txt || true
    sort -u {workspace}/http_redirect_raw.txt 2>/dev/null \
      | comm -23 - <(sort {workspace}/subdomains_all_resolved.txt 2>/dev/null) \
      > {workspace}/http_redirect_new.txt || touch {workspace}/http_redirect_new.txt
    if test -s {workspace}/http_redirect_new.txt; then
      dnsx -l {workspace}/http_redirect_new.txt \
        -a -aaaa -cname -silent \
        -r {vars.dns_resolvers} -t {vars.dnsx_threads} 2>/dev/null \
        | sort -u > {workspace}/http_redirect_resolved.txt || true
    fi
    touch {workspace}/http_redirect_subs.txt {workspace}/http_redirect_resolved.txt
    ALL=$(sort -u {workspace}/http_redirect_raw.txt 2>/dev/null | wc -l || echo 0)
    NEW=$(wc -l < {workspace}/http_redirect_resolved.txt)
    printf '[redirect_mine] %s subs from HTTP headers | %s new resolved\n' "$ALL" "$NEW"
  outputs:
    file: '{workspace}/http_redirect_resolved.txt'
- id: cdncheck_classify
  name: '[CDN] cdncheck — classify live hosts as CDN vs origin (prioritize non-CDN)'
  depends_on:
  - merge_all_resolved
  - httpx
  when: '{vars.run_cdncheck}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 10m
  run: |
    test -s {workspace}/subdomains_all_resolved.txt && cdncheck \
      -i {workspace}/subdomains_all_resolved.txt \
      -jsonl -o {workspace}/cdncheck.jsonl 2>/dev/null || true
    touch {workspace}/cdncheck.jsonl
    jq -r 'select(.cdn != true and .waf != true and .cloud != true) | .input' \
      {workspace}/cdncheck.jsonl 2>/dev/null | sort -u > {workspace}/origin_hosts.txt || true
    touch {workspace}/origin_hosts.txt
    CDN_COUNT=$(jq -r 'select(.cdn==true or .waf==true or .cloud==true) | .input' {workspace}/cdncheck.jsonl 2>/dev/null | wc -l || echo 0)
    ORIGIN_COUNT=$(wc -l < {workspace}/origin_hosts.txt 2>/dev/null || echo 0)
    printf 'CDN hosts: %s | Origin (non-CDN) hosts: %s\n' "$CDN_COUNT" "$ORIGIN_COUNT" >> {workspace}/resolve_stats.txt || true
  outputs:
    cdncheck_jsonl: '{workspace}/cdncheck.jsonl'
    origin_hosts: '{workspace}/origin_hosts.txt'
- id: origin_ips_extract
  name: '[IP] extract IPs for non-CDN (origin) hosts — safe base for vhost fuzz / ip pivot'
  depends_on:
  - cdncheck_classify
  - ip_group_analyze
  shell: true
  optional: true
  run: |
    touch {workspace}/origin_ips.txt
    test -s {workspace}/origin_hosts.txt || exit 0
    # For each non-CDN host, look up its IP from the resp file
    sed 's/^/^/; s/$/ \[/' {workspace}/origin_hosts.txt > {workspace}/.origin_host_patterns.txt
    grep -E -f {workspace}/.origin_host_patterns.txt {workspace}/subdomains_resolved_resp.txt 2>/dev/null \
      | grep -oE '[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}' | sort -u > {workspace}/origin_ips.txt || true
    touch {workspace}/origin_ips.txt
    printf 'Non-CDN origin IPs for vhost/pivot: %s\n' "$(wc -l < {workspace}/origin_ips.txt)"
  outputs:
    file: '{workspace}/origin_ips.txt'
- id: screenshot
  name: headless screenshots — gowitness (all live HTTP endpoints)
  depends_on:
  - extract_live_urls
  when: '{vars.run_screenshot}'
  shell: true
  optional: true
  run: |
    test -s {workspace}/live_urls.txt || exit 0
    mkdir -p {workspace}/screenshots
    gowitness scan file \
      -f {workspace}/live_urls.txt \
      -s {workspace}/screenshots \
      --write-db \
      --write-db-uri sqlite://{workspace}/gowitness.sqlite3 \
      --chrome-path /usr/local/bin/chromium-server \
      -T 30 --threads {vars.screenshot_threads} -q 2>{workspace}/gowitness.log || true
    cd {workspace} && gowitness report generate \
      --db-uri sqlite://{workspace}/gowitness.sqlite3 -q 2>/dev/null || true
  outputs:
    screenshot_dir: '{workspace}/screenshots'
    gallery_html: '{workspace}/gallery.html'
- id: url_collect
  name: URL collection — katana JS-aware crawl + hakrawler (parallel; gau/wayback already ran in passive phase)
  depends_on:
  - extract_live_urls
  when: '{vars.run_crawl}'
  optional: true
  fanout_concurrency: 2
  fanout_timeout_default: 30m
  fanout:
  - id: katana_crawl
    shell: true
    skip_if_exists: true
    run: |
      test -s {workspace}/live_urls.txt && katana \
        -list {workspace}/live_urls.txt \
        -d {vars.katana_depth} \
        -jc -silent \
        -c {vars.katana_concurrency} \
        -ct {vars.katana_crawl_timeout} \
        -kf all \
        -o {workspace}/katana_urls.txt 2>/dev/null || true
      touch {workspace}/katana_urls.txt
    outputs:
      file: '{workspace}/katana_urls.txt'
    optional: true
  - id: hakrawler_crawl
    shell: true
    skip_if_exists: true
    timeout: 10m
    run: |
      # hakrawler: recursive crawl — catches URLs katana misses via JS rendering failures
      echo "https://{target}" | hakrawler -d 4 -subs -insecure 2>/dev/null \
        | sort -u > {workspace}/hakrawler_urls.txt || true
      touch {workspace}/hakrawler_urls.txt
      printf 'hakrawler URLs: %s\n' "$(wc -l < {workspace}/hakrawler_urls.txt)"
    outputs:
      file: '{workspace}/hakrawler_urls.txt'
    optional: true
- id: merge_crawl_urls
  name: merge all crawled URLs → deduplicated in-scope URL list
  depends_on:
  - url_collect
  - extract_live_urls
  when: '{vars.run_crawl}'
  run_on_failed_deps: true
  shell: true
  run: "(\n  cat {workspace}/live_urls.txt 2>/dev/null || true;\n  cat {workspace}/katana_urls.txt 2>/dev/null || true;\n  cat {workspace}/hakrawler_urls.txt 2>/dev/null || true;\n  cat {workspace}/p_gau_urls.txt 2>/dev/null || true;\n  cat {workspace}/p_waybackurls_urls.txt 2>/dev/null || true;\n  cat {workspace}/p_waymore_urls.txt 2>/dev/null || true;\n  cat {workspace}/p_urlfinder_urls.txt 2>/dev/null || true\n) | grep -E '^https?://' | awk -v t=\"{target}\" 'tolower($0) ~ tolower(t)' | sort -u > {workspace}/all_urls.txt; printf 'Total unique URLs collected: %s\\n' \"$(wc -l < {workspace}/all_urls.txt)\" >> {workspace}/resolve_stats.txt || true; touch {workspace}/all_urls.txt"
  outputs:
    all_urls: '{workspace}/all_urls.txt'
- id: subjs_extract
  name: '[JS] subjs — collect JS file URLs from crawled pages'
  depends_on:
  - merge_crawl_urls
  when: '{vars.run_js_analysis}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 20m
  run: 'test -s {workspace}/all_urls.txt && subjs -i {workspace}/all_urls.txt -c 20 2>/dev/null | grep -iE ''\.js(\?|$)'' | sort -u > {workspace}/js_urls.txt || true; touch {workspace}/js_urls.txt; printf ''JS files discovered: %s\n'' "$(wc -l < {workspace}/js_urls.txt)" >> {workspace}/resolve_stats.txt || true'
  outputs:
    js_urls: '{workspace}/js_urls.txt'
- id: jsapiscan_scan
  name: '[JS] jsapiscan — extract API endpoints from collected JS files'
  depends_on:
  - subjs_extract
  when: '{vars.run_js_analysis}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 20m
  run: 'test -s {workspace}/js_urls.txt && mkdir -p {workspace}/jsapiscan_out && cd {workspace}/jsapiscan_out && jsapiscan -f {workspace}/js_urls.txt -o {workspace}/jsapiscan_results.txt -K -t 20 -d 2 2>/dev/null || true; touch {workspace}/jsapiscan_results.txt; printf ''JS API endpoints found: %s\n'' "$(wc -l < {workspace}/jsapiscan_results.txt 2>/dev/null || echo 0)" >> {workspace}/resolve_stats.txt || true'
  outputs:
    file: '{workspace}/jsapiscan_results.txt'
- id: jsubfinder_scan
  name: '[JS] jsubfinder — crawl target JS for hidden subdomains + secrets'
  depends_on:
  - extract_live_urls
  when: '{vars.run_js_analysis}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 15m
  run: |
    touch {workspace}/jsubfinder_subs.txt {workspace}/jsubfinder_secrets.txt
    jsubfinder search -u {target} -c \
      --output-file {workspace}/jsubfinder_subs.txt \
      --secrets {workspace}/jsubfinder_secrets.txt \
      -S 2>/dev/null || true
    touch {workspace}/jsubfinder_subs.txt {workspace}/jsubfinder_secrets.txt
    printf 'jsubfinder subdomains: %s | secrets: %s\n' \
      "$(wc -l < {workspace}/jsubfinder_subs.txt)" \
      "$(wc -l < {workspace}/jsubfinder_secrets.txt)"
  outputs:
    subdomains: '{workspace}/jsubfinder_subs.txt'
    secrets: '{workspace}/jsubfinder_secrets.txt'
- id: js_subdomain_extract
  name: '[JS] extract new subdomains from JS analysis + crawl corpus (jsapiscan, jsubfinder, hakrawler)'
  depends_on:
  - subjs_extract
  - jsapiscan_scan
  - jsubfinder_scan
  when: '{vars.run_js_analysis}'
  shell: true
  optional: true
  run: |
    (
      # JS file API endpoints
      grep -oP '(?:https?://)\K[a-zA-Z0-9._-]+\.{target}(?=[/?#]|$)' {workspace}/js_urls.txt 2>/dev/null || true
      grep -oP '(?:https?://)\K[a-zA-Z0-9._-]+\.{target}(?=[/?#]|$)' {workspace}/jsapiscan_results.txt 2>/dev/null || true
      # jsubfinder active JS crawl
      cat {workspace}/jsubfinder_subs.txt 2>/dev/null || true
      # full URL corpus (katana + hakrawler + gau + waymore) — catch any in-scope host references
      grep -oP '(?:https?://)\K[a-zA-Z0-9._-]+\.{target}(?=[/?#]|$)' {workspace}/all_urls.txt 2>/dev/null || true
      grep -oP '(?:https?://)\K[a-zA-Z0-9._-]+\.{target}(?=[/?#]|$)' {workspace}/hakrawler_urls.txt 2>/dev/null || true
    ) | sed 's/^\*\.//' | tr '[:upper:]' '[:lower:]' \
      | grep -E '^[a-z0-9][a-z0-9._-]*\.[a-z]{2,}$' \
      | awk -v t="{target}" 'length($0)>=length(t) && substr($0,length($0)-length(t)+1)==t' \
      | sort -u > {workspace}/js_subs.txt || true
    touch {workspace}/js_subs.txt
    printf 'JS/crawl-discovered subdomains (jsapiscan+jsubfinder+corpus): %s\n' "$(wc -l < {workspace}/js_subs.txt)"
  outputs:
    file: '{workspace}/js_subs.txt'
- id: takeover_check
  name: subdomain takeover — subzy + subjack + dnstake (parallel)
  depends_on:
  - merge_all_resolved
  when: '{vars.run_takeover}'
  optional: true
  fanout_concurrency: 3
  fanout_timeout_default: 20m
  fanout:
  - id: subzy
    shell: true
    run: subzy run --targets {workspace}/subdomains_all_resolved.txt --concurrency 100 --verify-ssl --hide-fails > {workspace}/takeover_subzy.txt 2>/dev/null; touch {workspace}/takeover_subzy.txt
    outputs:
      file: '{workspace}/takeover_subzy.txt'
    optional: true
  - id: subjack
    shell: true
    run: subjack -w {workspace}/subdomains_all_resolved.txt -t 100 -timeout 30 -ssl -a -o {workspace}/takeover_subjack.txt 2>/dev/null; touch {workspace}/takeover_subjack.txt
    outputs:
      file: '{workspace}/takeover_subjack.txt'
    optional: true
  - id: dnstake
    shell: true
    run: dnstake -f {workspace}/subdomains_all_resolved.txt -o {workspace}/takeover_dnstake.txt 2>/dev/null; touch {workspace}/takeover_dnstake.txt
    outputs:
      file: '{workspace}/takeover_dnstake.txt'
    optional: true
- id: merge_takeover
  name: merge takeover findings → filter VULNERABLE entries
  depends_on:
  - takeover_check
  when: '{vars.run_takeover}'
  run_on_failed_deps: true
  shell: true
  run: |
    (
      cat {workspace}/takeover_subzy.txt 2>/dev/null || true
      cat {workspace}/takeover_subjack.txt 2>/dev/null || true
      cat {workspace}/takeover_dnstake.txt 2>/dev/null || true
    ) | grep -iE '\[Vulnerable\]|VULNERABLE:|found.*takeover|takeover.*found|\[FOUND\]' \
      | grep -iv 'not vulnerable\|not found\|\[Not ' \
      | sort -u > {workspace}/takeover_findings.txt
    touch {workspace}/takeover_findings.txt
    VULN_COUNT=$(wc -l < {workspace}/takeover_findings.txt)
    printf 'Takeover findings: %s potential targets\n' "$VULN_COUNT" >> {workspace}/resolve_stats.txt
  outputs:
    file: '{workspace}/takeover_findings.txt'
- id: s3scanner_buckets
  name: '[cloud] s3scanner — enumerate exposed S3/GCS/Azure cloud storage buckets'
  depends_on:
  - dnsx_resolve
  when: '{vars.run_s3scan}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 15m
  run: "STEM=$(echo {target} | sed 's/\\.[^.]*$//'); printf '%s\\n%s\\n%s\\n%s\\n%s\\n%s\\n%s\\n%s\\n%s\\n%s\\n%s\\n%s\\n%s\\n%s\\n%s\\n' \\\n  \"{target}\" \"$STEM\" \\\n  \"$STEM-assets\" \"$STEM-static\" \"$STEM-media\" \"$STEM-uploads\" \\\n  \"$STEM-backup\" \"$STEM-data\" \"$STEM-files\" \"$STEM-public\" \\\n  \"$STEM-private\" \"$STEM-dev\" \"$STEM-staging\" \"$STEM-prod\" \"$STEM-logs\" \\\n> {workspace}/bucket_names.txt; s3scanner -bucket-file {workspace}/bucket_names.txt -json -threads 10 2>/dev/null > {workspace}/s3scanner.json || true; touch {workspace}/s3scanner.json; EXPOSED=$(jq -r 'select(.bucket.exists==1) | .bucket.name' {workspace}/s3scanner.json 2>/dev/null | wc -l || echo 0); printf 'Cloud storage buckets exposed: %s\\n' \"$EXPOSED\" >> {workspace}/resolve_stats.txt || true"
  outputs:
    file: '{workspace}/s3scanner.json'
- id: nuclei_hosts
  name: nuclei — live HTTP hosts (full template set, skip dns)
  depends_on:
  - httpx
  when: '{vars.run_nuclei}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 3h
  run: nuclei -l {workspace}/httpx.jsonl -nmhe -jsonl -silent -rl {vars.nuclei_rl} -c {vars.nuclei_concurrency} -timeout {vars.nuclei_timeout} -etags dns -o {workspace}/nuclei_hosts.jsonl 2>/dev/null; touch {workspace}/nuclei_hosts.jsonl
  outputs:
    nuclei_jsonl: '{workspace}/nuclei_hosts.jsonl'
- id: nuclei_misconfig
  name: nuclei — misconfigurations + exposures on all resolved hosts
  depends_on:
  - merge_all_resolved
  when: '{vars.run_nuclei}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 2h
  run: nuclei -l {workspace}/subdomains_all_resolved.txt -nmhe -jsonl -silent -rl {vars.nuclei_rl} -c {vars.nuclei_concurrency} -timeout {vars.nuclei_timeout} -tags misconfig,exposure,dns,network -o {workspace}/nuclei_misconfig.jsonl 2>/dev/null; touch {workspace}/nuclei_misconfig.jsonl
  outputs:
    nuclei_misconfig_jsonl: '{workspace}/nuclei_misconfig.jsonl'
- id: afrog_scan
  name: afrog — PoC-based vuln scan (complements nuclei)
  depends_on:
  - httpx
  when: '{vars.run_afrog}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 2h
  run: afrog -l {workspace}/httpx.jsonl -severity critical,high,medium -json-output {workspace}/afrog.jsonl 2>/dev/null; touch {workspace}/afrog.jsonl
  outputs:
    afrog_jsonl: '{workspace}/afrog.jsonl'
- id: nuclei_naabu_ports
  name: nuclei — non-HTTP ports discovered by naabu (network templates)
  depends_on:
  - naabu_topscan
  when: '{vars.run_nuclei} && {vars.run_portscan}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 60m
  run: |
    touch {workspace}/naabu_nonweb_targets.txt {workspace}/nuclei_ports.jsonl
    test -f {workspace}/naabu.jsonl || exit 0
    jq -r '"\(.host // .ip):\(.port)"' {workspace}/naabu.jsonl 2>/dev/null \
      | grep -vE ':(80|443|8080|8443|8888)$' | sort -u > {workspace}/naabu_nonweb_targets.txt
    test -s {workspace}/naabu_nonweb_targets.txt && nuclei \
      -l {workspace}/naabu_nonweb_targets.txt \
      -nmhe -jsonl -silent \
      -rl 50 -c 10 -timeout 15 \
      -tags network,dns,ssl,ssh,ftp,smtp \
      -o {workspace}/nuclei_ports.jsonl 2>/dev/null || true
  outputs:
    file: '{workspace}/nuclei_ports.jsonl'
- id: final_report
  name: generate final recon summary report
  depends_on:
  - resolve_stats
  - merge_all_resolved
  - asn_discover
  - reverse_dns_asn
  - ptr_scan_dns
  - axfr_check
  - http_redirect_subs
  - tlsx_san_mine
  - cdncheck_classify
  - ip_group_analyze
  - favicon_hash
  - favicon_pivot_filter
  - vhost_findings_merge
  - ip_pivot_filter
  - pivot_dnsx_resolve
  - merge_crawl_urls
  - subjs_extract
  - jsapiscan_scan
  - takeover_check
  - s3scanner_buckets
  - nuclei_hosts
  - nuclei_misconfig
  - afrog_scan
  - nuclei_naabu_ports
  - screenshot
  run_on_failed_deps: true
  shell: true
  run: 'mkdir -p {workspace}/report;

    PASSIVE=$(wc -l < {workspace}/passive_merged.txt               2>/dev/null || echo 0); CANDIDATES=$(wc -l < {workspace}/subdomains_all.txt             2>/dev/null || echo 0); RESOLVED=$(wc -l < {workspace}/subdomains_resolved.txt          2>/dev/null || echo 0); TLSX_NEW=$(wc -l < {workspace}/tlsx_new_subs.txt                2>/dev/null || echo 0); TLSX_RESOLVED=$(wc -l < {workspace}/subdomains_tlsx_resolved.txt 2>/dev/null || echo 0); TOTAL_RESOLVED=$(wc -l < {workspace}/subdomains_all_resolved.txt 2>/dev/null || echo 0); LIVE_HTTP=$(wc -l < {workspace}/live_urls.txt                    2>/dev/null || echo 0); OPEN_PORTS=$(test -f {workspace}/naabu.jsonl && jq -r ''"\(.host):\(.port)"'' {workspace}/naabu.jsonl 2>/dev/null | sort -u | wc -l || echo 0); ASN_CIDRS=$(wc -l < {workspace}/asn_ipv4_cidrs.txt              2>/dev/null || echo 0); REVDNS_SUBS=$(wc -l < {workspace}/reverse_dns_subs.txt          2>/dev/null || echo 0); AXFR_SUBS=$(wc -l < {workspace}/axfr_subs.txt                   2>/dev/null || echo 0); PERM_GOTATOR=$(wc -l < {workspace}/perm_gotator.txt             2>/dev/null || echo 0); MASSDNS_SUBS=$(wc -l < {workspace}/a_massdns.txt                2>/dev/null || echo 0); CDN_HOSTS=$(jq -r ''select(.cdn==true)  | .host'' {workspace}/cdncheck.jsonl 2>/dev/null | wc -l || echo 0); ORIGIN_HOSTS=$(jq -r ''select(.cdn != true and .waf != true and .cloud != true) | .input'' {workspace}/cdncheck.jsonl 2>/dev/null | wc -l || echo 0); SHARED_HOSTING_IPS=$(wc -l < {workspace}/ip_groups/shared_hosting.txt 2>/dev/null || echo 0); FAVICON_RELATED=$(wc -l < {workspace}/favicon_related_offdomain.txt 2>/dev/null || echo 0); FAVICON_INSCOPE=$(wc -l < {workspace}/favicon_in_scope.txt      2>/dev/null || echo 0); VHOST_NEW=$(wc -l < {workspace}/vhost_new_hosts.txt             2>/dev/null || echo 0); IP_PIVOT_INSCOPE=$(wc -l < {workspace}/ip_pivot_in_scope.txt   2>/dev/null || echo 0); IP_PIVOT_NEIGHBORS=$(wc -l < {workspace}/ip_pivot_neighbors.txt 2>/dev/null || echo 0); PIVOT_NEW=$(wc -l < {workspace}/pivot_new_resolved.txt         2>/dev/null || echo 0); URLS=$(wc -l < {workspace}/all_urls.txt                          2>/dev/null || echo 0); JS_FILES=$(wc -l < {workspace}/js_urls.txt                       2>/dev/null || echo 0); JS_APIS=$(wc -l < {workspace}/jsapiscan_results.txt              2>/dev/null || echo 0); JS_SUBS=$(wc -l < {workspace}/js_subs.txt                        2>/dev/null || echo 0); NUCLEI_CRIT=$(jq -r ''select(.info.severity=="critical") | .host'' {workspace}/nuclei_hosts.jsonl {workspace}/nuclei_misconfig.jsonl 2>/dev/null | sort -u | wc -l || echo 0); NUCLEI_HIGH=$(jq -r ''select(.info.severity=="high")     | .host'' {workspace}/nuclei_hosts.jsonl {workspace}/nuclei_misconfig.jsonl 2>/dev/null | sort -u | wc -l || echo 0); NUCLEI_MED=$(jq -r  ''select(.info.severity=="medium")   | .host'' {workspace}/nuclei_hosts.jsonl {workspace}/nuclei_misconfig.jsonl 2>/dev/null | sort -u | wc -l || echo 0); TAKEOVER=$(wc -l < {workspace}/takeover_findings.txt             2>/dev/null || echo 0); AFROG_TOTAL=$(jq -r ''.["poc-id"]'' {workspace}/afrog.jsonl        2>/dev/null | wc -l || echo 0); BUCKETS=$(jq -r ''select(.bucket.exists==1) | .bucket.name'' {workspace}/s3scanner.json 2>/dev/null | wc -l || echo 0);

    cat > {workspace}/report/summary.md << EOFMD # K1NZR3C0N — Full Recon Report **Target:** {target}

    ## Asset Discovery | Metric | Count | |--------|-------| | Passive sources unique | $PASSIVE | | All subdomain candidates | $CANDIDATES | | DNS resolved (live) | $RESOLVED | | TLS SAN new discoveries | $TLSX_NEW | | TLS SAN resolved | $TLSX_RESOLVED | | **Total resolved hosts** | **$TOTAL_RESOLVED** | | Live HTTP endpoints | $LIVE_HTTP | | Open ports found | $OPEN_PORTS | | ASN/IP CIDR ranges | $ASN_CIDRS | | Reverse DNS new subs | $REVDNS_SUBS | | AXFR zone transfer subs | $AXFR_SUBS | | Gotator permutation subs | $PERM_GOTATOR | | Massdns brute subs | $MASSDNS_SUBS | | CDN hosts | $CDN_HOSTS | | Origin (non-CDN) hosts | $ORIGIN_HOSTS | | Shared-hosting IPs | $SHARED_HOSTING_IPS |

    ## Pivot Discovery (favicon / vhost / IP-pivot) | Technique | Count | |-----------|-------| | Favicon in-scope new subs | $FAVICON_INSCOPE | | Favicon off-domain assets | $FAVICON_RELATED | | VHost new subs (ffuf+SAN) | $VHOST_NEW | | IP-pivot in-scope new subs | $IP_PIVOT_INSCOPE | | IP-pivot neighbor domains | $IP_PIVOT_NEIGHBORS | | **Pivot-resolved bonus hosts** | **$PIVOT_NEW** |

    ## URL & JS Intelligence | Metric | Count | |--------|-------| | Total URLs collected | $URLS | | JS files discovered | $JS_FILES | | JS API endpoints | $JS_APIS | | New subs from JS | $JS_SUBS |

    ## Vulnerability Findings | Severity | Count | |----------|-------| | Critical  | $NUCLEI_CRIT | | High      | $NUCLEI_HIGH | | Medium    | $NUCLEI_MED | | Afrog PoC | $AFROG_TOTAL | | Takeover candidates | $TAKEOVER | | Cloud buckets exposed | $BUCKETS |

    ## Key Output Files - \`passive_merged.txt\` — all passive unique subdomains (13 sources) - \`subdomains_all.txt\` — passive + active + permutation candidates - \`subdomains_all_resolved.txt\` — all live DNS-resolved hosts (DNS + TLS) - \`axfr_subs.txt\` — zone transfer results (high-value if non-empty!) - \`reverse_dns_subs.txt\` — reverse DNS findings from ASN ranges - \`perm_gotator.txt\` — gotator smart permutations resolved - \`a_massdns.txt\` — massdns brute-force resolved - \`httpx.jsonl\` — live HTTP hosts with title/tech fingerprint - \`naabu.jsonl\` — port scan results (JSONL) - \`cdncheck.jsonl\` — CDN classification per host - \`ip_groups/shared_hosting.txt\` — IPs hosting multiple subs (shared hosting) - \`ip_groups/ip_to_hosts.json\` — full IP→hosts mapping - \`origin_ips.txt\` — non-CDN origin IPs (safe for vhost fuzz / ip pivot) - \`favicon_hashes.txt\` — mmh3 favicon hashes per live host - \`favicon_in_scope.txt\` — new in-scope subs from favicon pivot - \`favicon_related_offdomain.txt\` — off-domain hosts sharing favicon (review manually) - \`vhost_new_hosts.txt\` — new subs from vhost ffuf + SSL SAN extraction - \`ip_pivot_in_scope.txt\` — new in-scope subs from IP/PTR pivot - \`ip_pivot_neighbors.txt\` — neighboring org domains for manual review - \`pivot_new_resolved.txt\` — all pivot-discovered hosts after DNS resolution - \`all_urls.txt\` — all collected URLs (passive + katana + waymore) - \`js_urls.txt\` — JavaScript file URLs - \`jsapiscan_results.txt\` — API endpoints from JS analysis - \`nuclei_hosts.jsonl\` — nuclei findings on live HTTP - \`nuclei_misconfig.jsonl\` — misconfig/exposure on all hosts - \`afrog.jsonl\` — afrog PoC-based findings - \`takeover_findings.txt\` — subdomain takeover candidates - \`s3scanner.json\` — cloud storage bucket scan results - \`asn_ipv4_cidrs.txt\` — IPv4 CIDR ranges for target org (metabigor) - \`amass_intel.txt\` + \`amass_intel_cidrs.txt\` — org WHOIS ASN CIDRs (amass intel) - \`screenshots/\` + \`gallery.html\` — visual recon gallery EOFMD

    printf ''\n=== RECON COMPLETE ===\n''; cat {workspace}/report/summary.md'
  outputs:
    summary: '{workspace}/report/summary.md'
