name: k1nzr3con-full
vars:
  subdomains_list: ''
  run_discovery: 'true'
  run_portscan: 'true'
  run_deep_scan: 'false'
  run_vhost: 'true'
  run_crawl: 'true'
  run_screenshot: 'true'
  run_nuclei: 'true'
  run_afrog: 'true'
  run_params: 'true'
  httpx_bin: httpx
  subzy_bin: subzy
  oneforall_cmd: python /opt/OneForAll/oneforall.py
  scripts_dir: /app
  sub_wordlist: /app/wordlists/subdomains-top1million-20000.txt
  vhost_wordlist: /app/wordlists/subdomains-top1million-20000.txt
  dir_wordlist: /app/wordlists/common.txt
  dns_resolvers: 1.1.1.1,8.8.8.8,1.0.0.1,8.8.4.4
  gobuster_threads: '150'
  gobuster_timeout: 3s
  dnsx_threads: '50'
  dnsx_retry: '5'
  chaos_key: ''
  naabu_rate: '1000'
  naabu_top_ports: '1000'
  httpx_threads: '50'
  katana_depth: '3'
  screenshot_threads: '10'
  ffuf_filter_size: '120'
  run_dirbrute: 'true'
  scheme: https
  tools_root: /opt
  param_wordlist: /app/wordlists/params-medium.txt
  kr_wordlist: /app/wordlists/routes-large.kite
  arjun_rate: '20'
  rustscan_batch: '5000'
  rustscan_timeout_ms: '2000'
  rustscan_tries: '2'
  nmap_tcp_flags: -sV -sC -Pn -p-
  nmap_udp_flags: -sU -Pn --top-ports 200
steps:
- id: setup_subfinder_keys
  name: configure subfinder + uncover API keys (supplement tasks.py config — do NOT overwrite)
  shell: true
  run: |
    # tasks.py already writes full provider-config.yaml from /keys UI DB before the workflow
    # subprocess starts. This step SUPPLEMENTS with any env-var-only keys not yet in the DB.
    mkdir -p ~/.config/subfinder ~/.config/uncover
    EXISTING_SF=/root/.config/subfinder/provider-config.yaml

    {
      cat "$EXISTING_SF" 2>/dev/null || true
      ST_T="${SECURITYTRAILS_KEY:-}"
      [ -n "$ST_T" ] && ! grep -q '^securitytrails:' "$EXISTING_SF" 2>/dev/null && \
        printf 'securitytrails:\n  - %s\n' "$ST_T"
      VT_T="${VIRUSTOTAL_KEY:-}"
      [ -n "$VT_T" ] && ! grep -q '^virustotal:' "$EXISTING_SF" 2>/dev/null && \
        printf 'virustotal:\n  - %s\n' "$VT_T"
      ZY_T="${ZOOMEYE_API_KEY:-}"
      [ -n "$ZY_T" ] && ! grep -q '^zoomeyeapi:' "$EXISTING_SF" 2>/dev/null && \
        printf 'zoomeyeapi:\n  - %s\n' "$ZY_T"
      HT_T="${HACKERTARGET_API_KEY:-}"
      [ -n "$HT_T" ] && ! grep -q '^hackertarget:' "$EXISTING_SF" 2>/dev/null && \
        printf 'hackertarget:\n  - %s\n' "$HT_T"
    } > /tmp/.sf_merged.yaml 2>/dev/null || true
    [ -s /tmp/.sf_merged.yaml ] && cp /tmp/.sf_merged.yaml "$EXISTING_SF"

    EXISTING_UC=/root/.config/uncover/provider-config.yaml
    {
      cat "$EXISTING_UC" 2>/dev/null || true
      HUNTER_T="${HUNTER_API_KEY:-}"
      [ -n "$HUNTER_T" ] && ! grep -q '^hunter:' "$EXISTING_UC" 2>/dev/null && \
        printf 'hunter:\n  - %s\n' "$HUNTER_T"
      GN_T="${GREYNOISE_API_KEY:-}"
      [ -n "$GN_T" ] && ! grep -q '^greynoise:' "$EXISTING_UC" 2>/dev/null && \
        printf 'greynoise:\n  - %s\n' "$GN_T"
    } > /tmp/.uc_merged.yaml 2>/dev/null || true
    [ -s /tmp/.uc_merged.yaml ] && cp /tmp/.uc_merged.yaml "$EXISTING_UC"

    ACTIVE=$(grep -c '^\w' ~/.config/subfinder/provider-config.yaml 2>/dev/null || echo 0)
    ACTIVE_UC=$(grep -c '^\w' ~/.config/uncover/provider-config.yaml 2>/dev/null || echo 0)
    printf '[setup] subfinder: %s providers | uncover: %s providers\n' "$ACTIVE" "$ACTIVE_UC"
    printf '[setup] sources: %s\n' \
      "$(grep '^\w' ~/.config/subfinder/provider-config.yaml 2>/dev/null | tr -d ':' | tr '\n' ',' | sed 's/,$//')"
- id: subfinder
  name: subfinder (cert transparency + passive APIs)
  when: '{vars.run_discovery}'
  depends_on: [setup_subfinder_keys]
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 10m
  run: subfinder -d {target} -silent -all -recursive -timeout 60 2>/dev/null > {workspace}/subfinder.txt || true; touch {workspace}/subfinder.txt
  outputs:
    file: '{workspace}/subfinder.txt'
- id: assetfinder
  name: assetfinder (Facebook graph + cert APIs)
  when: '{vars.run_discovery}'
  shell: true
  optional: true
  skip_if_exists: true
  run: assetfinder --subs-only {target} > {workspace}/assetfinder.txt 2>/dev/null; touch {workspace}/assetfinder.txt
  outputs:
    file: '{workspace}/assetfinder.txt'
- id: sublist3r
  name: sublist3r (Google/Bing/Baidu/Netcraft)
  when: '{vars.run_discovery}'
  shell: true
  optional: true
  skip_if_exists: true
  run: sublist3r -d {target} -o {workspace}/sublist3r.txt -e DNSdumpster,Virustotal,ThreatCrowd 2>/dev/null; touch {workspace}/sublist3r.txt
  outputs:
    file: '{workspace}/sublist3r.txt'
- id: findomain
  name: findomain (cert transparency + APIs)
  when: '{vars.run_discovery}'
  optional: true
  skip_if_exists: true
  run: findomain -t {target} -q -u {workspace}/findomain.txt
  outputs:
    file: '{workspace}/findomain.txt'
- id: chaos
  name: chaos (ProjectDiscovery dataset)
  when: '{vars.run_discovery}'
  shell: true
  optional: true
  skip_if_exists: true
  run: |
    CHAOS_KEY="${CHAOS_API_KEY:-{vars.chaos_key}}"
    if [ -z "$CHAOS_KEY" ]; then
      echo "[chaos] no CHAOS_API_KEY — skipping"; touch {workspace}/chaos.txt; exit 0
    fi
    chaos -d {target} -silent -key "$CHAOS_KEY" -o {workspace}/chaos.txt 2>/dev/null
    touch {workspace}/chaos.txt
  outputs:
    file: '{workspace}/chaos.txt'
- id: gobuster_dns
  name: gobuster DNS bruteforce
  when: '{vars.run_discovery}'
  optional: true
  skip_if_exists: true
  timeout: 20m
  run: gobuster dns --domain {target} -w {vars.sub_wordlist} -t {vars.gobuster_threads} --resolver 1.1.1.1 --timeout {vars.gobuster_timeout} -q --no-fqdn --no-progress --no-error -o {workspace}/gobuster_dns.txt
  outputs:
    file: '{workspace}/gobuster_dns.txt'
- id: amass
  name: amass passive subdomain enumeration
  when: '{vars.run_discovery}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 20m
  run: amass enum -passive -d {target} -silent -o {workspace}/amass.txt 2>/dev/null; touch {workspace}/amass.txt
  outputs:
    file: '{workspace}/amass.txt'
- id: oneforall
  name: OneForAll (comprehensive multi-source)
  when: '{vars.run_discovery}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 45m
  run: mkdir -p {workspace}/oneforall && {vars.oneforall_cmd} --target {target} --path {workspace}/oneforall --fmt csv run 2>/dev/null
  outputs:
    file: '{workspace}/oneforall'
- id: normalize_gobuster
  name: strip FQDN artifacts + filter by scope
  depends_on:
  - gobuster_dns
  shell: true
  optional: true
  run: python {vars.scripts_dir}/scripts/normalize_subdomains.py --input {steps.gobuster_dns.file} --output {workspace}/gobuster_dns.clean.txt --target {target} 2>/dev/null; touch {workspace}/gobuster_dns.clean.txt
  outputs:
    file: '{workspace}/gobuster_dns.clean.txt'
- id: oneforall_collect
  name: extract subdomains from OneForAll CSV
  depends_on:
  - oneforall
  shell: true
  optional: true
  run: python {vars.scripts_dir}/scripts/oneforall_extract.py --input {steps.oneforall.file} --output {workspace}/oneforall.txt 2>/dev/null; touch {workspace}/oneforall.txt
  outputs:
    oneforall_file: '{workspace}/oneforall.txt'
- id: normalize_oneforall
  name: normalize OneForAll output
  depends_on:
  - oneforall_collect
  shell: true
  optional: true
  run: python {vars.scripts_dir}/scripts/normalize_subdomains.py --input {steps.oneforall_collect.oneforall_file} --output {workspace}/oneforall.clean.txt --target {target} 2>/dev/null; touch {workspace}/oneforall.clean.txt
  outputs:
    file: '{workspace}/oneforall.clean.txt'
- id: merge_subdomains
  name: merge all sources → sort + deduplicate
  depends_on:
  - subfinder
  - assetfinder
  - sublist3r
  - findomain
  - chaos
  - amass
  - normalize_gobuster
  - normalize_oneforall
  run_on_failed_deps: true
  shell: true
  run: "(\n  echo {target};\n  echo www.{target};\n  test -f {workspace}/subfinder.txt          && cat {workspace}/subfinder.txt          || true;\n  test -f {workspace}/assetfinder.txt        && cat {workspace}/assetfinder.txt        || true;\n  test -f {workspace}/sublist3r.txt          && cat {workspace}/sublist3r.txt          || true;\n  test -f {workspace}/findomain.txt          && cat {workspace}/findomain.txt          || true;\n  test -f {workspace}/chaos.txt              && cat {workspace}/chaos.txt              || true;\n  test -f {workspace}/amass.txt              && cat {workspace}/amass.txt              || true;\n  test -f {workspace}/gobuster_dns.clean.txt && cat {workspace}/gobuster_dns.clean.txt || true;\n  test -f {workspace}/oneforall.clean.txt    && cat {workspace}/oneforall.clean.txt    || true;\n  test -n '{vars.subdomains_list}' && test -f '{vars.subdomains_list|/dev/null}' && cat '{vars.subdomains_list}' || true\n) | sed 's|https\\?://||; s|/.*||; s|^\\*\\.||; s|\\.$||; s|[[:space:]].*||' | tr '[:upper:]' '[:lower:]' | grep -E '^[a-z0-9][a-z0-9._-]*\\.[a-z]{2,}$' | awk -v t=\"{target}\" 'length($0) >= length(t) && substr($0, length($0)-length(t)+1) == t' | sort -u > {workspace}/subdomains.txt; touch {workspace}/subdomains.txt"
  outputs:
    subdomains: '{workspace}/subdomains.txt'
  requires:
  - path: '{workspace}/subdomains.txt'
    min_bytes: 1
- id: dnsx_resolve
  name: DNS resolve — filter to live hosts only
  depends_on:
  - merge_subdomains
  skip_if_exists: true
  retries: 1
  run: dnsx -l {steps.merge_subdomains.subdomains} -silent -r {vars.dns_resolvers} -t {vars.dnsx_threads} -retry {vars.dnsx_retry} -o {workspace}/subdomains_resolved.txt
  outputs:
    resolved: '{workspace}/subdomains_resolved.txt'
  requires:
  - path: '{workspace}/subdomains_resolved.txt'
    min_bytes: 1
- id: naabu
  name: port scan top-1000 (naabu)
  depends_on:
  - dnsx_resolve
  when: '{vars.run_portscan}'
  optional: true
  skip_if_exists: true
  run: naabu -list {steps.dnsx_resolve.resolved} -rate {vars.naabu_rate} -top-ports {vars.naabu_top_ports} -json -o {workspace}/naabu.jsonl -silent -r {vars.dns_resolvers}
  outputs:
    naabu_file: '{workspace}/naabu.jsonl'
- id: subzy
  name: subdomain takeover check (subzy)
  depends_on:
  - dnsx_resolve
  shell: true
  optional: true
  run: '{vars.subzy_bin} run --targets {steps.dnsx_resolve.resolved} > {workspace}/subzy.txt 2>/dev/null; touch {workspace}/subzy.txt'
  outputs:
    subzy_file: '{workspace}/subzy.txt'
- id: gau
  name: passive URL mining (wayback + commoncrawl + OTX)
  depends_on:
  - dnsx_resolve
  when: '{vars.run_crawl}'
  shell: true
  optional: true
  run: cat {steps.dnsx_resolve.resolved} | gau --blacklist png,jpg,gif,svg,ico,css,woff,woff2,ttf,eot,mp4,mp3,pdf,zip --threads 5 --timeout 30 --json 2>/dev/null > {workspace}/gau.jsonl || true
  outputs:
    gau_jsonl: '{workspace}/gau.jsonl'
- id: waybackurls
  name: Wayback Machine historical URL dump
  depends_on:
  - dnsx_resolve
  when: '{vars.run_crawl}'
  shell: true
  optional: true
  run: cat {steps.dnsx_resolve.resolved} | timeout 120 waybackurls 2>/dev/null | sort -u > {workspace}/waybackurls.txt || true
  outputs:
    wayback_file: '{workspace}/waybackurls.txt'
- id: httpx
  name: HTTP probe — title / tech-detect / status / redirect chain
  depends_on:
  - dnsx_resolve
  - naabu
  run_on_failed_deps: true
  skip_if_exists: true
  run: '{vars.httpx_bin} -l {steps.dnsx_resolve.resolved} -silent -json -o {workspace}/httpx.jsonl -td -title -status-code -content-length -follow-redirects -timeout 10 -threads {vars.httpx_threads}'
  outputs:
    alive_file: '{workspace}/httpx.jsonl'
    httpx_jsonl: '{workspace}/httpx.jsonl'
  requires:
  - path: '{workspace}/httpx.jsonl'
    min_bytes: 1
- id: deep_portscan
  name: deep port scan — rustscan full range + nmap service/version/UDP
  depends_on:
  - dnsx_resolve
  when: '{vars.run_deep_scan}'
  optional: true
  fanout_concurrency: 2
  fanout_timeout_default: 3h
  fanout:
  - id: rustscan
    run: rustscan -a {target} --range 1-65535 --scan-order random --batch-size {vars.rustscan_batch} --timeout {vars.rustscan_timeout_ms} --tries {vars.rustscan_tries} --ulimit 5000 -- -Pn -sV -sC -oN {workspace}/rustscan.txt
    outputs:
      file: '{workspace}/rustscan.txt'
    requires:
    - path: '{workspace}/rustscan.txt'
      min_bytes: 0
    optional: true
  - id: nmap_tcp
    run: nmap {vars.nmap_tcp_flags} -oN {workspace}/nmap_tcp.txt {target}
    outputs:
      file: '{workspace}/nmap_tcp.txt'
    requires:
    - path: '{workspace}/nmap_tcp.txt'
      min_bytes: 0
    optional: true
  - id: nmap_udp
    run: nmap {vars.nmap_udp_flags} -oN {workspace}/nmap_udp.txt {target}
    outputs:
      file: '{workspace}/nmap_udp.txt'
    requires:
    - path: '{workspace}/nmap_udp.txt'
      min_bytes: 0
    optional: true
- id: dirbrute
  name: directory & endpoint brute-force (6 parallel tools)
  depends_on:
  - httpx
  when: '{vars.run_dirbrute}'
  optional: true
  fanout_concurrency: 3
  fanout_timeout_default: 30m
  fanout:
  - id: gobuster
    run: gobuster dir -u {vars.scheme}://{target} -w {vars.dir_wordlist} -b 404,403,400,429,302 -t 50 -q -o {workspace}/gobuster_dir.txt
    outputs:
      file: '{workspace}/gobuster_dir.txt'
    optional: true
  - id: dirsearch
    run: dirsearch -u {vars.scheme}://{target} -x 400,404,403,429 --no-color --random-agent --timeout 10 --retries 2 -o {workspace}/dirsearch.txt
    outputs:
      file: '{workspace}/dirsearch.txt'
    optional: true
  - id: ffuf
    run: ffuf -u {vars.scheme}://{target}/FUZZ -w {vars.dir_wordlist} -mc 200,301,302,500,401 -fc 404,403,400,429 -o {workspace}/ffuf_dir.json -of json -ac -noninteractive -s -or -t 40
    outputs:
      file: '{workspace}/ffuf_dir.json'
    optional: true
  - id: feroxbuster
    run: feroxbuster -u {vars.scheme}://{target} -w {vars.dir_wordlist} -o {workspace}/feroxbuster.txt --silent -b 404,403,400,429
    outputs:
      file: '{workspace}/feroxbuster.txt'
    optional: true
  - id: fuzzuli
    shell: true
    run: echo {vars.scheme}://{target} | fuzzuli -mt all > {workspace}/fuzzuli.txt 2>/dev/null || true
    outputs:
      file: '{workspace}/fuzzuli.txt'
    optional: true
  - id: swaggerspy
    when: 'false'
    shell: true
    run: python {vars.tools_root}/SwaggerSpy/swaggerspy.py {target} > {workspace}/swaggerspy.txt 2>/dev/null || true
    outputs:
      file: '{workspace}/swaggerspy.txt'
    optional: true
- id: vhost_fuzz
  name: virtual host discovery (gobuster + ffuf)
  depends_on:
  - httpx
  when: '{vars.run_vhost}'
  optional: true
  fanout_concurrency: 2
  fanout_timeout_default: 10m
  fanout:
  - id: gobuster
    run: gobuster vhost -u http://{target} -w {vars.vhost_wordlist} --append-domain -t 100 -q -o {workspace}/gobuster_vhost.txt
    outputs:
      file: '{workspace}/gobuster_vhost.txt'
    optional: true
  - id: ffuf
    run: 'ffuf -w {vars.vhost_wordlist}:FUZZ -u http://{target} -H "Host: FUZZ.{target}" -fs {vars.ffuf_filter_size} -o {workspace}/ffuf_vhost.json -of json -ac -t 100 -noninteractive -s -or'
    outputs:
      file: '{workspace}/ffuf_vhost.json'
    optional: true
- id: katana
  name: active JS/endpoint crawler (katana)
  depends_on:
  - httpx
  when: '{vars.run_crawl}'
  shell: true
  optional: true
  run: katana -list {steps.httpx.alive_file} -depth {vars.katana_depth} -silent -jsonl -kf robotstxt,sitemapxml -jc -aff -o {workspace}/katana.jsonl 2>/dev/null || true
  outputs:
    katana_jsonl: '{workspace}/katana.jsonl'
- id: screenshot
  name: headless screenshots (gowitness)
  depends_on:
  - httpx
  when: '{vars.run_screenshot}'
  shell: true
  optional: true
  run: jq -r '.url // empty' {steps.httpx.alive_file} 2>/dev/null | sort -u > {workspace}/live_urls.txt; test -s {workspace}/live_urls.txt && mkdir -p {workspace}/screenshots && gowitness scan file -f {workspace}/live_urls.txt -s {workspace}/screenshots --write-db --write-db-uri sqlite://{workspace}/gowitness.sqlite3 --chrome-path /usr/local/bin/chromium-docker -T 30 --threads {vars.screenshot_threads} -q 2>{workspace}/gowitness.log || true
  outputs:
    gowitness_db: '{workspace}/gowitness.sqlite3'
    screenshot_dir: '{workspace}/screenshots'
- id: kiterunner
  name: API route discovery — Assetnote wordlists (kiterunner)
  depends_on:
  - httpx
  - screenshot
  when: '{vars.run_params}'
  shell: true
  optional: true
  run: |
    test -s {workspace}/live_urls.txt || exit 0
    test -f {vars.kr_wordlist} || exit 0
    kr scan -i {workspace}/live_urls.txt -w {vars.kr_wordlist} \
      --fail-status-codes 400,401,404,403,501,502,426,411 \
      -x 30 -o {workspace}/kiterunner.txt 2>/dev/null || true
  outputs:
    kr_file: '{workspace}/kiterunner.txt'
- id: merge_urls
  name: merge katana + gau + waybackurls → URLs + injection points
  depends_on:
  - katana
  - gau
  - waybackurls
  when: '{vars.run_crawl}'
  run_on_failed_deps: true
  optional: true
  shell: true
  run: ( test -f {workspace}/katana.jsonl && jq -r '.request.endpoint // .endpoint // empty' {workspace}/katana.jsonl 2>/dev/null || true; test -f {workspace}/gau.jsonl && jq -r '.url // empty' {workspace}/gau.jsonl 2>/dev/null || true; test -f {workspace}/waybackurls.txt && cat {workspace}/waybackurls.txt || true ) | grep -E '^https?://' | sort -u > {workspace}/urls_all.txt; grep '?' {workspace}/urls_all.txt 2>/dev/null | grep -vE '\.(png|jpg|gif|svg|ico|css|woff|ttf|mp4|pdf|zip)(\?|$)' | sort -u > {workspace}/urls_params.txt; touch {workspace}/urls_all.txt {workspace}/urls_params.txt
  outputs:
    urls_file: '{workspace}/urls_all.txt'
    params_file: '{workspace}/urls_params.txt'
- id: screenshot_gallery
  name: build gowitness HTML gallery
  depends_on:
  - screenshot
  optional: true
  shell: true
  run: test -f {workspace}/gowitness.sqlite3 && cd {workspace} && gowitness report generate --db-uri sqlite://{workspace}/gowitness.sqlite3 -q 2>/dev/null || true
  outputs:
    gallery_html: '{workspace}/gallery.html'
- id: nuclei
  name: nuclei — live HTTP hosts
  depends_on:
  - httpx
  - merge_urls
  when: '{vars.run_nuclei}'
  run_on_failed_deps: true
  shell: true
  optional: true
  skip_if_exists: true
  run: nuclei -l {steps.httpx.alive_file} -nmhe -jsonl -silent -rl 150 -c 25 -timeout 8 -etags dns -o {workspace}/nuclei.jsonl 2>/dev/null; touch {workspace}/nuclei.jsonl
  outputs:
    nuclei_jsonl: '{workspace}/nuclei.jsonl'
- id: nuclei_urls
  name: nuclei — discovered endpoints (crawl surface)
  depends_on:
  - merge_urls
  when: '{vars.run_nuclei}'
  run_on_failed_deps: true
  shell: true
  optional: true
  run: test -s {workspace}/urls_all.txt && timeout 3600 nuclei -l {workspace}/urls_all.txt -nmhe -jsonl -silent -rl 100 -c 20 -timeout 8 -etags dns -o {workspace}/nuclei_urls.jsonl 2>/dev/null || true; touch {workspace}/nuclei_urls.jsonl
  outputs:
    nuclei_urls_jsonl: '{workspace}/nuclei_urls.jsonl'
- id: afrog
  name: PoC-based vulnerability scan (afrog) — complements nuclei
  depends_on:
  - httpx
  - merge_urls
  when: '{vars.run_afrog}'
  run_on_failed_deps: true
  shell: true
  optional: true
  skip_if_exists: true
  run: afrog -l {steps.httpx.alive_file} -severity critical,high,medium -json-output {workspace}/afrog.jsonl 2>/dev/null; touch {workspace}/afrog.jsonl
  outputs:
    afrog_jsonl: '{workspace}/afrog.jsonl'
- id: param_discover
  name: hidden parameter discovery — arjun + x8 + fallparams
  depends_on:
  - merge_urls
  - httpx
  - kiterunner
  when: '{vars.run_params}'
  run_on_failed_deps: true
  optional: true
  fanout_concurrency: 2
  fanout_timeout_default: 60m
  fanout:
  - id: arjun
    shell: true
    run: test -s {workspace}/urls_params.txt && arjun -i {workspace}/urls_params.txt -w {vars.param_wordlist} --rate-limit {vars.arjun_rate} --stable -oJ {workspace}/arjun.json 2>/dev/null || true; touch {workspace}/arjun.json
    outputs:
      file: '{workspace}/arjun.json'
    optional: true
  - id: x8
    shell: true
    run: test -s {workspace}/urls_params.txt && head -10 {workspace}/urls_params.txt | while read url; do x8 -u "$url" -w {vars.param_wordlist} -X GET --output-format json 2>/dev/null >> {workspace}/x8.json; done || true; touch {workspace}/x8.json
    outputs:
      file: '{workspace}/x8.json'
    optional: true
  - id: fallparams
    shell: true
    run: test -s {workspace}/urls_params.txt && head -10 {workspace}/urls_params.txt | while read url; do fallparams -u "$url" -c -d 2 2>/dev/null >> {workspace}/fallparams.txt; done || true; touch {workspace}/fallparams.txt
    outputs:
      file: '{workspace}/fallparams.txt'
    optional: true
- id: nuclei_report
  name: nuclei + afrog markdown summary report
  depends_on:
  - nuclei
  - nuclei_urls
  - afrog
  - param_discover
  run_on_failed_deps: true
  shell: true
  run: |
    mkdir -p {workspace}/nuclei_report
    ( test -s {workspace}/nuclei.jsonl || test -s {workspace}/nuclei_urls.jsonl ) && \
      python {vars.scripts_dir}/scripts/nuclei_report.py \
        --input {workspace}/nuclei.jsonl {workspace}/nuclei_urls.jsonl \
        --out {workspace}/nuclei_report || true
  outputs:
    nuclei_summary: '{workspace}/nuclei_report/summary.md'
