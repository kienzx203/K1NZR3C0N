name: recon-basic
vars:
  httpx_bin: /home/k1nzx/go/bin/httpx
  naabu_bin: naabu
  naabu_rate: 1000
  naabu_ports: top-1000
steps:
  - id: subs
    name: subdomain workflow
    workflow: workflows/recon-subdomains.yaml
    namespace: subs
  - id: naabu
    name: port scan (naabu)
    depends_on: ['subs.dnsx_resolve']
    run: '{vars.naabu_bin} -list {steps.subs.dnsx_resolve.resolved} -rate {vars.naabu_rate} -p {vars.naabu_ports} -o {workspace}/naabu.txt'
    outputs:
      naabu_file: '{workspace}/naabu.txt'
    requires:
      - path: '{workspace}/naabu.txt'
        min_bytes: 0
  - id: httpx
    name: http probe
    depends_on: ['subs.dnsx_resolve', 'naabu']
    run: '{httpx_bin} -l {steps.subs.dnsx_resolve.resolved} -silent -o {workspace}/alive.txt'
    outputs:
      alive_file: '{workspace}/alive.txt'
    requires:
      - path: '{workspace}/alive.txt'
        min_bytes: 1
  - id: nuclei
    name: vuln scan
    depends_on: ['httpx']
    run: 'nuclei -l {steps.httpx.alive_file} -nmhe -jsonl -o {workspace}/nuclei.jsonl'
    outputs:
      nuclei_jsonl: '{workspace}/nuclei.jsonl'
    requires:
      - path: '{workspace}/nuclei.jsonl'
        min_bytes: 1
  - id: nuclei_report
    name: nuclei report
    depends_on: ['nuclei']
    run: 'python scripts/nuclei_report.py --input {steps.nuclei.nuclei_jsonl} --out {workspace}/nuclei_report'
    outputs:
      nuclei_summary: '{workspace}/nuclei_report/summary.md'
    requires:
      - path: '{workspace}/nuclei_report/summary.md'
        min_bytes: 1
