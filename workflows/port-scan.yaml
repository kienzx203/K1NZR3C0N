name: port-scan
vars:
  nmap_tcp_flags: '-sV -sC -Pn -p-'
  nmap_udp_flags: '-sU -Pn -p-'
  nmap_udp_targets: '{target}'
  rustscan_batch: 5000
  rustscan_timeout_ms: 2000
  rustscan_tries: 2
steps:
  - id: port_scan
    name: port scan (rustscan + nmap)
    fanout_concurrency: 2
    fanout_timeout_default: 30m
    fanout:
      - id: rustscan
        run: '/home/k1nzx/rustscan -a {target} --range 1-65535 --scan-order random --batch-size {vars.rustscan_batch} --timeout {vars.rustscan_timeout_ms} --tries {vars.rustscan_tries} --ulimit 5000 -- -Pn -sV -sC -oN {workspace}/rustscan.txt'
        outputs:
          file: '{workspace}/rustscan.txt'
        requires:
          - path: '{workspace}/rustscan.txt'
            min_bytes: 0
      - id: nmap
        run: 'nmap {vars.nmap_tcp_flags} -oN {workspace}/nmap_tcp.txt {target} && nmap {vars.nmap_udp_flags} -oN {workspace}/nmap_udp.txt {vars.nmap_udp_targets}'
        outputs:
          tcp: '{workspace}/nmap_tcp.txt'
          udp: '{workspace}/nmap_udp.txt'
        requires:
          - path: '{workspace}/nmap_tcp.txt'
            min_bytes: 0
          - path: '{workspace}/nmap_udp.txt'
            min_bytes: 0
