services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build: .
    image: k1nzr3c0n:latest
    ports:
      - "${HOST:-127.0.0.1}:${PORT:-8000}:8000"
      - "127.0.0.1:4040:4040"
    volumes:
      - ./runs:/app/runs
      - ./workflows:/app/workflows
      - ./src:/app/src                          # live source — edits in opencode persist to host
      - ./frontend:/app/frontend
      - ./.qwen/skills:/root/.qwen/skills:ro
      # Uncomment to use host wordlists:
      # - ${WORDLISTS_DIR:-./wordlists}:/app/wordlists:ro
    environment:
      - K1NZR3C0N_BASE=/app
      - REDIS_URL=redis://redis:6379/0
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      # ── Security API keys — read from .env, auto-passed to all workflow steps ──
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - SHODAN_API_KEY=${SHODAN_API_KEY}
      - SECURITYTRAILS_KEY=${SECURITYTRAILS_KEY}
      - VIRUSTOTAL_KEY=${VIRUSTOTAL_KEY}
      - BEVIGIL_KEY=${BEVIGIL_KEY}
      - FOFA_KEY=${FOFA_KEY}
      - CENSYS_API_ID=${CENSYS_API_ID}
      - CENSYS_API_SECRET=${CENSYS_API_SECRET}
      - CHAOS_API_KEY=${CHAOS_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Tor proxy — routes waybackurls/gau through Tor to bypass archive.org block ─
  # Worker reads TOR_PROXY env var; only wayback-dependent workflow steps use it.
  # API calls (shodan, netlas, securitytrails…) are NOT routed through Tor.
  tor:
    image: dperson/torproxy:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s --socks5 localhost:9050 https://check.torproject.org/api/ip | grep -q '\"IsTor\":true'"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s

  worker:
    image: k1nzr3c0n:latest
    command: celery -A k1nzr3c0n.tasks worker --loglevel=info --concurrency=4
    volumes:
      - ./runs:/app/runs
      - ./workflows:/app/workflows
      - ./src:/app/src                          # live source — tasks.py edits on host take effect immediately
      - ./scripts:/app/scripts:ro
      - ./.qwen/skills:/root/.qwen/skills:ro
      - nuclei_data:/root/nuclei-templates
      # - ${WORDLISTS_DIR:-./wordlists}:/app/wordlists:ro
    environment:
      - K1NZR3C0N_BASE=/app
      - REDIS_URL=redis://redis:6379/0
      # ── Tor proxy — only wayback steps use this; API keys are NOT routed through Tor
      - TOR_PROXY=socks5h://tor:9050
      # - K1NZR3C0N_WEBHOOK_URL=https://hooks.slack.com/services/...
      # ── Security API keys — all workflow steps run in this container ──────────
      # Set values in .env — worker picks them up automatically on restart.
      # Keys are used as-is; workflow vars are fallback only when env is empty.
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - SHODAN_API_KEY=${SHODAN_API_KEY}
      - SECURITYTRAILS_KEY=${SECURITYTRAILS_KEY}
      - VIRUSTOTAL_KEY=${VIRUSTOTAL_KEY}
      - BEVIGIL_KEY=${BEVIGIL_KEY}
      - FOFA_KEY=${FOFA_KEY}
      - CENSYS_API_ID=${CENSYS_API_ID}
      - CENSYS_API_SECRET=${CENSYS_API_SECRET}
      - CHAOS_API_KEY=${CHAOS_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
      tor:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A k1nzr3c0n.tasks inspect ping -d celery@$$HOSTNAME --timeout 5 2>/dev/null | grep -q OK"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  beat:
    image: k1nzr3c0n:latest
    command: celery -A k1nzr3c0n.tasks beat --loglevel=info --scheduler celery.beat:PersistentScheduler --schedule /var/lib/celerybeat/schedule
    volumes:
      - ./runs:/app/runs
      - ./reports:/app/reports              # required: beat reads DB to dispatch schedules
      - ./workflows:/app/workflows
      - beat_data:/var/lib/celerybeat
    environment:
      - K1NZR3C0N_BASE=/app
      - REDIS_URL=redis://redis:6379/0
      # - K1NZR3C0N_WEBHOOK_URL=https://hooks.slack.com/services/...
      # ── Security API keys — needed for scheduled workflow runs ────────────────
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - SHODAN_API_KEY=${SHODAN_API_KEY}
      - SECURITYTRAILS_KEY=${SECURITYTRAILS_KEY}
      - VIRUSTOTAL_KEY=${VIRUSTOTAL_KEY}
      - BEVIGIL_KEY=${BEVIGIL_KEY}
      - FOFA_KEY=${FOFA_KEY}
      - CENSYS_API_ID=${CENSYS_API_ID}
      - CENSYS_API_SECRET=${CENSYS_API_SECRET}
      - CHAOS_API_KEY=${CHAOS_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  redis_data:
  beat_data:
  nuclei_data:
